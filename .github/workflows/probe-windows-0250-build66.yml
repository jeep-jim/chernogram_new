name: Быстрый статус Windows build 66

on:
  pull_request:
    branches:
      - feature/storage-version-qr-062
    paths:
      - .github/workflows/probe-windows-0250-build66.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  probe:
    runs-on: ubuntu-22.04
    steps:
      - name: Показать последний Windows build 66
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow windows-0250-room-desktop-build66.yml \
            --branch experiment/windows-room-desktop-066 \
            --limit 3 \
            --json databaseId,status,conclusion,url,headSha,createdAt \
            | tee windows-probe.json
          python3 - <<'PY'
          import json
          runs = json.load(open('windows-probe.json', encoding='utf-8'))
          if not runs:
              raise SystemExit('Windows build 66 не найден')
          run = runs[0]
          print('WINDOWS_RUN_ID=' + str(run['databaseId']))
          print('WINDOWS_STATUS=' + str(run['status']))
          print('WINDOWS_CONCLUSION=' + str(run['conclusion']))
          print('WINDOWS_URL=' + str(run['url']))
          PY

      - name: Сохранить быстрый статус
        uses: actions/upload-artifact@v4
        with:
          name: chernogram-windows-build66-probe
          path: windows-probe.json
          if-no-files-found: error
          retention-days: 3
