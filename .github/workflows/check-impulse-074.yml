name: Проверка Impulse transport build 74

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/check-impulse-074.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: chernogram-impulse-check-074
  cancel-in-progress: true

env:
  SOURCE_REF: rebuild/impulse-transport-074
  FLUTTER_VERSION: 3.44.8

jobs:
  check:
    name: Проверить Worker, FCM, чат и WebRTC
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_REF }}
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Применить финальные правки build 74
        shell: bash
        run: |
          set -euo pipefail
          if ! grep -q '_jumpToBottomImmediately' lib/chat_screen.dart; then
            python3 tool/polish_chat_074.py
          fi
          if ! grep -q 'envelope.wake === "none"' worker/impulse/src/index.ts; then
            python3 tool/patch_impulse_worker_074.py
          fi
          python3 tool/finish_impulse_074.py
          dart format \
            lib/main.dart \
            lib/push_service.dart \
            lib/internet_core.dart \
            lib/app_monitor.dart \
            lib/chat_screen.dart \
            lib/light/light_invite_qr.dart
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib worker tool pubspec.yaml android/app/src/main/AndroidManifest.xml
          if ! git diff --cached --quiet; then
            git commit -m "Завершить Impulse transport и UX build 74 [skip ci]"
            git push origin HEAD:${SOURCE_REF}
          fi

      - name: Проверить состав продукта
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'version: 0.51.0+74' pubspec.yaml
          grep -q 'IMPULSE_BASE_URL' lib/internet_core.dart
          grep -q 'firebase_messaging' pubspec.yaml
          grep -q 'CgPushService' lib/main.dart
          grep -q 'LightInviteScannerScreen' lib/light/light_chat_app.dart
          grep -q '_jumpToBottomImmediately' lib/chat_screen.dart
          grep -q '_dismissKeyboard' lib/chat_screen.dart
          grep -q 'BorderRadius.circular(32)' lib/chat_screen.dart
          grep -q 'class Room extends DurableObject' worker/impulse/src/index.ts
          grep -q 'import { DurableObject }' worker/impulse/src/index.ts
          grep -q 'final monitored = recent.toList' lib/app_monitor.dart
          grep -q '(_httpReady && _socket != null)' lib/internet_core.dart
          ! grep -q "'ntfy.sh'" lib/internet_core.dart
          ! grep -q 'class _DialerPage' lib/light/light_chat_app.dart

      - name: Проверить TypeScript Worker
        working-directory: worker/impulse
        run: |
          npm install
          npm run check

      - name: Flutter analyze и тесты
        shell: bash
        run: |
          set -o pipefail
          flutter pub get
          flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee impulse-analyze74.log
          flutter test 2>&1 | tee impulse-tests74.log

      - name: Собрать контрольный APK
        shell: bash
        run: |
          set -o pipefail
          rm -rf android/app/src/main/jniLibs
          flutter build apk \
            --release \
            --target-platform android-arm64 \
            --dart-define=IMPULSE_BASE_URL=https://example.workers.dev \
            --dart-define=FIREBASE_API_KEY=AIzaSyBuildCheckOnly \
            --dart-define=FIREBASE_APP_ID=1:123456789:android:buildcheck \
            --dart-define=FIREBASE_MESSAGING_SENDER_ID=123456789 \
            --dart-define=FIREBASE_PROJECT_ID=chernogram-build-check \
            2>&1 | tee impulse-build74.log
          test -f build/app/outputs/flutter-apk/app-release.apk

      - name: Сохранить диагностику
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chernogram-impulse-check-074
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            impulse-analyze74.log
            impulse-tests74.log
            impulse-build74.log
          if-no-files-found: warn
          retention-days: 7
