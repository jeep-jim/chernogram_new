name: Чернограм 0.79 — интерфейс Чернограма и скрытое ядро Jami

on:
  push:
    branches: [feature/correct-jami-core-079]
    paths:
      - .github/workflows/build-correct-chernogram-jami-079.yml
      - android/app/src/main/kotlin/com/example/chernogram/ChernogramJamiBridge.kt
      - android/app/src/main/kotlin/com/example/chernogram/MainActivity.kt
      - lib/jami_core.dart
      - tool/apply_jami_079.py
      - tool/finalize_jami_079.py
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: chernogram-correct-jami-079
  cancel-in-progress: true

env:
  SOURCE_REF: feature/correct-jami-core-079
  FLUTTER_VERSION: 3.44.8
  VERSION_NAME: 0.79.0
  VERSION_CODE: 79
  JAMI_CLIENT_COMMIT: 8746fd4b186f5a439e7dffc5ad9f484c6ae539a3
  ANDROID_PLATFORM: platforms;android-37
  ANDROID_BUILD_TOOLS: build-tools;37.0.0
  ANDROID_NDK: ndk;29.0.14206865
  ANDROID_CMAKE: cmake;4.1.2
  SWIG_VERSION: 4.3.1
  CERT_SHA256: F4:A2:C8:36:A8:36:71:19:78:10:FA:6E:98:2D:77:F4:C7:31:D0:9B:18:95:15:C0:13:D0:2D:0D:94:2D:9B:BE
  RELEASE_TAG: chernogram-jami-core-0.79-build79

jobs:
  android:
    name: Android — собрать Чернограм с ядром Jami
    runs-on: ubuntu-22.04
    timeout-minutes: 210

    steps:
      - name: Получить исходный интерфейс Чернограма
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_REF }}
          fetch-depth: 0

      - name: Освободить место
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL || true
          sudo apt-get clean
          df -h

      - name: Установить Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Установить Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Установить системные зависимости
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            autoconf automake autopoint bison build-essential ca-certificates \
            curl flex gawk gettext git jq libpcre2-dev libtool-bin m4 nasm \
            ninja-build pkg-config python3 unzip xz-utils yasm

      - name: Установить SWIG 4.3.1
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 12 --retry-all-errors \
            --connect-timeout 20 --max-time 900 \
            "https://downloads.sourceforge.net/project/swig/swig/swig-${SWIG_VERSION}/swig-${SWIG_VERSION}.tar.gz" \
            -o swig.tar.gz
          tar -xzf swig.tar.gz
          cd "swig-${SWIG_VERSION}"
          ./configure --prefix=/usr/local
          make -j2
          sudo make install
          hash -r
          /usr/local/bin/swig -version | grep -F "SWIG Version ${SWIG_VERSION}"
          echo '/usr/local/bin' >> "$GITHUB_PATH"

      - name: Установить Android SDK, NDK и CMake
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort | tail -n 1)
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "$ANDROID_PLATFORM" "$ANDROID_BUILD_TOOLS" "$ANDROID_NDK" "$ANDROID_CMAKE"
          test -d "$ANDROID_HOME/platforms/android-37"
          test -d "$ANDROID_HOME/build-tools/37.0.0"
          test -d "$ANDROID_HOME/ndk/29.0.14206865"
          test -d "$ANDROID_HOME/cmake/4.1.2"

      - name: Применить интеграцию без интерфейса Jami
        shell: bash
        run: |
          set -euo pipefail
          python3 tool/apply_jami_079.py
          python3 tool/finalize_jami_079.py
          python3 - <<'PY'
          from pathlib import Path
          path = Path('android/app/build.gradle.kts')
          text = path.read_text(encoding='utf-8')
          text = text.replace('minSdk = 24', 'minSdk = 26', 1)
          old = '''        jniLibs {
              useLegacyPackaging = true
          }'''
          if old in text:
              text = text.replace(old, '''        jniLibs {
              useLegacyPackaging = true
              pickFirsts += setOf("**/libc++_shared.so")
          }''', 1)
          else:
              old = '''        jniLibs {
              useLegacyPackaging = true
          }'''.replace('              ', '            ')
              if old in text:
                  text = text.replace(old, '''        jniLibs {
              useLegacyPackaging = true
              pickFirsts += setOf("**/libc++_shared.so")
          }'''.replace('              ', '            '), 1)
          path.write_text(text, encoding='utf-8')
          PY
          dart format \
            lib/main.dart \
            lib/core_models.dart \
            lib/internet_core.dart \
            lib/jami_core.dart \
            lib/light/light_chat_app.dart \
            lib/app_monitor.dart \
            lib/chat_screen.dart
          grep -q "class CgJamiTunnelSession" lib/jami_core.dart
          grep -q "jamiOwner" lib/core_models.dart
          grep -q "CgJamiRelay.install" lib/main.dart
          grep -q "preferredFactory" lib/internet_core.dart
          grep -q "ChernogramJamiBridge" android/app/src/main/kotlin/com/example/chernogram/MainActivity.kt
          ! grep -R -n -E "jami a GNU package|Создать учетную запись Jami|cx\.ring" lib android/app/src/main/kotlin/com/example/chernogram || true

      - name: Сохранить интеграционный код в рабочей ветке
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            pubspec.yaml \
            lib/main.dart \
            lib/core_models.dart \
            lib/internet_core.dart \
            lib/jami_core.dart \
            lib/light/light_chat_app.dart \
            lib/app_monitor.dart \
            lib/chat_screen.dart \
            android/app/build.gradle.kts
          if ! git diff --cached --quiet; then
            git commit -m "Подключить ядро Jami под интерфейс Чернограма 0.79 [skip ci]"
            git push origin HEAD:${SOURCE_REF}
          fi

      - name: Восстановить постоянную подпись Чернограма
        uses: actions/cache/restore@v4
        with:
          path: ~/.android/debug.keystore
          key: chernogram-stable-signing-v2
          fail-on-cache-miss: true

      - name: Проверить постоянный сертификат
        shell: bash
        run: |
          set -euo pipefail
          keytool -list -v \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android > chernogram-signing-certificate.txt
          ACTUAL=$(grep -m1 'SHA256:' chernogram-signing-certificate.txt | sed 's/.*SHA256: //' | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')
          EXPECTED=$(printf '%s' "$CERT_SHA256" | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')
          test "$ACTUAL" = "$EXPECTED"

      - name: Получить зафиксированные исходники Jami
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p official
          git init official/jami-client-android
          git -C official/jami-client-android remote add origin \
            https://git.jami.net/savoirfairelinux/jami-client-android.git
          fetched=0
          for attempt in 1 2 3; do
            if git -C official/jami-client-android -c http.version=HTTP/1.1 fetch \
              --depth 1 origin "$JAMI_CLIENT_COMMIT"; then
              fetched=1
              break
            fi
            sleep $((attempt * 20))
          done
          test "$fetched" -eq 1
          git -C official/jami-client-android checkout --detach FETCH_HEAD
          git -C official/jami-client-android submodule sync --recursive
          submodules=0
          for attempt in 1 2 3; do
            if git -C official/jami-client-android -c http.version=HTTP/1.1 submodule update \
              --init --recursive --depth 1 --jobs 4; then
              submodules=1
              break
            fi
            sleep $((attempt * 20))
          done
          test "$submodules" -eq 1
          test "$(git -C official/jami-client-android rev-parse HEAD)" = "$JAMI_CLIENT_COMMIT"
          test -d official/jami-client-android/daemon/bin/jni

      - name: Кэшировать архивы Jami contrib
        uses: actions/cache@v4
        with:
          path: official/jami-client-android/daemon/contrib/tarballs
          key: chernogram-jami-contrib-${{ runner.os }}-${{ env.JAMI_CLIENT_COMMIT }}-v4

      - name: Заранее скачать проблемные GNU-зависимости
        shell: bash
        run: |
          set -euo pipefail
          TARBALLS="$GITHUB_WORKSPACE/official/jami-client-android/daemon/contrib/tarballs"
          mkdir -p "$TARBALLS"
          fetch_fallback() {
            local destination="$1"
            shift
            if [ -s "$destination" ]; then return 0; fi
            rm -f "$destination" "$destination.part"
            local url
            for url in "$@"; do
              if curl --fail --location --retry 12 --retry-all-errors \
                --connect-timeout 20 --max-time 900 "$url" -o "$destination.part"; then
                test -s "$destination.part"
                mv "$destination.part" "$destination"
                return 0
              fi
              rm -f "$destination.part"
            done
            return 1
          }
          fetch_fallback "$TARBALLS/libiconv-1.18.tar.gz" \
            "https://ftp.gnu.org/gnu/libiconv/libiconv-1.18.tar.gz" \
            "https://mirrors.kernel.org/gnu/libiconv/libiconv-1.18.tar.gz" \
            "https://mirrors.ocf.berkeley.edu/gnu/libiconv/libiconv-1.18.tar.gz" \
            "https://ftpmirror.gnu.org/libiconv/libiconv-1.18.tar.gz"
          fetch_fallback "$TARBALLS/gmp-6.3.0.tar.xz" \
            "https://ftp.gnu.org/gnu/gmp/gmp-6.3.0.tar.xz" \
            "https://mirrors.kernel.org/gnu/gmp/gmp-6.3.0.tar.xz" \
            "https://mirrors.ocf.berkeley.edu/gnu/gmp/gmp-6.3.0.tar.xz" \
            "https://ftpmirror.gnu.org/gmp/gmp-6.3.0.tar.xz"
          gzip -t "$TARBALLS/libiconv-1.18.tar.gz"
          xz -t "$TARBALLS/gmp-6.3.0.tar.xz"

      - name: Настроить Jami только как внутреннюю библиотеку Чернограма
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('official/jami-client-android/jami-android/app/build.gradle.kts')
          text = path.read_text(encoding='utf-8')
          old = '-DJAMI_DATADIR=/data/data/$namespace/files'
          new = '-DJAMI_DATADIR=/data/data/com.example.chernogram/files'
          if old not in text:
              raise SystemExit('JAMI_DATADIR marker not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Собрать официальное ядро Jami arm64
        shell: bash
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx5g -Dkotlin.daemon.jvm.options=-Xmx2g -Dfile.encoding=UTF-8
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/official/jami-client-android/jami-android"
          LOG="$GITHUB_WORKSPACE/jami-core-build.log"
          cd "$ROOT"
          chmod +x gradlew
          : > "$LOG"
          for attempt in 1 2 3; do
            echo "===== Jami core attempt ${attempt}/3 =====" | tee -a "$LOG"
            set +e
            ./gradlew --no-daemon --stacktrace --console=plain \
              -Parchs=arm64-v8a :app:assembleNoPushDebug 2>&1 | tee -a "$LOG"
            status=${PIPESTATUS[0]}
            set -e
            if [ "$status" -eq 0 ]; then break; fi
            if [ "$attempt" -eq 3 ]; then exit "$status"; fi
            find "$GITHUB_WORKSPACE/official/jami-client-android/daemon/contrib/tarballs" \
              -type f -size 0 -delete || true
            ./gradlew --stop || true
            sleep $((attempt * 30))
          done
          tail -n 500 "$LOG" > "$GITHUB_WORKSPACE/jami-core-build-tail.log"

      - name: Встроить ядро Jami в приложение Чернограма
        shell: bash
        run: |
          set -euo pipefail
          ROOT="official/jami-client-android/jami-android"
          GENERATED="$ROOT/libjamiclient/src/main/java/net/jami/daemon"
          test -d "$GENERATED"
          test -f "$GENERATED/JamiService.java"
          rm -rf android/app/src/main/java/net/jami/daemon
          mkdir -p android/app/src/main/java/net/jami
          cp -a "$GENERATED" android/app/src/main/java/net/jami/

          JAMI_APK=$(find "$ROOT/app/build/outputs" -type f -iname '*nopush*debug*.apk' -print -quit)
          if [ -z "$JAMI_APK" ]; then
            JAMI_APK=$(find "$ROOT/app/build/outputs" -type f -name '*.apk' -print -quit)
          fi
          test -n "$JAMI_APK"
          test -s "$JAMI_APK"
          rm -rf android/app/src/main/jniLibs/arm64-v8a
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          unzip -j "$JAMI_APK" 'lib/arm64-v8a/libjami-core-jni.so' \
            -d android/app/src/main/jniLibs/arm64-v8a
          unzip -j "$JAMI_APK" 'lib/arm64-v8a/libc++_shared.so' \
            -d android/app/src/main/jniLibs/arm64-v8a
          test -s android/app/src/main/jniLibs/arm64-v8a/libjami-core-jni.so
          test -s android/app/src/main/jniLibs/arm64-v8a/libc++_shared.so
          find android/app/src/main/java/net/jami/daemon -type f | wc -l | tee jami-generated-java-count.txt
          ls -lh android/app/src/main/jniLibs/arm64-v8a | tee jami-native-files.txt

      - name: Получить зависимости и проверить интерфейс Чернограма
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get
          flutter analyze --no-fatal-infos --no-fatal-warnings
          flutter test

      - name: Собрать Android Чернограм arm64
        shell: bash
        run: |
          set -o pipefail
          set +e
          flutter build apk --release --target-platform android-arm64 2>&1 | tee chernogram-build.log
          STATUS=${PIPESTATUS[0]}
          set -e
          tail -n 500 chernogram-build.log > chernogram-build-tail.log
          test "$STATUS" = "0"
          test -s build/app/outputs/flutter-apk/app-release.apk

      - name: Подписать и проверить правильный APK
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_APK=build/app/outputs/flutter-apk/app-release.apk
          ZIPALIGN=$(find "$ANDROID_HOME/build-tools" -type f -name zipalign | sort -V | tail -n 1)
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)
          "$ZIPALIGN" -p -f 4 "$SOURCE_APK" chernogram-aligned.apk
          "$APKSIGNER" sign \
            --ks "$HOME/.android/debug.keystore" \
            --ks-key-alias androiddebugkey \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out chernogram-0.79.0-build79.apk \
            chernogram-aligned.apk
          "$APKSIGNER" verify --print-certs chernogram-0.79.0-build79.apk | tee apk-signature.txt
          ACTUAL=$(grep -m1 'SHA-256 digest:' apk-signature.txt | sed 's/.*digest: //' | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')
          EXPECTED=$(printf '%s' "$CERT_SHA256" | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')
          test "$ACTUAL" = "$EXPECTED"
          "$AAPT" dump badging chernogram-0.79.0-build79.apk | tee apk-badging.txt
          grep -q "package: name='com.example.chernogram'" apk-badging.txt
          grep -q "versionCode='79'" apk-badging.txt
          grep -q "versionName='0.79.0'" apk-badging.txt
          grep -q "application-label:'Чернограм'" apk-badging.txt
          unzip -l chernogram-0.79.0-build79.apk | tee apk-files.txt
          grep -q 'lib/arm64-v8a/libjami-core-jni.so' apk-files.txt
          ! grep -q 'cx/ring/client/HomeActivity' apk-files.txt
          sha256sum chernogram-0.79.0-build79.apk | tee apk-sha256.txt
          stat -c '%s bytes' chernogram-0.79.0-build79.apk | tee apk-size.txt

      - name: Создать технический манифест тестовой версии
        shell: bash
        run: |
          set -euo pipefail
          SHA=$(cut -d' ' -f1 apk-sha256.txt)
          cat > chernogram-0.79.0-build79.json <<EOF
          {
            "versionName": "${VERSION_NAME}",
            "versionCode": ${VERSION_CODE},
            "package": "com.example.chernogram",
            "transport": "embedded-jami-core",
            "jamiClientCommit": "${JAMI_CLIENT_COMMIT}",
            "sha256": "${SHA}",
            "certificateSha256": "${CERT_SHA256}",
            "notesRu": "Сохранён интерфейс Чернограма. Официальное ядро Jami встроено внутрь как транспорт; интерфейс и регистрация Jami пользователю не показываются."
          }
          EOF
          python3 -m json.tool chernogram-0.79.0-build79.json >/dev/null

      - name: Опубликовать отдельную тестовую ссылку
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release delete "$RELEASE_TAG" --cleanup-tag -y || true
          gh release create "$RELEASE_TAG" \
            chernogram-0.79.0-build79.apk \
            chernogram-0.79.0-build79.json \
            apk-sha256.txt \
            apk-signature.txt \
            apk-badging.txt \
            --target "$SOURCE_REF" \
            --title "Чернограм 0.79.0+79 — скрытое ядро Jami" \
            --notes "Тестовая Android-сборка с сохранённым интерфейсом Чернограма и встроенным ядром Jami. Не является переименованным приложением Jami." \
            --prerelease

      - name: Сохранить APK и доказательства
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chernogram-correct-jami-0.79-build79
          path: |
            chernogram-0.79.0-build79.apk
            chernogram-0.79.0-build79.json
            apk-sha256.txt
            apk-signature.txt
            apk-badging.txt
            apk-files.txt
            apk-size.txt
            jami-native-files.txt
            jami-generated-java-count.txt
            jami-core-build-tail.log
            chernogram-build-tail.log
          if-no-files-found: warn
          retention-days: 14
