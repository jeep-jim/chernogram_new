name: Чернограм 0.24.2+62 — диск, версия, QR и единый логотип

on:
  push:
    branches:
      - feature/storage-version-qr-062
    paths:
      - .github/workflows/apply-storage-version-qr-062.yml
  workflow_dispatch:

permissions:
  contents: write

env:
  VERSION_FULL: 0.24.2+62
  VERSION_NAME: 0.24.2
  VERSION_CODE: 62
  RELEASE_TAG: chernogram-0.24.2-build62
  FLUTTER_VERSION: 3.44.8
  CERT_SHA256: "F4:A2:C8:36:A8:36:71:19:78:10:FA:6E:98:2D:77:F4:C7:31:D0:9B:18:95:15:C0:13:D0:2D:0D:94:2D:9B:BE"

jobs:
  build_publish:
    name: Внести изменения, собрать APK и включить обновление
    runs-on: ubuntu-22.04
    timeout-minutes: 110

    steps:
      - name: Получить актуальный интерфейс
        uses: actions/checkout@v4
        with:
          ref: feature/storage-version-qr-062
          fetch-depth: 0

      - name: Добавить функции без изменения остального интерфейса
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          source_path = Path('lib/android_data_first.dart')
          text = source_path.read_text(encoding='utf-8')

          def replace_once(value: str, old: str, new: str, label: str) -> str:
              count = value.count(old)
              if count != 1:
                  raise RuntimeError(f'{label}: expected exactly one anchor, found {count}')
              return value.replace(old, new, 1)

          text = replace_once(
              text,
              "import 'package:flutter/material.dart';\n",
              "import 'package:flutter/material.dart';\n"
              "import 'package:flutter/services.dart';\n",
              'Flutter services import',
          )
          text = replace_once(
              text,
              "import 'package:open_filex/open_filex.dart';\n",
              "import 'package:open_filex/open_filex.dart';\n"
              "import 'package:package_info_plus/package_info_plus.dart';\n"
              "import 'package:qr_flutter/qr_flutter.dart';\n",
              'version and QR imports',
          )

          files_state = """class _FilesPageState extends State<_FilesPage> {
            final _search = TextEditingController();
            int _filter = 0;
            bool _busy = false;
            final Set<String> _selectedFileIds = <String>{};
          """
          files_state_new = """class _FilesPageState extends State<_FilesPage> {
            static const MethodChannel _storageChannel =
                MethodChannel('chernogram/storage');

            final _search = TextEditingController();
            int _filter = 0;
            bool _busy = false;
            final Set<String> _selectedFileIds = <String>{};
            int? _storageFreeBytes;
            int? _storageTotalBytes;
            bool _storageLoading = true;

            @override
            void initState() {
              super.initState();
              unawaited(_loadStorageStats());
            }

            Future<void> _loadStorageStats() async {
              if (mounted) setState(() => _storageLoading = true);
              try {
                final raw = await _storageChannel.invokeMapMethod<String, dynamic>(
                  'getStorageStats',
                );
                final free = raw?['freeBytes'];
                final total = raw?['totalBytes'];
                if (!mounted) return;
                setState(() {
                  _storageFreeBytes = free is num ? free.toInt() : null;
                  _storageTotalBytes = total is num ? total.toInt() : null;
                  _storageLoading = false;
                });
              } catch (_) {
                if (!mounted) return;
                setState(() {
                  _storageFreeBytes = null;
                  _storageTotalBytes = null;
                  _storageLoading = false;
                });
              }
            }

            String _diskSize(int? bytes) {
              if (bytes == null || bytes < 0) return '—';
              const kb = 1024.0;
              const mb = kb * 1024;
              const gb = mb * 1024;
              if (bytes >= gb) return '${(bytes / gb).toStringAsFixed(1)} ГБ';
              if (bytes >= mb) return '${(bytes / mb).toStringAsFixed(1)} МБ';
              if (bytes >= kb) return '${(bytes / kb).toStringAsFixed(1)} КБ';
              return '$bytes Б';
            }

            Widget _storageCard(BuildContext context) {
              final total = _storageTotalBytes;
              final free = _storageFreeBytes;
              final used = total != null && free != null
                  ? (total - free).clamp(0, total)
                  : null;
              final ratio = total != null && total > 0 && used != null
                  ? (used / total).clamp(0.0, 1.0)
                  : 0.0;
              final scheme = Theme.of(context).colorScheme;
              return Material(
                color: scheme.surface,
                borderRadius: BorderRadius.circular(22),
                child: Padding(
                  padding: const EdgeInsets.fromLTRB(15, 13, 10, 13),
                  child: Column(
                    crossAxisAlignment: CrossAxisAlignment.start,
                    children: [
                      Row(
                        children: [
                          Container(
                            width: 42,
                            height: 42,
                            decoration: BoxDecoration(
                              color: scheme.primary.withValues(alpha: .13),
                              borderRadius: BorderRadius.circular(14),
                            ),
                            child: const Icon(Icons.storage_rounded),
                          ),
                          const SizedBox(width: 11),
                          Expanded(
                            child: Column(
                              crossAxisAlignment: CrossAxisAlignment.start,
                              children: [
                                Text(
                                  widget.ru ? 'Память устройства' : 'Device storage',
                                  style: const TextStyle(fontWeight: FontWeight.w900),
                                ),
                                const SizedBox(height: 2),
                                Text(
                                  _storageLoading
                                      ? (widget.ru ? 'Считаем свободное место…' : 'Reading free space…')
                                      : (widget.ru
                                          ? 'Свободно ${_diskSize(free)} из ${_diskSize(total)}'
                                          : '${_diskSize(free)} free of ${_diskSize(total)}'),
                                  style: TextStyle(
                                    fontSize: 11.5,
                                    color: scheme.onSurface.withValues(alpha: .56),
                                  ),
                                ),
                              ],
                            ),
                          ),
                          IconButton(
                            tooltip: widget.ru ? 'Обновить' : 'Refresh',
                            onPressed: _storageLoading ? null : _loadStorageStats,
                            icon: _storageLoading
                                ? const SizedBox.square(
                                    dimension: 18,
                                    child: CircularProgressIndicator(strokeWidth: 2),
                                  )
                                : const Icon(Icons.refresh_rounded),
                          ),
                        ],
                      ),
                      const SizedBox(height: 10),
                      ClipRRect(
                        borderRadius: BorderRadius.circular(99),
                        child: LinearProgressIndicator(
                          value: _storageLoading ? null : ratio,
                          minHeight: 7,
                          backgroundColor: scheme.surfaceContainerHighest,
                        ),
                      ),
                      const SizedBox(height: 7),
                      Row(
                        children: [
                          Expanded(
                            child: Text(
                              '${widget.ru ? 'Занято' : 'Used'}: ${_diskSize(used)}',
                              style: const TextStyle(fontSize: 11, fontWeight: FontWeight.w700),
                            ),
                          ),
                          Text(
                            '${widget.ru ? 'Свободно' : 'Free'}: ${_diskSize(free)}',
                            style: const TextStyle(fontSize: 11, fontWeight: FontWeight.w700),
                          ),
                        ],
                      ),
                    ],
                  ),
                ),
              );
            }
          """
          text = replace_once(text, files_state, files_state_new, 'files storage state')

          search_anchor = """              prefixIcon: const Icon(Icons.search_rounded),
                    ),
                  ),
                ),
                Padding(
                  padding: const EdgeInsets.symmetric(horizontal: 14),
          """
          search_replacement = """              prefixIcon: const Icon(Icons.search_rounded),
                    ),
                  ),
                ),
                Padding(
                  padding: const EdgeInsets.fromLTRB(14, 0, 14, 9),
                  child: _storageCard(context),
                ),
                Padding(
                  padding: const EdgeInsets.symmetric(horizontal: 14),
          """
          text = replace_once(text, search_anchor, search_replacement, 'storage card placement')

          security_anchor = """      builder: (context) => _SecuritySheet(
                    ru: ru,
                    profile: profile,
                    tunnels: tunnels,
                    contacts: contacts,
                    onRestore: onRestore,
                  ),
                );
              }

              @override
          """
          product_method = """      builder: (context) => _SecuritySheet(
                    ru: ru,
                    profile: profile,
                    tunnels: tunnels,
                    contacts: contacts,
                    onRestore: onRestore,
                  ),
                );
              }

              Future<void> _showProductInfo(BuildContext context) async {
                final info = await PackageInfo.fromPlatform();
                if (!context.mounted) return;
                await showModalBottomSheet<void>(
                  context: context,
                  isScrollControlled: true,
                  showDragHandle: true,
                  builder: (sheetContext) => SafeArea(
                    child: SingleChildScrollView(
                      padding: const EdgeInsets.fromLTRB(18, 0, 18, 24),
                      child: Column(
                        mainAxisSize: MainAxisSize.min,
                        children: [
                          const ChernogramLogo(size: 86),
                          const SizedBox(height: 12),
                          const Text(
                            'Чернограм',
                            style: TextStyle(fontSize: 24, fontWeight: FontWeight.w900),
                          ),
                          const SizedBox(height: 4),
                          Text(
                            '${ru ? 'Версия' : 'Version'} ${info.version} • ${ru ? 'сборка' : 'build'} ${info.buildNumber}',
                            style: TextStyle(
                              color: Theme.of(sheetContext)
                                  .colorScheme
                                  .onSurface
                                  .withValues(alpha: .58),
                              fontWeight: FontWeight.w700,
                            ),
                          ),
                          const SizedBox(height: 17),
                          Container(
                            padding: const EdgeInsets.all(12),
                            decoration: BoxDecoration(
                              color: Colors.white,
                              borderRadius: BorderRadius.circular(24),
                            ),
                            child: QrImageView(
                              data: _landingBase,
                              size: 202,
                              backgroundColor: Colors.white,
                            ),
                          ),
                          const SizedBox(height: 13),
                          Text(
                            ru
                                ? 'Отсканируйте QR-код, чтобы открыть страницу Чернограма и установить актуальную версию.'
                                : 'Scan the QR code to open Chernogram and install the current version.',
                            textAlign: TextAlign.center,
                          ),
                          const SizedBox(height: 10),
                          SelectableText(
                            _landingBase,
                            textAlign: TextAlign.center,
                            style: TextStyle(
                              fontSize: 11,
                              color: Theme.of(sheetContext)
                                  .colorScheme
                                  .onSurface
                                  .withValues(alpha: .55),
                            ),
                          ),
                          const SizedBox(height: 14),
                          Row(
                            children: [
                              Expanded(
                                child: OutlinedButton.icon(
                                  onPressed: () async {
                                    await Clipboard.setData(
                                      const ClipboardData(text: _landingBase),
                                    );
                                    if (!sheetContext.mounted) return;
                                    ScaffoldMessenger.of(sheetContext).showSnackBar(
                                      SnackBar(
                                        content: Text(
                                          ru ? 'Ссылка скопирована.' : 'Link copied.',
                                        ),
                                      ),
                                    );
                                  },
                                  icon: const Icon(Icons.copy_rounded),
                                  label: Text(ru ? 'Копировать' : 'Copy'),
                                ),
                              ),
                              const SizedBox(width: 9),
                              Expanded(
                                child: FilledButton.icon(
                                  onPressed: () => Share.share(
                                    ru
                                        ? 'Чернограм — чаты, файлы и звонки:\n$_landingBase'
                                        : 'Chernogram — chats, files and calls:\n$_landingBase',
                                    subject: 'Чернограм',
                                  ),
                                  icon: const Icon(Icons.ios_share_rounded),
                                  label: Text(ru ? 'Поделиться' : 'Share'),
                                ),
                              ),
                            ],
                          ),
                        ],
                      ),
                    ),
                  ),
                );
              }

              @override
          """
          text = replace_once(text, security_anchor, product_method, 'product info sheet')

          update_action = """      _ProfileAction(
                    icon: Icons.system_update_alt_rounded,
                    title: ru ? 'Проверить обновления' : 'Check updates',
                    subtitle: ru
                        ? 'Обновления Android устанавливаются прямо из приложения.'
                        : 'Android updates install directly from the app.',
                    onTap: onCheckUpdates,
                  ),
          """
          update_action_new = """      _ProfileAction(
                    icon: Icons.qr_code_2_rounded,
                    title: ru ? 'Версия и поделиться' : 'Version and share',
                    subtitle: ru
                        ? 'Номер версии, ссылка установки и QR-код.'
                        : 'Product version, installation link, and QR code.',
                    onTap: () => _showProductInfo(context),
                  ),
                  const SizedBox(height: 8),
                  _ProfileAction(
                    icon: Icons.system_update_alt_rounded,
                    title: ru ? 'Проверить обновления' : 'Check updates',
                    subtitle: ru
                        ? 'Обновления Android устанавливаются прямо из приложения.'
                        : 'Android updates install directly from the app.',
                    onTap: onCheckUpdates,
                  ),
          """
          text = replace_once(text, update_action, update_action_new, 'profile product action')
          source_path.write_text(text, encoding='utf-8')

          icon = '''<vector xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:aapt="http://schemas.android.com/aapt"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="1080"
              android:viewportHeight="1080">
              <path
                  android:fillColor="#070A12"
                  android:pathData="M180,70 H900 A110,110 0,0 1,1010 180 V900 A110,110 0,0 1,900 1010 H180 A110,110 0,0 1,70 900 V180 A110,110 0,0 1,180 70 Z" />
              <path
                  android:fillColor="@android:color/transparent"
                  android:strokeWidth="22.8571"
                  android:strokeLineCap="round"
                  android:pathData="M151.20,248.40 L151.20,480.60 M206.74,181.65 L206.74,686.26 M262.29,157.70 L262.29,399.60 M262.29,480.60 L262.29,763.50 M317.83,142.04 L317.83,399.60 M317.83,480.60 L317.83,815.87 M373.37,131.31 L373.37,399.60 M373.37,480.60 L373.37,853.48 M428.91,124.20 L428.91,399.60 M428.91,480.60 L428.91,880.19 M484.46,120.13 L484.46,897.81 M540.00,118.80 L540.00,907.20 M595.54,120.13 L595.54,897.81 M651.09,124.20 L651.09,399.60 M651.09,480.60 L651.09,880.19 M706.63,131.31 L706.63,399.60 M706.63,480.60 L706.63,853.48 M762.17,142.04 L762.17,399.60 M762.17,480.60 L762.17,815.87 M817.71,157.70 L817.71,399.60 M817.71,480.60 L817.71,763.50 M873.26,181.65 L873.26,686.26 M928.80,248.40 L928.80,480.60">
                  <aapt:attr name="android:strokeColor">
                      <gradient
                          android:type="linear"
                          android:startX="540"
                          android:startY="118.8"
                          android:endX="540"
                          android:endY="907.2">
                          <item android:offset="0" android:color="#B9A8FF" />
                          <item android:offset="0.52" android:color="#7B5CFF" />
                          <item android:offset="1" android:color="#20C7FF" />
                      </gradient>
                  </aapt:attr>
              </path>
          </vector>
          '''
          Path('android/app/src/main/res/drawable/chernogram_launcher_icon.xml').write_text(
              icon, encoding='utf-8'
          )

          docs_path = Path('docs/index.html')
          docs = docs_path.read_text(encoding='utf-8')
          svg_start = docs.index('  <svg class="logo"')
          svg_end = docs.index('  </svg>', svg_start) + len('  </svg>')
          face_path = ('M151.20,248.40 L151.20,480.60 M206.74,181.65 L206.74,686.26 '
              'M262.29,157.70 L262.29,399.60 M262.29,480.60 L262.29,763.50 '
              'M317.83,142.04 L317.83,399.60 M317.83,480.60 L317.83,815.87 '
              'M373.37,131.31 L373.37,399.60 M373.37,480.60 L373.37,853.48 '
              'M428.91,124.20 L428.91,399.60 M428.91,480.60 L428.91,880.19 '
              'M484.46,120.13 L484.46,897.81 M540.00,118.80 L540.00,907.20 '
              'M595.54,120.13 L595.54,897.81 M651.09,124.20 L651.09,399.60 '
              'M651.09,480.60 L651.09,880.19 M706.63,131.31 L706.63,399.60 '
              'M706.63,480.60 L706.63,853.48 M762.17,142.04 L762.17,399.60 '
              'M762.17,480.60 L762.17,815.87 M817.71,157.70 L817.71,399.60 '
              'M817.71,480.60 L817.71,763.50 M873.26,181.65 L873.26,686.26 '
              'M928.80,248.40 L928.80,480.60')
          svg = f'''  <svg class="logo" viewBox="0 0 1080 1080" aria-label="Чернограм">
            <defs>
              <linearGradient id="faceGradient" x1="0" y1="0" x2="0" y2="1">
                <stop stop-color="#B9A8FF"/>
                <stop offset=".52" stop-color="#7B5CFF"/>
                <stop offset="1" stop-color="#20C7FF"/>
              </linearGradient>
            </defs>
            <rect x="70" y="70" width="940" height="940" rx="110" fill="#070A12"/>
            <path d="{face_path}" fill="none" stroke="url(#faceGradient)" stroke-width="22.8571" stroke-linecap="round"/>
          </svg>'''
          docs = docs[:svg_start] + svg + docs[svg_end:]
          docs = docs.replace(
              'href="https://github.com/jeep-jim/chernogram_new/releases/download/latest-apk/chernogram.apk?v=15"',
              'href="https://github.com/jeep-jim/chernogram_new/releases"',
          )
          docs = docs.replace(
              "const apk = 'https://github.com/jeep-jim/chernogram_new/releases/download/latest-apk/chernogram.apk?v=15';",
              "let apk = 'https://github.com/jeep-jim/chernogram_new/releases';",
          )
          fetch_anchor = """  const status = document.getElementById('status');

              openButton.href = isAndroid ? androidIntent : deep;
              androidButton.href = apk;
          """
          fetch_replacement = """  const status = document.getElementById('status');

              fetch('https://raw.githubusercontent.com/jeep-jim/chernogram_new/main/update.json', {cache: 'no-store'})
                .then(response => response.ok ? response.json() : Promise.reject(response.status))
                .then(update => {
                  if (update && typeof update.apkUrl === 'string' && update.apkUrl.startsWith('https://')) {
                    apk = update.apkUrl;
                    androidButton.href = apk;
                  }
                })
                .catch(() => {});

              openButton.href = isAndroid ? androidIntent : deep;
              androidButton.href = apk;
          """
          if fetch_anchor not in docs:
              raise RuntimeError('docs dynamic update anchor missing')
          docs = docs.replace(fetch_anchor, fetch_replacement, 1)
          docs_path.write_text(docs, encoding='utf-8')

          pubspec = Path('pubspec.yaml')
          pub = pubspec.read_text(encoding='utf-8')
          if 'version: 0.23.3+58' not in pub:
              raise RuntimeError('unexpected source version')
          pubspec.write_text(pub.replace('version: 0.23.3+58', 'version: 0.24.2+62', 1), encoding='utf-8')
          PY

          dart format lib/android_data_first.dart
          grep -q "MethodChannel('chernogram/storage')" lib/android_data_first.dart
          grep -q "QrImageView" lib/android_data_first.dart
          grep -q "PackageInfo.fromPlatform" lib/android_data_first.dart
          grep -q "version: 0.24.2+62" pubspec.yaml
          grep -q "M151.20,248.40" android/app/src/main/res/drawable/chernogram_launcher_icon.xml
          grep -q "class _ChernogramFacePainter" lib/brand.dart
          ! grep -q "class _ChernogramMarkPainter" lib/brand.dart

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-storage-version-qr-062.yml
          git add lib/android_data_first.dart pubspec.yaml \
            android/app/src/main/res/drawable/chernogram_launcher_icon.xml \
            docs/index.html
          git commit -m "Добавить память диска, версию, QR и единый логотип 0.24.2+62"
          git push origin HEAD:feature/storage-version-qr-062

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - uses: actions/cache/restore@v4
        with:
          path: ~/.android/debug.keystore
          key: chernogram-stable-signing-v2
          fail-on-cache-miss: false

      - name: Проверить подпись
        shell: bash
        env:
          CHERNOGRAM_KEYSTORE_B64: ${{ secrets.CHERNOGRAM_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          if [ -n "${CHERNOGRAM_KEYSTORE_B64:-}" ]; then
            printf '%s' "$CHERNOGRAM_KEYSTORE_B64" | base64 --decode > "$HOME/.android/debug.keystore"
            chmod 600 "$HOME/.android/debug.keystore"
          fi
          test -s "$HOME/.android/debug.keystore"
          keytool -list -v \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android > certificate.txt
          ACTUAL=$(grep -m1 'SHA256:' certificate.txt | sed 's/.*SHA256: //' | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')
          EXPECTED=$(printf '%s' "$CERT_SHA256" | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')
          test "$ACTUAL" = "$EXPECTED"

      - name: Собрать и проверить APK
        shell: bash
        run: |
          set -o pipefail
          (
            set -euo pipefail
            flutter pub get
            flutter analyze --no-fatal-infos --no-fatal-warnings
            flutter test
            flutter build apk --release

            SOURCE_APK=build/app/outputs/flutter-apk/app-release.apk
            test -s "$SOURCE_APK"
            APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
            AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)

            "$APKSIGNER" sign \
              --ks "$HOME/.android/debug.keystore" \
              --ks-key-alias androiddebugkey \
              --ks-pass pass:android \
              --key-pass pass:android \
              --out chernogram.apk \
              "$SOURCE_APK"

            "$APKSIGNER" verify --print-certs chernogram.apk | tee apk-signature.txt
            "$AAPT" dump badging chernogram.apk | tee apk-badging.txt
            grep -q "versionCode='$VERSION_CODE'" apk-badging.txt
            grep -q "versionName='$VERSION_NAME'" apk-badging.txt
            sha256sum chernogram.apk | tee apk-sha256.txt
          ) 2>&1 | tee build-062.log

      - name: Создать манифест обновления
        shell: bash
        run: |
          set -euo pipefail
          APK_SHA=$(awk '{print $1}' apk-sha256.txt)
          cat > update-build62.json <<EOF
          {
            "versionName": "${VERSION_NAME}",
            "versionCode": ${VERSION_CODE},
            "apkUrl": "https://github.com/jeep-jim/chernogram_new/releases/download/${RELEASE_TAG}/chernogram.apk?v=${VERSION_CODE}",
            "sha256": "${APK_SHA}",
            "certificateSha256": "${CERT_SHA256}",
            "notesRu": "Чернограм 0.24.2 показывает занятое, свободное и общее место на диске в разделе Файлы; показывает точную версию и номер сборки; добавляет ссылку и QR-код для передачи приложения. Иконка Android теперь повторяет новый полосатый логотип внутри приложения по той же геометрии.",
            "notesEn": "Chernogram 0.24.2 shows used, free, and total device storage in Files; shows the exact app version and build; and adds a shareable installation link with a QR code. The Android launcher icon now uses the same geometry as the striped in-app logo."
          }
          EOF
          python -m json.tool update-build62.json >/dev/null
          cp update-build62.json /tmp/chernogram-update-build62.json

      - name: Создать Release 0.24.2+62
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release delete "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes || true
          gh release create "$RELEASE_TAG" \
            chernogram.apk update-build62.json apk-sha256.txt apk-signature.txt apk-badging.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target feature/storage-version-qr-062 \
            --title "Чернограм 0.24.2+62 — диск, версия, QR и единый логотип" \
            --notes "Актуальный интерфейс, отображение памяти, версия продукта, QR-ссылка и точная Android-иконка. Собственный сервер не требуется." \
            --prerelease
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null

      - name: Включить обновление в приложении
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          rm -rf /tmp/chernogram-publish-062
          git worktree add -B publish-062 /tmp/chernogram-publish-062 origin/main
          cd /tmp/chernogram-publish-062
          SUCCESS=0
          for ATTEMPT in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/chernogram-update-build62.json update.json
            cat > BUILD62_STATUS.md <<EOF
          Chernogram build 62 published
          Version: ${VERSION_FULL}
          Source: feature/storage-version-qr-062
          Release: ${RELEASE_TAG}
          Device storage card: enabled
          Product version and build: enabled
          Share link and QR: enabled
          Android launcher icon: exact striped-face geometry
          Private server: not required
          Time: $(date -u +'%Y-%m-%dT%H:%M:%SZ')
          EOF
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add update.json BUILD62_STATUS.md
            git commit -m "Включить обновление Чернограма 0.24.2+62 [skip ci]"
            if git push origin HEAD:main; then
              SUCCESS=1
              break
            fi
            sleep 3
          done
          test "$SUCCESS" = "1"

      - name: Проверить публикацию
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "/repos/${GITHUB_REPOSITORY}/contents/update.json?ref=main" \
            --jq '.content' | tr -d '\n' | base64 --decode > published-update.json
          python -m json.tool published-update.json >/dev/null
          grep -q '"versionCode": 62' published-update.json
          grep -q "$RELEASE_TAG/chernogram.apk" published-update.json
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null

      - name: Выдать APK и журналы
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chernogram-0.24.2-build62
          path: |
            chernogram.apk
            update-build62.json
            published-update.json
            apk-signature.txt
            apk-badging.txt
            apk-sha256.txt
            build-062.log
          if-no-files-found: warn
          retention-days: 14
