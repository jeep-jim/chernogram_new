name: Diagnose Chernogram 0.24 second-day core

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/second-day-core-024-diagnose.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cernogram-second-day-core-024-diagnose
  cancel-in-progress: true

env:
  SOURCE_BRANCH: fix/second-day-core-024

jobs:
  diagnose:
    runs-on: ubuntu-22.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_BRANCH }}
          fetch-depth: 0
      - run: git fetch --tags --force
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
      - name: Restore second-day transport and diagnose current UI
        id: diagnose
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          (
            set -euo pipefail
            python tooling/materialize_second_day_core_024.py
            flutter pub get
            dart format lib
            flutter analyze --no-fatal-infos --no-fatal-warnings
            flutter test
          ) 2>&1 | tee /tmp/second-day-core-024.log
      - name: Save exact compatibility result
        if: always()
        shell: bash
        env:
          OUTCOME: ${{ steps.diagnose.outcome }}
        run: |
          set -euo pipefail
          cp /tmp/second-day-core-024.log /tmp/diagnostic.log 2>/dev/null || true
          git fetch origin "$SOURCE_BRANCH"
          git reset --hard "origin/$SOURCE_BRANCH"
          {
            echo '# Chernogram 0.24 second-day core diagnostics'
            echo
            echo "Outcome: ${OUTCOME}"
            echo 'Historical transport: d696e470cb96e61a0e5cc29c9e335b5da5a8f69b'
            echo "Source: ${SOURCE_BRANCH}"
            echo "Time: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo
            echo '```text'
            tail -n 1800 /tmp/diagnostic.log 2>/dev/null || true
            echo '```'
          } > SECOND_DAY_CORE_024_DIAGNOSTICS.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SECOND_DAY_CORE_024_DIAGNOSTICS.md
          git commit -m "Сохранить диагностику ядра второго дня 0.24 [skip ci]" || true
          git push origin HEAD:"$SOURCE_BRANCH"
          test "$OUTCOME" = success
