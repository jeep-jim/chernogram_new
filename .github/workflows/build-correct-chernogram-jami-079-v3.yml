name: Чернограм 0.79 v3 — скрытое ядро Jami из кэша

on:
  push:
    branches: [feature/correct-jami-core-079]
    paths:
      - .github/workflows/build-correct-chernogram-jami-079-v3.yml
      - android/app/src/main/kotlin/com/example/chernogram/ChernogramJamiBridge.kt
      - android/app/src/main/kotlin/com/example/chernogram/MainActivity.kt
      - lib/jami_core.dart
      - tool/apply_jami_079.py
      - tool/finalize_jami_079.py
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: chernogram-correct-jami-079-v3
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.44.8
  JAMI_CLIENT_COMMIT: 8746fd4b186f5a439e7dffc5ad9f484c6ae539a3
  SWIG_VERSION: 4.3.1
  CERT_SHA256: F4:A2:C8:36:A8:36:71:19:78:10:FA:6E:98:2D:77:F4:C7:31:D0:9B:18:95:15:C0:13:D0:2D:0D:94:2D:9B:BE
  RELEASE_TAG: chernogram-jami-core-0.79-build79

jobs:
  android:
    name: Android — настоящий Чернограм с Jami
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      - name: Получить исходники Чернограма
        uses: actions/checkout@v4
        with:
          ref: feature/correct-jami-core-079
          fetch-depth: 0

      - name: Освободить место
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL || true
          sudo apt-get clean
          df -h

      - name: Установить Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Установить Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Установить инструменты
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            autoconf automake autopoint bison build-essential ca-certificates \
            curl flex gawk gettext git jq libpcre2-dev libtool-bin m4 nasm \
            ninja-build pkg-config python3 unzip xz-utils yasm
          curl --fail --location --retry 5 --retry-all-errors \
            --connect-timeout 20 --max-time 300 \
            "https://downloads.sourceforge.net/project/swig/swig/swig-${SWIG_VERSION}/swig-${SWIG_VERSION}.tar.gz" \
            -o swig.tar.gz
          tar -xzf swig.tar.gz
          cd "swig-${SWIG_VERSION}"
          ./configure --prefix=/usr/local
          make -j2
          sudo make install
          /usr/local/bin/swig -version | grep -F "SWIG Version ${SWIG_VERSION}"
          echo '/usr/local/bin' >> "$GITHUB_PATH"

      - name: Установить Android 36, NDK и CMake
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort | tail -n 1)
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" \
            "platforms;android-36" \
            "build-tools;36.1.0" \
            "ndk;29.0.14206865" \
            "cmake;4.1.2"

      - name: Применить интеграцию к интерфейсу Чернограма
        shell: bash
        run: |
          set -euo pipefail
          python3 tool/apply_jami_079.py
          python3 tool/finalize_jami_079.py
          python3 - <<'PY'
          from pathlib import Path
          path = Path('android/app/build.gradle.kts')
          text = path.read_text(encoding='utf-8')
          text = text.replace('minSdk = 24', 'minSdk = 26', 1)
          marker = 'useLegacyPackaging = true'
          if marker in text and 'pickFirsts += setOf("**/libc++_shared.so")' not in text:
              text = text.replace(marker, marker + '\n            pickFirsts += setOf("**/libc++_shared.so")', 1)
          path.write_text(text, encoding='utf-8')
          PY
          dart format \
            lib/main.dart lib/core_models.dart lib/internet_core.dart \
            lib/jami_core.dart lib/light/light_chat_app.dart \
            lib/app_monitor.dart lib/chat_screen.dart
          grep -q 'class CgJamiTunnelSession' lib/jami_core.dart
          grep -q 'CgJamiRelay.install' lib/main.dart
          grep -q 'preferredFactory' lib/internet_core.dart
          grep -q 'jamiOwner' lib/core_models.dart

      - name: Восстановить постоянную подпись Чернограма
        uses: actions/cache/restore@v4
        with:
          path: ~/.android/debug.keystore
          key: chernogram-stable-signing-v2
          fail-on-cache-miss: true

      - name: Проверить сертификат подписи
        shell: bash
        run: |
          set -euo pipefail
          keytool -list -v \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android > chernogram-signing-certificate.txt
          ACTUAL=$(grep -m1 'SHA256:' chernogram-signing-certificate.txt | sed 's/.*SHA256: //' | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')
          EXPECTED=$(printf '%s' "$CERT_SHA256" | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')
          test "$ACTUAL" = "$EXPECTED"

      - name: Получить зафиксированные исходники Jami
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p official
          git init official/jami-client-android
          git -C official/jami-client-android remote add origin https://git.jami.net/savoirfairelinux/jami-client-android.git
          for attempt in 1 2 3; do
            git -C official/jami-client-android -c http.version=HTTP/1.1 fetch --depth 1 origin "$JAMI_CLIENT_COMMIT" && break
            test "$attempt" -lt 3
            sleep $((attempt * 20))
          done
          git -C official/jami-client-android checkout --detach FETCH_HEAD
          git -C official/jami-client-android submodule sync --recursive
          for attempt in 1 2 3; do
            git -C official/jami-client-android -c http.version=HTTP/1.1 submodule update --init --recursive --depth 1 --jobs 4 && break
            test "$attempt" -lt 3
            sleep $((attempt * 20))
          done
          test "$(git -C official/jami-client-android rev-parse HEAD)" = "$JAMI_CLIENT_COMMIT"

      - name: Восстановить проверенный кэш Jami
        uses: actions/cache/restore@v4
        with:
          path: official/jami-client-android/daemon/contrib/tarballs
          key: jami-contrib-tarballs-${{ runner.os }}-${{ env.JAMI_CLIENT_COMMIT }}-v3
          fail-on-cache-miss: true

      - name: Проверить кэш GNU-зависимостей
        shell: bash
        run: |
          set -euo pipefail
          TARBALLS=official/jami-client-android/daemon/contrib/tarballs
          test -s "$TARBALLS/libiconv-1.18.tar.gz"
          test -s "$TARBALLS/gmp-6.3.0.tar.xz"
          gzip -t "$TARBALLS/libiconv-1.18.tar.gz"
          xz -t "$TARBALLS/gmp-6.3.0.tar.xz"
          ls -lh "$TARBALLS/libiconv-1.18.tar.gz" "$TARBALLS/gmp-6.3.0.tar.xz"

      - name: Настроить Jami как внутреннюю библиотеку
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('official/jami-client-android/jami-android/app/build.gradle.kts')
          text = path.read_text(encoding='utf-8')
          text = text.replace('compileSdk = 37', 'compileSdk = 36', 1)
          text = text.replace('buildToolsVersion = "37.0.0"', 'buildToolsVersion = "36.1.0"', 1)
          text = text.replace('targetSdk = 37', 'targetSdk = 36', 1)
          old = '-DJAMI_DATADIR=/data/data/$namespace/files'
          new = '-DJAMI_DATADIR=/data/data/com.example.chernogram/files'
          if old not in text:
              raise SystemExit('JAMI_DATADIR marker not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Собрать официальное ядро Jami arm64
        shell: bash
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx5g -Dkotlin.daemon.jvm.options=-Xmx2g -Dfile.encoding=UTF-8
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/official/jami-client-android/jami-android"
          LOG="$GITHUB_WORKSPACE/jami-core-build.log"
          cd "$ROOT"
          chmod +x gradlew
          : > "$LOG"
          for attempt in 1 2 3; do
            set +e
            ./gradlew --no-daemon --stacktrace --console=plain -Parchs=arm64-v8a :app:assembleNoPushDebug 2>&1 | tee -a "$LOG"
            status=${PIPESTATUS[0]}
            set -e
            if [ "$status" -eq 0 ]; then break; fi
            if [ "$attempt" -eq 3 ]; then exit "$status"; fi
            ./gradlew --stop || true
            sleep $((attempt * 30))
          done
          tail -n 700 "$LOG" > "$GITHUB_WORKSPACE/jami-core-build-tail.log"

      - name: Встроить ядро Jami внутрь Чернограма
        shell: bash
        run: |
          set -euo pipefail
          ROOT=official/jami-client-android/jami-android
          GENERATED_FILE=$(find "$ROOT" -type f -name 'JamiService.java' -print -quit)
          if [ -z "$GENERATED_FILE" ]; then
            find "$ROOT" -type f -name '*.java' | grep -E '/generated/|/daemon/' | head -n 300 || true
            exit 1
          fi
          GENERATED=$(dirname "$GENERATED_FILE")
          rm -rf android/app/src/main/java/net/jami/daemon
          mkdir -p android/app/src/main/java/net/jami
          cp -a "$GENERATED" android/app/src/main/java/net/jami/
          JAMI_APK=$(find "$ROOT/app/build/outputs" -type f -iname '*nopush*debug*.apk' -print -quit)
          test -n "$JAMI_APK"
          rm -rf android/app/src/main/jniLibs/arm64-v8a
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          unzip -j "$JAMI_APK" 'lib/arm64-v8a/libjami-core-jni.so' -d android/app/src/main/jniLibs/arm64-v8a
          unzip -j "$JAMI_APK" 'lib/arm64-v8a/libc++_shared.so' -d android/app/src/main/jniLibs/arm64-v8a
          test -s android/app/src/main/jniLibs/arm64-v8a/libjami-core-jni.so
          find android/app/src/main/java/net/jami/daemon -type f | wc -l | tee jami-generated-java-count.txt
          ls -lh android/app/src/main/jniLibs/arm64-v8a | tee jami-native-files.txt

      - name: Проверить Flutter-код
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get
          flutter analyze --no-fatal-infos --no-fatal-warnings
          flutter test

      - name: Собрать Android Чернограм arm64
        shell: bash
        run: |
          set -o pipefail
          set +e
          flutter build apk --release --target-platform android-arm64 2>&1 | tee chernogram-build.log
          STATUS=${PIPESTATUS[0]}
          set -e
          tail -n 700 chernogram-build.log > chernogram-build-tail.log
          test "$STATUS" = "0"
          test -s build/app/outputs/flutter-apk/app-release.apk

      - name: Подписать и проверить APK Чернограма
        shell: bash
        run: |
          set -euo pipefail
          ZIPALIGN="$ANDROID_HOME/build-tools/36.1.0/zipalign"
          APKSIGNER="$ANDROID_HOME/build-tools/36.1.0/apksigner"
          AAPT="$ANDROID_HOME/build-tools/36.1.0/aapt"
          "$ZIPALIGN" -p -f 4 build/app/outputs/flutter-apk/app-release.apk chernogram-aligned.apk
          "$APKSIGNER" sign \
            --ks "$HOME/.android/debug.keystore" \
            --ks-key-alias androiddebugkey \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out chernogram-0.79.0-build79.apk chernogram-aligned.apk
          "$APKSIGNER" verify --print-certs chernogram-0.79.0-build79.apk | tee apk-signature.txt
          ACTUAL=$(grep -m1 'SHA-256 digest:' apk-signature.txt | sed 's/.*digest: //' | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')
          EXPECTED=$(printf '%s' "$CERT_SHA256" | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')
          test "$ACTUAL" = "$EXPECTED"
          "$AAPT" dump badging chernogram-0.79.0-build79.apk | tee apk-badging.txt
          grep -q "package: name='com.example.chernogram'" apk-badging.txt
          grep -q "versionCode='79'" apk-badging.txt
          grep -q "versionName='0.79.0'" apk-badging.txt
          grep -q "application-label:'Чернограм'" apk-badging.txt
          unzip -l chernogram-0.79.0-build79.apk | tee apk-files.txt
          grep -q 'lib/arm64-v8a/libjami-core-jni.so' apk-files.txt
          ! grep -q 'cx/ring/client/HomeActivity' apk-files.txt
          sha256sum chernogram-0.79.0-build79.apk | tee apk-sha256.txt
          stat -c '%s bytes' chernogram-0.79.0-build79.apk | tee apk-size.txt

      - name: Создать манифест и ссылку
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SHA=$(cut -d' ' -f1 apk-sha256.txt)
          cat > chernogram-0.79.0-build79.json <<EOF
          {
            "versionName": "0.79.0",
            "versionCode": 79,
            "package": "com.example.chernogram",
            "transport": "embedded-jami-core",
            "jamiClientCommit": "${JAMI_CLIENT_COMMIT}",
            "sha256": "${SHA}",
            "certificateSha256": "${CERT_SHA256}",
            "notesRu": "Интерфейс Чернограма сохранён. Jami встроен только как скрытое ядро связи."
          }
          EOF
          python3 -m json.tool chernogram-0.79.0-build79.json >/dev/null
          gh release delete "$RELEASE_TAG" --cleanup-tag -y || true
          gh release create "$RELEASE_TAG" \
            chernogram-0.79.0-build79.apk \
            chernogram-0.79.0-build79.json \
            apk-sha256.txt apk-signature.txt apk-badging.txt \
            --target feature/correct-jami-core-079 \
            --title "Чернограм 0.79.0+79 — скрытое ядро Jami" \
            --notes "Android-сборка с интерфейсом Чернограма и скрытым ядром Jami. Интерфейс Jami отсутствует." \
            --prerelease

      - name: Сохранить APK и доказательства
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chernogram-correct-jami-0.79-build79-v3
          path: |
            chernogram-0.79.0-build79.apk
            chernogram-0.79.0-build79.json
            apk-sha256.txt
            apk-signature.txt
            apk-badging.txt
            apk-files.txt
            apk-size.txt
            jami-native-files.txt
            jami-generated-java-count.txt
            jami-core-build-tail.log
            chernogram-build-tail.log
          if-no-files-found: warn
          retention-days: 14
