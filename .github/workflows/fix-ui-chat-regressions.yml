name: Fix UI and chat regressions

# Registered in the previous commit; this update intentionally starts it.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-ui-chat-regressions.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true

      - name: Apply targeted regression fix
        run: python3 tooling/fix_regressions_014.py

      - name: Validate source
        run: |
          flutter pub get
          dart format lib/v12.dart lib/chat_screen.dart lib/internet_core.dart
          flutter analyze

      - name: Commit repaired application
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-ui-chat-regressions.yml tooling/fix_regressions_014.py
          git add lib/v12.dart lib/chat_screen.dart lib/internet_core.dart pubspec.yaml pubspec.lock
          git commit -m "Восстановить интерфейс, быстрые чаты и кликабельные ссылки"
          git push origin HEAD:main
