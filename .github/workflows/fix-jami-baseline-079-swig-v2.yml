name: Исправить Jami baseline 0.79 — SWIG v2

on:
  push:
    branches: [experiment/jami-core-078]
    paths:
      - .github/workflows/fix-jami-baseline-079-swig-v2.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/jami-core-078
          fetch-depth: 0

      - name: Заменить блок SWIG между проверенными маркерами
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          path = Path('.github/workflows/jami-android-baseline-079.yml')
          text = path.read_text(encoding='utf-8')
          start_marker = '      - name: Установить SWIG 4.3.1\n'
          end_marker = '      - name: Установить точные Android SDK/NDK/CMake\n'
          start = text.find(start_marker)
          end = text.find(end_marker, start)
          if start < 0 or end < 0 or end <= start:
              raise SystemExit('Verified SWIG section markers were not found')

          replacement = dedent('''\
                - name: Установить официальный SWIG 4.3.1
                  shell: bash
                  run: |
                    set -euo pipefail
                    curl --fail --location --retry 8 --retry-delay 3 \\
                      "https://prdownloads.sourceforge.net/swig/swig-${SWIG_VERSION}.tar.gz" \\
                      -o swig.tar.gz
                    tar -xzf swig.tar.gz
                    cd "swig-${SWIG_VERSION}"
                    test -x ./configure
                    ./configure --prefix=/usr/local
                    make -j2
                    sudo make install
                    hash -r
                    /usr/local/bin/swig -version | tee "$GITHUB_WORKSPACE/jami-swig-version.txt"
                    /usr/local/bin/swig -version | grep -F "SWIG Version ${SWIG_VERSION}"
                    echo '/usr/local/bin' >> "$GITHUB_PATH"

          ''')
          if not replacement.startswith('      - name:'):
              raise SystemExit('Replacement indentation is invalid')
          path.write_text(text[:start] + replacement + text[end:], encoding='utf-8')

          status = Path('JAMI_BASELINE_079_STATUS.md')
          status.write_text(
              'Контроль официального Jami NoPush APK arm64 — попытка 2 после исправления SWIG. Основной канал Чернограма не изменяется.\n',
              encoding='utf-8',
          )
          PY

          grep -q 'prdownloads.sourceforge.net/swig' .github/workflows/jami-android-baseline-079.yml
          ! grep -q 'from packaging.version import Version' .github/workflows/jami-android-baseline-079.yml
          ! grep -q './autogen.sh' .github/workflows/jami-android-baseline-079.yml

      - name: Зафиксировать исправление и запустить baseline повторно
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/jami-android-baseline-079.yml JAMI_BASELINE_079_STATUS.md
          git commit -m 'Исправить SWIG и повторить Jami NoPush baseline 0.79'
          git push origin HEAD:experiment/jami-core-078
