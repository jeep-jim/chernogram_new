name: Чернограм 0.24.0+59 — повторная публикация без сервера

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-stable-core-0234.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: chernogram-publish-0240-59
  cancel-in-progress: true

env:
  WORKING_REF: 6847a3d4e6ade48ca139c6560c036540865b8bf8
  SOURCE_VERSION: 0.24.0+56
  VERSION_FULL: 0.24.0+59
  VERSION_NAME: 0.24.0
  VERSION_CODE: 59
  FLUTTER_VERSION: 3.44.8
  CERT_SHA256: "F4:A2:C8:36:A8:36:71:19:78:10:FA:6E:98:2D:77:F4:C7:31:D0:9B:18:95:15:C0:13:D0:2D:0D:94:2D:9B:BE"

jobs:
  publish:
    runs-on: ubuntu-22.04
    timeout-minutes: 100
    steps:
      - name: Получить проверенный исходник
        uses: actions/checkout@v4
        with:
          ref: ${{ env.WORKING_REF }}
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - uses: actions/cache/restore@v4
        with:
          path: ~/.android/debug.keystore
          key: chernogram-stable-signing-v2
          fail-on-cache-miss: false

      - name: Собрать проверенный APK 0.24.0+59
        shell: bash
        env:
          CHERNOGRAM_KEYSTORE_B64: ${{ secrets.CHERNOGRAM_KEYSTORE_B64 }}
        run: |
          set -o pipefail
          (
            set -euo pipefail
            test "$(awk '/^version:/ {print $2}' pubspec.yaml)" = "$SOURCE_VERSION"
            sed -i "s/^version:.*/version: ${VERSION_FULL}/" pubspec.yaml
            test "$(awk '/^version:/ {print $2}' pubspec.yaml)" = "$VERSION_FULL"

            grep -q "ntfy.sh" lib/internet_core.dart
            grep -q "openrelay.metered.ca" lib/call_service.dart
            ! grep -q "realtime_gateway_client.dart" lib/internet_core.dart

            mkdir -p "$HOME/.android"
            if [ -n "${CHERNOGRAM_KEYSTORE_B64:-}" ]; then
              printf '%s' "$CHERNOGRAM_KEYSTORE_B64" | base64 --decode > "$HOME/.android/debug.keystore"
              chmod 600 "$HOME/.android/debug.keystore"
            fi
            test -s "$HOME/.android/debug.keystore"

            flutter pub get
            flutter analyze --no-fatal-infos --no-fatal-warnings
            flutter test
            flutter build apk --release

            APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
            AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)
            "$APKSIGNER" sign \
              --ks "$HOME/.android/debug.keystore" \
              --ks-key-alias androiddebugkey \
              --ks-pass pass:android \
              --key-pass pass:android \
              --out chernogram.apk \
              build/app/outputs/flutter-apk/app-release.apk
            "$APKSIGNER" verify --print-certs chernogram.apk | tee apk-signature.txt
            APK_CERT=$(sed -n -e 's/^Signer #1 certificate SHA-256 digest: //p' -e 's/^V2 Signer: certificate SHA-256 digest: //p' -e 's/^V3.0 Signer: certificate SHA-256 digest: //p' apk-signature.txt | head -n 1 | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')
            EXPECTED=$(printf '%s' "$CERT_SHA256" | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')
            test "$APK_CERT" = "$EXPECTED"
            "$AAPT" dump badging chernogram.apk | tee apk-badging.txt
            grep -q "versionCode='$VERSION_CODE'" apk-badging.txt
            grep -q "versionName='$VERSION_NAME'" apk-badging.txt
            sha256sum chernogram.apk | tee apk-sha256.txt
          ) 2>&1 | tee publish-0240-59.log

      - name: Создать update.json
        shell: bash
        run: |
          set -euo pipefail
          APK_SHA=$(awk '{print $1}' apk-sha256.txt)
          cat > update.json <<EOF
          {
            "versionName": "${VERSION_NAME}",
            "versionCode": ${VERSION_CODE},
            "apkUrl": "https://github.com/jeep-jim/chernogram_new/releases/download/latest-apk/chernogram.apk?v=${VERSION_CODE}",
            "sha256": "${APK_SHA}",
            "certificateSha256": "${CERT_SHA256}",
            "notesRu": "Чернограм 0.24.0 возвращает проверенный сервер-независимый чат и аудио- и видеозвонки. Собственный сервер, Gateway и VPS не требуются. Сохранены интерфейс, локальная история, файлы и плеер.",
            "notesEn": "Chernogram 0.24.0 restores verified server-independent chat and audio/video calls. No private server, Gateway or VPS is required. The interface, local history, files and player are preserved."
          }
          EOF
          python -m json.tool update.json >/dev/null

      - name: Пересоздать release latest-apk
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release delete latest-apk --cleanup-tag --yes || true
          gh release create latest-apk \
            chernogram.apk update.json apk-sha256.txt apk-signature.txt apk-badging.txt \
            --target main \
            --title "Чернограм 0.24.0 — локальный чат и видеозвонки" \
            --notes "Штатное обновление внутри приложения. Сервер-независимое рабочее ядро." \
            --prerelease

      - name: Включить обновление в приложении
        shell: bash
        run: |
          set -euo pipefail
          cp update.json /tmp/update-0240-59.json
          APK_SHA=$(awk '{print $1}' apk-sha256.txt)
          APK_BYTES=$(stat -c '%s' chernogram.apk)
          git fetch origin main
          git checkout -B main origin/main
          cp /tmp/update-0240-59.json update.json
          cat > WORKING_SERVERLESS_024_STATUS.md <<EOF
          Chernogram server-independent Android release published
          Version: ${VERSION_FULL}
          Source: ${WORKING_REF}
          Android APK bytes: ${APK_BYTES}
          Android APK SHA-256: ${APK_SHA}
          Certificate: ${CERT_SHA256}
          Update channel: latest-apk
          Time: $(date -u +'%Y-%m-%dT%H:%M:%SZ')
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add update.json WORKING_SERVERLESS_024_STATUS.md
          git commit -m "Включить обновление Чернограма 0.24.0+59 из приложения [skip ci]"
          git push origin HEAD:main

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chernogram-0.24.0-build-59-publish-retry
          path: |
            chernogram.apk
            update.json
            publish-0240-59.log
            apk-signature.txt
            apk-badging.txt
            apk-sha256.txt
          if-no-files-found: warn
          retention-days: 14
