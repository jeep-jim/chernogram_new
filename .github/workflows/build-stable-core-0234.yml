name: Чернограм 0.24.0+60 — надёжная публикация без сервера

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-stable-core-0234.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: chernogram-publish-0240-build60
  cancel-in-progress: true

env:
  WORKING_REF: 6847a3d4e6ade48ca139c6560c036540865b8bf8
  SOURCE_VERSION: 0.24.0+56
  VERSION_FULL: 0.24.0+60
  VERSION_NAME: 0.24.0
  VERSION_CODE: 60
  RELEASE_TAG: chernogram-0.24.0-build60
  FLUTTER_VERSION: 3.44.8
  CERT_SHA256: "F4:A2:C8:36:A8:36:71:19:78:10:FA:6E:98:2D:77:F4:C7:31:D0:9B:18:95:15:C0:13:D0:2D:0D:94:2D:9B:BE"

jobs:
  publish:
    name: Собрать APK, создать отдельный Release и включить обновление
    runs-on: ubuntu-22.04
    timeout-minutes: 100

    steps:
      - name: Получить точный рабочий исходник
        uses: actions/checkout@v4
        with:
          ref: ${{ env.WORKING_REF }}
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - uses: actions/cache/restore@v4
        with:
          path: ~/.android/debug.keystore
          key: chernogram-stable-signing-v2
          fail-on-cache-miss: false

      - name: Подготовить рабочую версию 0.24.0+60
        shell: bash
        run: |
          set -euo pipefail
          test "$(awk '/^version:/ {print $2}' pubspec.yaml)" = "$SOURCE_VERSION"
          sed -i "s/^version:.*/version: ${VERSION_FULL}/" pubspec.yaml
          test "$(awk '/^version:/ {print $2}' pubspec.yaml)" = "$VERSION_FULL"
          grep -q "ntfy.sh" lib/internet_core.dart
          grep -q "openrelay.metered.ca" lib/call_service.dart
          ! grep -q "realtime_gateway_client.dart" lib/internet_core.dart

      - name: Восстановить постоянную подпись
        shell: bash
        env:
          CHERNOGRAM_KEYSTORE_B64: ${{ secrets.CHERNOGRAM_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          if [ -n "${CHERNOGRAM_KEYSTORE_B64:-}" ]; then
            printf '%s' "$CHERNOGRAM_KEYSTORE_B64" | base64 --decode > "$HOME/.android/debug.keystore"
            chmod 600 "$HOME/.android/debug.keystore"
          fi
          test -s "$HOME/.android/debug.keystore"
          keytool -list -v \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android > certificate.txt
          ACTUAL=$(grep -m1 'SHA256:' certificate.txt | sed 's/.*SHA256: //' | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')
          EXPECTED=$(printf '%s' "$CERT_SHA256" | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')
          test "$ACTUAL" = "$EXPECTED"

      - name: Собрать, подписать и проверить APK
        shell: bash
        run: |
          set -o pipefail
          (
            set -euo pipefail
            flutter pub get
            flutter build apk --release
            SOURCE_APK=build/app/outputs/flutter-apk/app-release.apk
            test -s "$SOURCE_APK"

            APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
            AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)

            "$APKSIGNER" sign \
              --ks "$HOME/.android/debug.keystore" \
              --ks-key-alias androiddebugkey \
              --ks-pass pass:android \
              --key-pass pass:android \
              --out chernogram.apk \
              "$SOURCE_APK"

            "$APKSIGNER" verify --print-certs chernogram.apk | tee apk-signature.txt
            APK_CERT=$(sed -n \
              -e 's/^Signer #1 certificate SHA-256 digest: //p' \
              -e 's/^V2 Signer: certificate SHA-256 digest: //p' \
              -e 's/^V3.0 Signer: certificate SHA-256 digest: //p' \
              apk-signature.txt | head -n 1 | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')
            EXPECTED=$(printf '%s' "$CERT_SHA256" | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')
            test "$APK_CERT" = "$EXPECTED"

            "$AAPT" dump badging chernogram.apk | tee apk-badging.txt
            grep -q "versionCode='$VERSION_CODE'" apk-badging.txt
            grep -q "versionName='$VERSION_NAME'" apk-badging.txt
            sha256sum chernogram.apk | tee apk-sha256.txt
          ) 2>&1 | tee publish-0240-build60.log

      - name: Создать проверенный манифест обновления
        shell: bash
        run: |
          set -euo pipefail
          APK_SHA=$(awk '{print $1}' apk-sha256.txt)
          cat > update.json <<EOF
          {
            "versionName": "${VERSION_NAME}",
            "versionCode": ${VERSION_CODE},
            "apkUrl": "https://github.com/jeep-jim/chernogram_new/releases/download/${RELEASE_TAG}/chernogram.apk?v=${VERSION_CODE}",
            "sha256": "${APK_SHA}",
            "certificateSha256": "${CERT_SHA256}",
            "notesRu": "Чернограм 0.24.0 возвращает проверенный сервер-независимый чат и аудио- и видеозвонки. Собственный сервер, Gateway и VPS не требуются. Сохранены текущий интерфейс, локальная история, файлы и плеер.",
            "notesEn": "Chernogram 0.24.0 restores verified server-independent chat and audio/video calls. No private server, Gateway or VPS is required. The current interface, local history, files and player are preserved."
          }
          EOF
          python -m json.tool update.json >/dev/null
          grep -q '"versionCode": 60' update.json
          cp update.json /tmp/chernogram-update-build60.json

      - name: Создать отдельный Release 0.24.0+60
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release delete "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes || true
          gh release create "$RELEASE_TAG" \
            chernogram.apk \
            update.json \
            apk-sha256.txt \
            apk-signature.txt \
            apk-badging.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "$WORKING_REF" \
            --title "Чернограм 0.24.0+60 — локальный чат и видеозвонки" \
            --notes "Рабочая сервер-независимая версия. Собственный сервер, Gateway и VPS не требуются." \
            --prerelease
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null

      - name: Переключить обновление приложения на build 60
        shell: bash
        run: |
          set -euo pipefail
          SUCCESS=0
          for ATTEMPT in 1 2 3 4 5; do
            git fetch origin main
            git checkout -B publish-build60 origin/main
            cp /tmp/chernogram-update-build60.json update.json
            cat > WORKING_SERVERLESS_024_STATUS.md <<EOF
          Chernogram server-independent Android release published
          Version: ${VERSION_FULL}
          Source: ${WORKING_REF}
          Release tag: ${RELEASE_TAG}
          Chat: encrypted public HTTPS/WSS relay
          Calls: WebRTC with public STUN/TURN
          Private server or Gateway: not required
          Update channel: main/update.json
          Time: $(date -u +'%Y-%m-%dT%H:%M:%SZ')
          EOF
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add update.json WORKING_SERVERLESS_024_STATUS.md
            git commit -m "Включить обновление Чернограма 0.24.0+60 [skip ci]"
            if git push origin HEAD:main; then
              SUCCESS=1
              break
            fi
            echo "main изменился во время публикации, повтор ${ATTEMPT}/5"
            sleep 3
          done
          test "$SUCCESS" = "1"

      - name: Проверить опубликованный update.json
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/contents/update.json?ref=main" \
            --jq '.content' | tr -d '\n' | base64 --decode > published-update.json
          python -m json.tool published-update.json >/dev/null
          grep -q '"versionCode": 60' published-update.json
          grep -q "$RELEASE_TAG/chernogram.apk" published-update.json

      - name: Выдать APK и журнал
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chernogram-0.24.0-build60-published
          path: |
            chernogram.apk
            update.json
            published-update.json
            apk-signature.txt
            apk-badging.txt
            apk-sha256.txt
            publish-0240-build60.log
          if-no-files-found: warn
          retention-days: 14
