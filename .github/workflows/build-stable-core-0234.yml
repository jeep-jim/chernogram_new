name: Чернограм 0.23.4 — локальная связь без сервера
# Retry after compatibility fix 2026-07-31T17:18:00+07:00

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-stable-core-0234.yml
  workflow_dispatch:

concurrency:
  group: chernogram-0234-serverless-build
  cancel-in-progress: true

permissions:
  contents: read

env:
  SOURCE_BRANCH: feature/stable-core-0234
  EXPECTED_VERSION: 0.23.4+59
  FLUTTER_VERSION: 3.44.8
  EXPECTED_CERT_SHA256: "F4:A2:C8:36:A8:36:71:19:78:10:FA:6E:98:2D:77:F4:C7:31:D0:9B:18:95:15:C0:13:D0:2D:0D:94:2D:9B:BE"

jobs:
  verify:
    name: Проверка локального чата и WebRTC
    runs-on: ubuntu-22.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_BRANCH }}
          fetch-depth: 0

      - name: Подготовить исходные ветки
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin '+refs/heads/*:refs/remotes/origin/*' --force
          for branch in feature/files-first-0233 feature/realtime-client-v1 feature/realtime-gateway-v1; do
            git branch -f "$branch" "origin/$branch"
          done

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Собрать исходник без частного Gateway
        shell: bash
        run: |
          set -o pipefail
          (
            set -euo pipefail
            python tooling/materialize_stable_core_0234_v2.py
            test "$(awk '/^version:/ {print $2}' pubspec.yaml)" = "$EXPECTED_VERSION"
            ! grep -q "realtime_gateway_client.dart" lib/internet_core.dart
            grep -q "ntfy.sh" lib/internet_core.dart
            grep -q "openrelay.metered.ca" lib/call_service.dart
            flutter pub get
            dart format lib test
            flutter analyze lib test --no-fatal-infos --no-fatal-warnings
            flutter test
          ) 2>&1 | tee serverless-verify-0234.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: serverless-0234-verify-log
          path: serverless-verify-0234.log
          if-no-files-found: warn
          retention-days: 14

  android:
    name: Android APK без серверной зависимости
    needs: verify
    runs-on: ubuntu-22.04
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_BRANCH }}
          fetch-depth: 0

      - name: Подготовить исходные ветки
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin '+refs/heads/*:refs/remotes/origin/*' --force
          for branch in feature/files-first-0233 feature/realtime-client-v1 feature/realtime-gateway-v1; do
            git branch -f "$branch" "origin/$branch"
          done

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - uses: actions/cache/restore@v4
        with:
          path: ~/.android/debug.keystore
          key: chernogram-stable-signing-v2
          fail-on-cache-miss: false

      - name: Восстановить постоянную подпись
        shell: bash
        env:
          CHERNOGRAM_KEYSTORE_B64: ${{ secrets.CHERNOGRAM_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          if [ -n "${CHERNOGRAM_KEYSTORE_B64:-}" ]; then
            printf '%s' "$CHERNOGRAM_KEYSTORE_B64" | base64 --decode > "$HOME/.android/debug.keystore"
            chmod 600 "$HOME/.android/debug.keystore"
          fi
          test -s "$HOME/.android/debug.keystore"
          keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android > signing-0234.txt
          ACTUAL=$(grep -m1 'SHA256:' signing-0234.txt | sed 's/.*SHA256: //' | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')
          EXPECTED=$(printf '%s' "$EXPECTED_CERT_SHA256" | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')
          test "$ACTUAL" = "$EXPECTED"

      - name: Собрать подписанный APK
        shell: bash
        run: |
          set -o pipefail
          (
            set -euo pipefail
            python tooling/materialize_stable_core_0234_v2.py
            ! grep -q "realtime_gateway_client.dart" lib/internet_core.dart
            flutter pub get
            dart format lib
            flutter build apk --release
            SOURCE_APK=build/app/outputs/flutter-apk/app-release.apk
            test -s "$SOURCE_APK"
            APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
            "$APKSIGNER" sign --ks "$HOME/.android/debug.keystore" --ks-key-alias androiddebugkey --ks-pass pass:android --key-pass pass:android --out chernogram-android-0.23.4-serverless.apk "$SOURCE_APK"
            "$APKSIGNER" verify --print-certs chernogram-android-0.23.4-serverless.apk | tee apk-signature-0234.txt
            APK_CERT=$(sed -n -e 's/^Signer #1 certificate SHA-256 digest: //p' -e 's/^V2 Signer: certificate SHA-256 digest: //p' -e 's/^V3.0 Signer: certificate SHA-256 digest: //p' apk-signature-0234.txt | head -n 1 | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')
            EXPECTED=$(printf '%s' "$EXPECTED_CERT_SHA256" | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')
            test "$APK_CERT" = "$EXPECTED"
            sha256sum chernogram-android-0.23.4-serverless.apk > android-sha256-0234.txt
          ) 2>&1 | tee android-build-0234.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chernogram-android-0.23.4-serverless
          path: |
            chernogram-android-0.23.4-serverless.apk
            android-sha256-0234.txt
            apk-signature-0234.txt
            android-build-0234.log
          if-no-files-found: warn
          retention-days: 14

  windows:
    name: Windows без серверной зависимости
    needs: verify
    runs-on: windows-2022
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_BRANCH }}
          fetch-depth: 0

      - name: Подготовить исходные ветки
        shell: pwsh
        run: |
          git fetch origin '+refs/heads/*:refs/remotes/origin/*' --force
          git branch -f feature/files-first-0233 origin/feature/files-first-0233
          git branch -f feature/realtime-client-v1 origin/feature/realtime-client-v1
          git branch -f feature/realtime-gateway-v1 origin/feature/realtime-gateway-v1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Собрать Windows ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $log = Join-Path $PWD 'windows-build-0234.log'
          function Invoke-Logged {
            param([scriptblock]$Command, [string]$Name)
            "===== $Name =====" | Tee-Object -FilePath $log -Append
            & $Command *>&1 | Tee-Object -FilePath $log -Append
            if ($LASTEXITCODE -ne 0) { throw "$Name failed with exit code $LASTEXITCODE" }
          }
          Invoke-Logged { python tooling/materialize_stable_core_0234_v2.py } 'Materialize serverless core'
          if (Select-String -Path lib/internet_core.dart -Pattern 'realtime_gateway_client.dart' -Quiet) { throw 'Private gateway dependency remained in app core' }
          Invoke-Logged { flutter config --enable-windows-desktop } 'Enable Windows desktop'
          if (-not (Test-Path 'windows/CMakeLists.txt')) {
            Invoke-Logged { flutter create --platforms=windows --project-name chernogram --no-pub . } 'Create Windows runner'
          }
          $definition = 'add_compile_definitions(_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS)'
          $cmakePath = Join-Path $PWD 'windows/CMakeLists.txt'
          $lines = Get-Content $cmakePath
          if (-not ($lines -contains $definition)) {
            $patched = @($lines[0], '', $definition) + $lines[1..($lines.Length - 1)]
            Set-Content -Path $cmakePath -Value $patched -Encoding UTF8
          }
          $env:CL = "/D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS $env:CL"
          Invoke-Logged { flutter pub get } 'Flutter pub get'
          Invoke-Logged { dart format lib } 'Dart format'
          Invoke-Logged { flutter build windows --release } 'Build Windows release'
          $release = 'build/windows/x64/runner/Release'
          if (-not (Test-Path "$release/chernogram.exe")) { throw 'Windows executable was not built' }
          Compress-Archive -Path "$release/*" -DestinationPath chernogram-windows-0.23.4-serverless.zip -Force
          Get-FileHash chernogram-windows-0.23.4-serverless.zip -Algorithm SHA256 | Format-List | Out-File windows-sha256-0234.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chernogram-windows-0.23.4-serverless
          path: |
            chernogram-windows-0.23.4-serverless.zip
            windows-sha256-0234.txt
            windows-build-0234.log
          if-no-files-found: warn
          retention-days: 14
