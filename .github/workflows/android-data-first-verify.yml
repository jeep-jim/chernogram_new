name: Verify Android Data First 0.22

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/android-data-first-verify.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cernogram-android-data-first-verify-022
  cancel-in-progress: true

jobs:
  completed:
    if: false
    runs-on: ubuntu-22.04
    steps:
      - run: echo "Android 0.22 was built and published in the isolated preview; repeated verifier suspended."
