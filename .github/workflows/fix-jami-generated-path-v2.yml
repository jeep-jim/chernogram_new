name: Исправить путь Jami API v2

on:
  push:
    branches: [feature/correct-jami-core-079]
    paths:
      - .github/workflows/fix-jami-generated-path-v2.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/correct-jami-core-079
          fetch-depth: 0

      - name: Исправить путь
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/build-correct-chernogram-jami-079.yml')
          s = p.read_text(encoding='utf-8')
          a = '          GENERATED="$ROOT/libjamiclient/src/main/java/net/jami/daemon"'
          b = '          test -f "$GENERATED/JamiService.java"'
          i = s.index(a)
          j = s.index(b, i) + len(b)
          block = """          GENERATED_FILE=$(find "$ROOT" -type f -path '*/net/jami/daemon/JamiService.java' -print -quit)
          test -n "$GENERATED_FILE"
          GENERATED=$(dirname "$GENERATED_FILE")
          test -d "$GENERATED"
          test -f "$GENERATED/JamiService.java"
          echo "Generated Jami API: $GENERATED""""
          p.write_text(s[:i] + block + s[j:], encoding='utf-8')
          PY
          grep -q 'GENERATED_FILE=$(find' .github/workflows/build-correct-chernogram-jami-079.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/build-correct-chernogram-jami-079.yml
          git commit -m "Исправить фактический путь Jami API"
          git push origin HEAD:feature/correct-jami-core-079
