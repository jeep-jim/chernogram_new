name: Repair 0.23 with full 0.16 features

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/repair-023-v16-build.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: chernogram-repair-023-v16
  cancel-in-progress: true

env:
  SOURCE_BRANCH: fix/realtime-ui-023
  EXPECTED_VERSION: 0.23.0+55
  EXPECTED_CERT_SHA256: "F4:A2:C8:36:A8:36:71:19:78:10:FA:6E:98:2D:77:F4:C7:31:D0:9B:18:95:15:C0:13:D0:2D:0D:94:2D:9B:BE"

jobs:
  analyze:
    runs-on: ubuntu-22.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_BRANCH }}
          fetch-depth: 0
      - run: git fetch --tags --force
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
      - name: Restore repair and complete 0.16 feature set
        shell: bash
        run: |
          python tooling/apply_repair_023.py
          python tooling/restore_v16_features.py
      - name: Analyze and test
        id: analyze
        shell: bash
        run: |
          set -o pipefail
          (
            set -euo pipefail
            test "$(awk '/^version:/ {print $2}' pubspec.yaml)" = "$EXPECTED_VERSION"
            flutter pub get
            dart format lib
            flutter analyze --no-fatal-infos --no-fatal-warnings
            flutter test
          ) 2>&1 | tee analyze-023-v16.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: repair-023-v16-analyze-log
          path: analyze-023-v16.log
          if-no-files-found: warn
          retention-days: 14

  android:
    runs-on: ubuntu-22.04
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_BRANCH }}
          fetch-depth: 0
      - run: git fetch --tags --force
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
      - uses: actions/cache/restore@v4
        with:
          path: ~/.android/debug.keystore
          key: chernogram-stable-signing-v2
          fail-on-cache-miss: false
      - name: Verify permanent signing key
        shell: bash
        env:
          CHERNOGRAM_KEYSTORE_B64: ${{ secrets.CHERNOGRAM_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          if [ -n "${CHERNOGRAM_KEYSTORE_B64:-}" ]; then
            printf '%s' "$CHERNOGRAM_KEYSTORE_B64" | base64 --decode > "$HOME/.android/debug.keystore"
            chmod 600 "$HOME/.android/debug.keystore"
          fi
          test -s "$HOME/.android/debug.keystore"
          keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android > signing-key-023-v16.txt
          ACTUAL=$(grep -m1 'SHA256:' signing-key-023-v16.txt | sed 's/.*SHA256: //' | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')
          EXPECTED=$(printf '%s' "$EXPECTED_CERT_SHA256" | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')
          test "$ACTUAL" = "$EXPECTED"
      - name: Build Android release
        shell: bash
        run: |
          set -o pipefail
          (
            set -euo pipefail
            python tooling/apply_repair_023.py
            python tooling/restore_v16_features.py
            flutter pub get
            dart format lib
            flutter build apk --release
            SOURCE_APK=build/app/outputs/flutter-apk/app-release.apk
            test -s "$SOURCE_APK"
            APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
            "$APKSIGNER" sign --ks "$HOME/.android/debug.keystore" --ks-key-alias androiddebugkey --ks-pass pass:android --key-pass pass:android --out chernogram-android-0.23.0-v16.apk "$SOURCE_APK"
            "$APKSIGNER" verify --print-certs chernogram-android-0.23.0-v16.apk | tee apk-signature-023-v16.txt
            APK_CERT=$(sed -n -e 's/^Signer #1 certificate SHA-256 digest: //p' -e 's/^V2 Signer: certificate SHA-256 digest: //p' -e 's/^V3.0 Signer: certificate SHA-256 digest: //p' apk-signature-023-v16.txt | head -n 1 | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')
            EXPECTED=$(printf '%s' "$EXPECTED_CERT_SHA256" | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')
            test "$APK_CERT" = "$EXPECTED"
            sha256sum chernogram-android-0.23.0-v16.apk | tee android-sha256-023-v16.txt
          ) 2>&1 | tee android-build-023-v16.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chernogram-android-0.23.0-v16
          path: |
            chernogram-android-0.23.0-v16.apk
            android-sha256-023-v16.txt
            apk-signature-023-v16.txt
            android-build-023-v16.log
          if-no-files-found: warn
          retention-days: 14

  windows:
    runs-on: windows-2022
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_BRANCH }}
          fetch-depth: 0
      - run: git fetch --tags --force
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
      - name: Build Windows release
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python tooling/apply_repair_023.py 2>&1 | Tee-Object -FilePath windows-build-023-v16.log
          python tooling/restore_v16_features.py 2>&1 | Tee-Object -FilePath windows-build-023-v16.log -Append
          flutter config --enable-windows-desktop 2>&1 | Tee-Object -FilePath windows-build-023-v16.log -Append
          flutter pub get 2>&1 | Tee-Object -FilePath windows-build-023-v16.log -Append
          dart format lib 2>&1 | Tee-Object -FilePath windows-build-023-v16.log -Append
          flutter build windows --release 2>&1 | Tee-Object -FilePath windows-build-023-v16.log -Append
          $release = 'build/windows/x64/runner/Release'
          if (-not (Test-Path "$release/chernogram.exe")) { throw 'Windows executable was not built' }
          Compress-Archive -Path "$release/*" -DestinationPath chernogram-windows-0.23.0-v16.zip -Force
          Get-FileHash chernogram-windows-0.23.0-v16.zip -Algorithm SHA256 | Format-List | Out-File windows-sha256-023-v16.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chernogram-windows-0.23.0-v16
          path: |
            chernogram-windows-0.23.0-v16.zip
            windows-sha256-023-v16.txt
            windows-build-023-v16.log
          if-no-files-found: warn
          retention-days: 14

  finalize:
    needs: [analyze, android, windows]
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_BRANCH }}
          fetch-depth: 0
      - run: git fetch --tags --force
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Commit validated direct source
        shell: bash
        run: |
          set -euo pipefail
          python tooling/apply_repair_023.py
          python tooling/restore_v16_features.py
          cat > REPAIR_023_STATUS.md <<EOF
          Chernogram 0.23 repaired build passed
          Version: ${EXPECTED_VERSION}
          Approved mask/shield icon and loading mark: restored
          Theme artifacts and UI stalls: repaired
          Living slow waves and face-only player equalizer: restored
          Stable recovery chat transport: restored
          Calls use bounded startup/signaling and immediate hangup
          Invite and installation sharing: restored
          Message swipe and multi-select: restored
          File multi-select: restored
          0.16 permission switches: restored
          0.16 privacy rules: restored
          0.16 two-device pairing screen: restored
          0.16 active sessions: restored
          0.16 system contacts: restored
          0.16 agent and automation: restored
          Android release build: passed
          Windows release build: passed
          Public in-app manifest: not changed yet
          Time: $(date -u +'%Y-%m-%dT%H:%M:%SZ')
          EOF
          rm -f ANDROID_DATA_FIRST_CI_ERROR.md REPAIR_023_CI_ERROR.md REPAIR_023_DIAGNOSTICS.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Чернограм 0.23 с функциями 0.16 проверен [skip ci]"
          git push origin HEAD:"$SOURCE_BRANCH"

  failure-report:
    if: failure()
    needs: [analyze, android, windows]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_BRANCH }}
          fetch-depth: 0
      - name: Save failed build marker
        shell: bash
        run: |
          set -euo pipefail
          cat > REPAIR_023_V16_CI_ERROR.md <<EOF
          # Chernogram 0.23 with 0.16 features failed

          Workflow commit: ${GITHUB_SHA}
          Source branch: ${SOURCE_BRANCH}
          Time: $(date -u +'%Y-%m-%dT%H:%M:%SZ')

          Analyze, Android release or Windows release failed. Exact logs are stored as workflow artifacts.
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add REPAIR_023_V16_CI_ERROR.md
          git commit -m "Сохранить сбой сборки 0.23 с функциями 0.16 [skip ci]" || true
          git push origin HEAD:"$SOURCE_BRANCH"
