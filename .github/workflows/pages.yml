name: Validate Chernogram landing

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cernogram-landing-validation
  cancel-in-progress: true

jobs:
  validate:
    name: Validate temporary QR landing
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate local landing
        shell: bash
        run: |
          set -e
          test -s docs/index.html
          grep -q 'intent://join' docs/index.html
          grep -q 'chernogram://join' docs/index.html
          grep -q 'latest-apk/chernogram.apk' docs/index.html
          grep -q 'TestFlight' docs/index.html

      - name: Smoke-test temporary host
        shell: bash
        run: |
          set +e
          URL="https://githubraw.com/jeep-jim/chernogram_new/main/docs/index.html?t=$(date +%s)"
          HTTP_CODE=$(curl -L --max-time 25 -s -o /tmp/landing.html -w '%{http_code}' "$URL")
          echo "Temporary landing HTTP: ${HTTP_CODE}"
          if [ "$HTTP_CODE" = "200" ]; then
            grep -q 'ЧЕРНОГРАМ' /tmp/landing.html || true
          fi
          exit 0
