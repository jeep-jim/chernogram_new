name: Build C-H Messenger APK

on:
  push:
    branches:
      - ch-messenger-apk-build-20260804
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Get packages
        run: flutter pub get

      - name: Build debug APK
        run: flutter build apk --debug --build-name=1.0.0 --build-number=1

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-debug.apk C-H-Messenger.apk

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: C-H-Messenger-APK
          path: C-H-Messenger.apk
          if-no-files-found: error
          retention-days: 7

      - name: Publish APK release
        uses: ncipollo/release-action@v1
        with:
          tag: ch-messenger-apk
          name: C-H Messenger APK
          body: C-H Messenger Android APK test build.
          artifacts: C-H-Messenger.apk
          allowUpdates: true
          replacesArtifacts: true
          prerelease: true
          token: ${{ secrets.GITHUB_TOKEN }}
