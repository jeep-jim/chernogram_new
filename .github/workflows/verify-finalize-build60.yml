name: Проверить финальную публикацию build 60

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/verify-finalize-build60.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  verify:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Получить финальный статус
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: 33cba3eca0c9bccdf6f276834bc4459e4ee32e04
          RELEASE_TAG: chernogram-0.24.0-build60
        run: |
          set -euo pipefail
          REPO="$GITHUB_REPOSITORY"
          RUN_ID=''
          for _ in $(seq 1 20); do
            gh api "/repos/${REPO}/actions/runs?head_sha=${TARGET_SHA}&per_page=10" > runs.json
            RUN_ID=$(python - <<'PY'
          import json
          runs=json.load(open('runs.json', encoding='utf-8')).get('workflow_runs', [])
          print(runs[0]['id'] if runs else '')
          PY
            )
            [ -n "$RUN_ID" ] && break
            sleep 3
          done
          test -n "$RUN_ID"

          for _ in $(seq 1 30); do
            gh api "/repos/${REPO}/actions/runs/${RUN_ID}" > run.json
            STATUS=$(python - <<'PY'
          import json
          print(json.load(open('run.json', encoding='utf-8')).get('status',''))
          PY
            )
            [ "$STATUS" = completed ] && break
            sleep 3
          done

          gh api "/repos/${REPO}/actions/runs/${RUN_ID}/jobs?filter=latest&per_page=100" > jobs.json
          gh release view "$RELEASE_TAG" --repo "$REPO" --json tagName,name,isPrerelease,url,assets > release.json
          gh api "/repos/${REPO}/contents/update.json?ref=main" --jq '.content' | tr -d '\n' | base64 --decode > published-update.json

          python - <<'PY'
          import json
          run=json.load(open('run.json', encoding='utf-8'))
          jobs=json.load(open('jobs.json', encoding='utf-8')).get('jobs', [])
          release=json.load(open('release.json', encoding='utf-8'))
          update=json.load(open('published-update.json', encoding='utf-8'))
          with open('FINALIZE_BUILD60_RUN_STATUS.md','w',encoding='utf-8') as f:
              f.write('# Finalize build 60 status\n\n')
              f.write(f"Run id: {run.get('id')}\n\n")
              f.write(f"Status: {run.get('status')}\n\n")
              f.write(f"Conclusion: {run.get('conclusion')}\n\n")
              f.write(f"URL: {run.get('html_url')}\n\n")
              f.write('## Jobs\n\n')
              for j in jobs:
                  f.write(f"- {j.get('name')}: {j.get('status')} / {j.get('conclusion')}\n")
                  for s in j.get('steps', []):
                      if s.get('conclusion') == 'failure':
                          f.write(f"  - failed step: {s.get('name')}\n")
              f.write('\n## Release\n\n')
              f.write(f"- tag: {release.get('tagName')}\n")
              f.write(f"- url: {release.get('url')}\n")
              f.write('- assets: ' + ', '.join(a.get('name','') for a in release.get('assets', [])) + '\n')
              f.write('\n## Manifest\n\n')
              f.write(f"- versionName: {update.get('versionName')}\n")
              f.write(f"- versionCode: {update.get('versionCode')}\n")
              f.write(f"- apkUrl: {update.get('apkUrl')}\n")
              f.write(f"- sha256: {update.get('sha256')}\n")
          if run.get('status') != 'completed' or run.get('conclusion') != 'success':
              raise SystemExit('Finalize workflow is not successful')
          assets={a.get('name') for a in release.get('assets', [])}
          if 'chernogram.apk' not in assets:
              raise SystemExit('APK asset missing')
          if update.get('versionCode') != 60 or not update.get('sha256'):
              raise SystemExit('Manifest incomplete')
          PY

      - name: Сохранить подтверждение
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add FINALIZE_BUILD60_RUN_STATUS.md
          git commit -m "Подтвердить успешную публикацию build 60 [skip ci]" || true
          git push origin HEAD:main
