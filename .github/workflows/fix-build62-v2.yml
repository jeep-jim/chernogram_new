name: Чернограм build 62 — исправленный структурный патч

on:
  push:
    branches: [feature/storage-version-qr-062]
    paths:
      - .github/workflows/fix-build62-v2.yml
  workflow_dispatch:

permissions:
  contents: write

env:
  VERSION_FULL: 0.24.2+62
  VERSION_NAME: 0.24.2
  VERSION_CODE: 62
  RELEASE_TAG: chernogram-0.24.2-build62
  FLUTTER_VERSION: 3.44.8
  CERT_SHA256: "F4:A2:C8:36:A8:36:71:19:78:10:FA:6E:98:2D:77:F4:C7:31:D0:9B:18:95:15:C0:13:D0:2D:0D:94:2D:9B:BE"

jobs:
  build_publish:
    runs-on: ubuntu-22.04
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/storage-version-qr-062
          fetch-depth: 0

      - name: Подключить компоненты без переписывания интерфейса
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('lib/android_data_first.dart')
          s = p.read_text(encoding='utf-8')

          if "import 'device_product_panels.dart';" not in s:
              anchor = "import 'core_models.dart';\n"
              if anchor not in s:
                  raise RuntimeError('core_models import not found')
              s = s.replace(anchor, anchor + "import 'device_product_panels.dart';\n", 1)

          files_start = s.index('class _FilesPageState extends State<_FilesPage> {')
          files_end = s.index('class _MusicEntry', files_start)
          files_block = s[files_start:files_end]
          if 'CgDeviceStorageCard' not in files_block:
              marker = """        Padding(
          padding: const EdgeInsets.symmetric(horizontal: 14),
          child: Row(
"""
              if marker not in files_block:
                  raise RuntimeError('files filter row marker not found')
              files_block = files_block.replace(
                  marker,
                  """        Padding(
          padding: const EdgeInsets.fromLTRB(14, 0, 14, 9),
          child: CgDeviceStorageCard(ru: widget.ru),
        ),
        Padding(
          padding: const EdgeInsets.symmetric(horizontal: 14),
          child: Row(
""",
                  1,
              )
              s = s[:files_start] + files_block + s[files_end:]

          profile_start = s.index('class _ProfilePage extends StatelessWidget {')
          profile_end = s.index('class _ProfileAction', profile_start)
          profile_block = s[profile_start:profile_end]
          if "title: ru ? 'Версия и поделиться'" not in profile_block:
              marker = """      _ProfileAction(
        icon: Icons.system_update_alt_rounded,
        title: ru ? 'Проверить обновления' : 'Check updates',
"""
              if marker not in profile_block:
                  raise RuntimeError('profile update action marker not found')
              profile_block = profile_block.replace(
                  marker,
                  """      _ProfileAction(
        icon: Icons.qr_code_2_rounded,
        title: ru ? 'Версия и поделиться' : 'Version and share',
        subtitle: ru
            ? 'Номер версии, ссылка установки и QR-код.'
            : 'Product version, installation link, and QR code.',
        onTap: () => showChernogramProductInfo(context, ru: ru),
      ),
      const SizedBox(height: 8),
      _ProfileAction(
        icon: Icons.system_update_alt_rounded,
        title: ru ? 'Проверить обновления' : 'Check updates',
""",
                  1,
              )
              s = s[:profile_start] + profile_block + s[profile_end:]

          p.write_text(s, encoding='utf-8')

          pub = Path('pubspec.yaml')
          ps = pub.read_text(encoding='utf-8')
          pub.write_text(
              re.sub(r'^version:\s*\S+', 'version: 0.24.2+62', ps, count=1, flags=re.M),
              encoding='utf-8',
          )

          icon = '''<vector xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:aapt="http://schemas.android.com/aapt"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="1080" android:viewportHeight="1080">
            <path android:fillColor="#070A12"
              android:pathData="M180,70 H900 A110,110 0,0 1,1010 180 V900 A110,110 0,0 1,900 1010 H180 A110,110 0,0 1,70 900 V180 A110,110 0,0 1,180 70 Z" />
            <path android:fillColor="@android:color/transparent"
              android:strokeWidth="22.8571" android:strokeLineCap="round"
              android:pathData="M151.20,248.40 L151.20,480.60 M206.74,181.65 L206.74,686.26 M262.29,157.70 L262.29,399.60 M262.29,480.60 L262.29,763.50 M317.83,142.04 L317.83,399.60 M317.83,480.60 L317.83,815.87 M373.37,131.31 L373.37,399.60 M373.37,480.60 L373.37,853.48 M428.91,124.20 L428.91,399.60 M428.91,480.60 L428.91,880.19 M484.46,120.13 L484.46,897.81 M540.00,118.80 L540.00,907.20 M595.54,120.13 L595.54,897.81 M651.09,124.20 L651.09,399.60 M651.09,480.60 L651.09,880.19 M706.63,131.31 L706.63,399.60 M706.63,480.60 L706.63,853.48 M762.17,142.04 L762.17,399.60 M762.17,480.60 L762.17,815.87 M817.71,157.70 L817.71,399.60 M817.71,480.60 L817.71,763.50 M873.26,181.65 L873.26,686.26 M928.80,248.40 L928.80,480.60">
              <aapt:attr name="android:strokeColor">
                <gradient android:type="linear" android:startX="540" android:startY="118.8" android:endX="540" android:endY="907.2">
                  <item android:offset="0" android:color="#B9A8FF" />
                  <item android:offset="0.52" android:color="#7B5CFF" />
                  <item android:offset="1" android:color="#20C7FF" />
                </gradient>
              </aapt:attr>
            </path>
          </vector>
          '''
          Path('android/app/src/main/res/drawable/chernogram_launcher_icon.xml').write_text(icon, encoding='utf-8')
          PY

          dart format lib/android_data_first.dart lib/device_product_panels.dart
          grep -q "CgDeviceStorageCard" lib/android_data_first.dart
          grep -q "Версия и поделиться" lib/android_data_first.dart
          grep -q "PackageInfo.fromPlatform" lib/device_product_panels.dart
          grep -q "QrImageView" lib/device_product_panels.dart
          grep -q "M151.20,248.40" android/app/src/main/res/drawable/chernogram_launcher_icon.xml
          grep -q "version: 0.24.2+62" pubspec.yaml
          grep -q "class _ChernogramFacePainter" lib/brand.dart
          ! grep -q "class _ChernogramMarkPainter" lib/brand.dart

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-build62-v2.yml
          rm -f .github/workflows/apply-storage-version-qr-062.yml
          git add -A
          git commit -m "Добавить память, версию, QR и единый логотип 0.24.2+62"
          git push origin HEAD:feature/storage-version-qr-062

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - uses: actions/cache/restore@v4
        with:
          path: ~/.android/debug.keystore
          key: chernogram-stable-signing-v2
          fail-on-cache-miss: false

      - name: Восстановить подпись
        shell: bash
        env:
          CHERNOGRAM_KEYSTORE_B64: ${{ secrets.CHERNOGRAM_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          if [ -n "${CHERNOGRAM_KEYSTORE_B64:-}" ]; then
            printf '%s' "$CHERNOGRAM_KEYSTORE_B64" | base64 --decode > "$HOME/.android/debug.keystore"
            chmod 600 "$HOME/.android/debug.keystore"
          fi
          test -s "$HOME/.android/debug.keystore"
          keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android > certificate.txt
          ACTUAL=$(grep -m1 'SHA256:' certificate.txt | sed 's/.*SHA256: //' | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')
          EXPECTED=$(printf '%s' "$CERT_SHA256" | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')
          test "$ACTUAL" = "$EXPECTED"

      - name: Анализ, тесты и APK
        shell: bash
        run: |
          set -o pipefail
          (
            set -euo pipefail
            flutter pub get
            flutter analyze --no-fatal-infos --no-fatal-warnings
            flutter test
            flutter build apk --release
            SOURCE_APK=build/app/outputs/flutter-apk/app-release.apk
            test -s "$SOURCE_APK"
            APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
            AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)
            "$APKSIGNER" sign --ks "$HOME/.android/debug.keystore" --ks-key-alias androiddebugkey --ks-pass pass:android --key-pass pass:android --out chernogram.apk "$SOURCE_APK"
            "$APKSIGNER" verify --print-certs chernogram.apk | tee apk-signature.txt
            "$AAPT" dump badging chernogram.apk | tee apk-badging.txt
            grep -q "versionCode='$VERSION_CODE'" apk-badging.txt
            grep -q "versionName='$VERSION_NAME'" apk-badging.txt
            sha256sum chernogram.apk | tee apk-sha256.txt
          ) 2>&1 | tee build-062.log

      - name: Манифест и Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APK_SHA=$(awk '{print $1}' apk-sha256.txt)
          cat > update-build62.json <<EOF
          {
            "versionName": "${VERSION_NAME}",
            "versionCode": ${VERSION_CODE},
            "apkUrl": "https://github.com/jeep-jim/chernogram_new/releases/download/${RELEASE_TAG}/chernogram.apk?v=${VERSION_CODE}",
            "sha256": "${APK_SHA}",
            "certificateSha256": "${CERT_SHA256}",
            "notesRu": "Добавлены занятое, свободное и общее место на диске в Файлах; версия и номер сборки; ссылка и QR-код; launcher-иконка повторяет полосатый логотип приложения.",
            "notesEn": "Added used, free and total storage in Files; app version and build; share link and QR code; launcher icon matching the striped in-app logo."
          }
          EOF
          python -m json.tool update-build62.json >/dev/null
          cp update-build62.json /tmp/update-build62.json
          gh release delete "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes || true
          gh release create "$RELEASE_TAG" chernogram.apk update-build62.json apk-sha256.txt apk-signature.txt apk-badging.txt --repo "$GITHUB_REPOSITORY" --target feature/storage-version-qr-062 --title "Чернограм 0.24.2+62 — диск, версия, QR и единый логотип" --notes "Память устройства, версия, QR и точная launcher-иконка." --prerelease

      - name: Включить update.json
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          rm -rf /tmp/chernogram-main-062
          git worktree add -B publish-062 /tmp/chernogram-main-062 origin/main
          cd /tmp/chernogram-main-062
          cp /tmp/update-build62.json update.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add update.json
          git commit -m "Включить Чернограм 0.24.2+62 [skip ci]"
          git push origin HEAD:main

      - name: Проверить публикацию
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "/repos/${GITHUB_REPOSITORY}/contents/update.json?ref=main" --jq '.content' | tr -d '\n' | base64 --decode > published-update.json
          grep -q '"versionCode": 62' published-update.json
          grep -q "$RELEASE_TAG/chernogram.apk" published-update.json
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chernogram-0.24.2-build62
          path: |
            chernogram.apk
            update-build62.json
            published-update.json
            apk-signature.txt
            apk-badging.txt
            apk-sha256.txt
            build-062.log
          if-no-files-found: warn
          retention-days: 14
