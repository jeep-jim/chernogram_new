name: Chernogram Media and Presence 0.91

on:
  push:
    branches:
      - rebuild/minimal-room-chat-081
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: chernogram-room-alpha-build
  cancel-in-progress: true

env:
  UI_SOURCES: lib/main.dart lib/light/light_chat_app.dart lib/light/light_invite_qr.dart lib/light/light_theme.dart lib/core_models.dart lib/chat_media.dart lib/chat_screen.dart lib/call_service.dart lib/internet_core.dart lib/public_mqtt_transport.dart lib/update_service.dart lib/client_settings.dart lib/device_product_panels.dart lib/legacy_v16_features.dart lib/push_service.dart lib/app_monitor.dart lib/background_runtime.dart lib/desktop_runtime.dart lib/ui_presence.dart lib/sound_service.dart
  CG_KEYSTORE_PATH: /home/runner/.chernogram-signing/release.jks
  CG_KEYSTORE_PASSWORD: CgRoomAlpha_85_Stable_9yW2pQ7m
  CG_KEY_ALIAS: chernogram
  CG_KEY_PASSWORD: CgRoomAlpha_85_Stable_9yW2pQ7m
  CG_CERT_SHA256: 764bb1b6135f9203d8eca41dc7fd84ec6cafdd7b4eb3ad6044765de899195749

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Restore permanent Chernogram signing key
        uses: actions/cache@v4
        with:
          path: ~/.chernogram-signing/release.jks
          key: chernogram-release-signing-v1
          fail-on-cache-miss: true

      - name: Apply proven transport, UI and 0.91 features
        run: |
          python tool/apply_minimal_room_081.py
          python tool/fix_minimal_room_081.py
          python tool/fix_invite_host_082.py
          python tool/fix_stability_083.py
          python tool/ui_full_084.py
          python tool/fix_ui_084_compile.py
          python tool/ui_polish_085.py
          python tool/fix_ui_085_compile.py
          python tool/presence_notifications_085.py
          python tool/fix_windows_updater_085.py
          python tool/chat_files_notifications_085.py
          python tool/signing_085.py
          python tool/updater_086.py
          python tool/fix_updater_086_compile.py
          python tool/prepare_android_startup_087.py
          python tool/android_startup_087.py
          python tool/android_fgs_088.py
          python tool/android_storage_startup_089.py
          python tool/install_update_090.py
          python tool/media_presence_091.py
          python tool/install_update_091.py
          python tool/fix_media_presence_091_compile.py

      - name: Materialize mask icons and ringtone
        run: |
          python -m pip install --disable-pip-version-check pillow
          python tool/materialize_brand_assets_085.py

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze client
        run: flutter analyze --no-fatal-infos --no-fatal-warnings $UI_SOURCES

      - name: Verify 0.91 Android features
        run: |
          grep -q 'version: 0.91.0+91' pubspec.yaml
          grep -q 'desktop_drop: ^0.7.1' pubspec.yaml
          grep -q 'chernogram-android-0.91.apk' lib/client_settings.dart
          grep -q 'class _CgInlineVideoPreview' lib/chat_media.dart
          grep -q 'class _CgInlineCircle' lib/chat_media.dart
          grep -q 'DropTarget(' lib/chat_screen.dart
          grep -q 'chernogram_messages_v2' lib/background_runtime.dart
          grep -q 'chernogram_calls_v3' lib/background_runtime.dart
          grep -q 'additionalFlags: Int32List.fromList' lib/background_runtime.dart
          grep -q 'for (final tunnel in recent)' lib/background_runtime.dart
          ! grep -q 'recent.take(12)' lib/background_runtime.dart
          ! grep -q 'archiveTunnels(_chats)' lib/light/light_chat_app.dart
          grep -q "'sourcePath': source.path" lib/chat_media.dart
          grep -q 'source.inputStream().buffered()' android/app/src/main/kotlin/com/example/chernogram/MainActivity.kt

      - name: Build Android APK
        run: flutter build apk --release

      - name: Verify permanent Android signer
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n1)
          CERT_INFO=$("$APKSIGNER" verify --print-certs build/app/outputs/flutter-apk/app-release.apk)
          echo "$CERT_INFO"
          echo "$CERT_INFO" | grep -qi "$CG_CERT_SHA256"

      - name: Verify merged Android manifest
        run: |
          APKANALYZER=$(find "$ANDROID_HOME" -name apkanalyzer -type f | head -n1)
          "$APKANALYZER" manifest print build/app/outputs/flutter-apk/app-release.apk > /tmp/chernogram-manifest.xml
          grep -q 'FOREGROUND_SERVICE_REMOTE_MESSAGING' /tmp/chernogram-manifest.xml
          grep -q 'id.flutter.flutter_background_service.BackgroundService' /tmp/chernogram-manifest.xml
          grep -q 'android.permission.WAKE_LOCK' /tmp/chernogram-manifest.xml
          grep -Eqi 'foregroundServiceType="0x200"|remoteMessaging' /tmp/chernogram-manifest.xml

      - name: Prepare Android artifact
        run: cp build/app/outputs/flutter-apk/app-release.apk chernogram-android-0.91.apk

      - uses: actions/upload-artifact@v4
        with:
          name: chernogram-android-0.91
          path: chernogram-android-0.91.apk
          if-no-files-found: error

  windows:
    runs-on: windows-2025
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Apply proven transport, UI and 0.91 features
        shell: pwsh
        run: |
          python tool/apply_minimal_room_081.py
          python tool/fix_minimal_room_081.py
          python tool/fix_invite_host_082.py
          python tool/fix_stability_083.py
          python tool/ui_full_084.py
          python tool/fix_ui_084_compile.py
          python tool/ui_polish_085.py
          python tool/fix_ui_085_compile.py
          python tool/presence_notifications_085.py
          python tool/fix_windows_updater_085.py
          python tool/chat_files_notifications_085.py
          python tool/updater_086.py
          python tool/fix_updater_086_compile.py
          python tool/prepare_android_startup_087.py
          python tool/android_startup_087.py
          python tool/android_fgs_088.py
          python tool/android_storage_startup_089.py
          python tool/install_update_090.py
          python tool/media_presence_091.py
          python tool/install_update_091.py
          python tool/fix_media_presence_091_compile.py

      - name: Materialize mask icons and ringtone
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check pillow
          python tool/materialize_brand_assets_085.py

      - name: Resolve dependencies
        run: flutter pub get

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Analyze client
        shell: pwsh
        run: flutter analyze --no-fatal-infos --no-fatal-warnings $env:UI_SOURCES.Split(' ')

      - name: Verify 0.91 Windows features
        shell: pwsh
        run: |
          if (!(Select-String -Path pubspec.yaml -Pattern 'version: 0.91.0+91' -Quiet)) { throw '0.91 version missing' }
          if (!(Select-String -Path pubspec.yaml -Pattern 'desktop_drop: \^0.7.1' -Quiet)) { throw 'desktop_drop missing' }
          if (!(Select-String -Path lib\chat_screen.dart -Pattern 'DropTarget\(' -Quiet)) { throw 'drop target missing' }
          if (!(Select-String -Path lib\chat_media.dart -Pattern 'class _CgInlineVideoPreview' -Quiet)) { throw 'video preview missing' }
          if (!(Select-String -Path lib\client_settings.dart -Pattern 'chernogram-android-0.91.apk' -Quiet)) { throw '0.91 QR URL missing' }

      - name: Build Windows client
        run: flutter build windows --release

      - name: Enable MSVC command line
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build native updater helper
        shell: pwsh
        run: |
          cl.exe /nologo /std:c++17 /EHsc windows\updater\chernogram_updater.cpp /Fe:build\windows\x64\runner\Release\chernogram_updater.exe
          if (!(Test-Path build\windows\x64\runner\Release\chernogram_updater.exe)) { throw 'chernogram_updater.exe was not built' }

      - name: Pack Windows client
        shell: pwsh
        run: |
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath chernogram-windows-0.91.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: chernogram-windows-0.91
          path: chernogram-windows-0.91.zip
          if-no-files-found: error

  release:
    needs: [android, windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: chernogram-android-0.91
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: chernogram-windows-0.91
          path: dist

      - name: Create online update manifest
        shell: bash
        run: |
          APK_SHA=$(sha256sum dist/chernogram-android-0.91.apk | cut -d ' ' -f 1)
          WIN_SHA=$(sha256sum dist/chernogram-windows-0.91.zip | cut -d ' ' -f 1)
          cat > dist/update.json <<EOF
          {
            "versionName": "0.91.0",
            "versionCode": 91,
            "apkUrl": "https://github.com/jeep-jim/chernogram_new/releases/download/latest-room-alpha/chernogram-android-0.91.apk",
            "windowsUrl": "https://github.com/jeep-jim/chernogram_new/releases/download/latest-room-alpha/chernogram-windows-0.91.zip",
            "sha256": "$APK_SHA",
            "windowsSha256": "$WIN_SHA",
            "notesRu": "Медиа 0.91: удалён чёрный зависающий кружок у получателя; фото/GIF/видео всегда показывают превью и открываются на весь экран; Windows принимает файлы перетаскиванием прямо в чат; в медиатеке появились реальные превью. Android снова держит безопасную фоновую связь после запуска и показывает сообщения на заблокированном экране. Звонок использует повторяющуюся полную мелодию. На главной показан @никнейм, фото профиля можно удалить. QR установки ведёт на APK 0.91.",
            "notesEn": "Media 0.91: remote circles recover after transfer; photo/GIF/video always show previews and open full screen; Windows accepts files by drag-and-drop; media library has real previews. Android background delivery is re-enabled after safe delayed startup and lock-screen messages are visible. Incoming-call sound repeats until the call notification ends. Home shows @nickname and profile photo can be removed. Install QR points to Android 0.91."
          }
          EOF

      - name: Publish 0.91
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-room-alpha
          name: Chernogram Room Alpha 0.91
          prerelease: true
          make_latest: false
          overwrite_files: true
          body: |
            0.91 — медиа-превью, исправление кружков, drag-and-drop Windows, фоновые Android-уведомления, полный рингтон и правки профиля. Онлайн-обновление Android + Windows сохраняется.
          files: |
            dist/chernogram-android-0.91.apk
            dist/chernogram-windows-0.91.zip
            dist/update.json
