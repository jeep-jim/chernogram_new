name: Chernogram Stable Room 0.83

on:
  push:
    branches:
      - rebuild/minimal-room-chat-081
  workflow_dispatch:

permissions:
  contents: write

env:
  MINIMAL_SOURCES: lib/main.dart lib/light/light_chat_app.dart lib/core_models.dart lib/chat_media.dart lib/chat_screen.dart lib/call_service.dart lib/internet_core.dart lib/public_mqtt_transport.dart lib/update_service.dart

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Apply stable room build
        run: |
          python tool/apply_minimal_room_081.py
          python tool/fix_minimal_room_081.py
          python tool/fix_invite_host_082.py
          python tool/fix_stability_083.py

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze stable client
        run: flutter analyze --no-fatal-infos --no-fatal-warnings $MINIMAL_SOURCES

      - name: Build Android APK
        run: flutter build apk --release --target-platform android-arm64

      - name: Prepare Android artifact
        run: cp build/app/outputs/flutter-apk/app-release.apk chernogram-room.apk

      - uses: actions/upload-artifact@v4
        with:
          name: chernogram-room-android-083
          path: chernogram-room.apk
          if-no-files-found: error

  windows:
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Apply stable room build
        shell: pwsh
        run: |
          python tool/apply_minimal_room_081.py
          python tool/fix_minimal_room_081.py
          python tool/fix_invite_host_082.py
          python tool/fix_stability_083.py

      - name: Resolve dependencies
        run: flutter pub get

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Analyze stable client
        shell: pwsh
        run: flutter analyze --no-fatal-infos --no-fatal-warnings $env:MINIMAL_SOURCES.Split(' ')

      - name: Build Windows client
        run: flutter build windows --release

      - name: Pack Windows client
        shell: pwsh
        run: |
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath chernogram-room-windows.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: chernogram-room-windows-083
          path: chernogram-room-windows.zip
          if-no-files-found: error

  release:
    needs: [android, windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: chernogram-room-android-083
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: chernogram-room-windows-083
          path: dist

      - name: Create online update manifest
        shell: bash
        run: |
          APK_SHA=$(sha256sum dist/chernogram-room.apk | cut -d ' ' -f 1)
          WIN_SHA=$(sha256sum dist/chernogram-room-windows.zip | cut -d ' ' -f 1)
          cat > dist/update.json <<EOF
          {
            "versionName": "0.83.0",
            "versionCode": 83,
            "apkUrl": "https://github.com/jeep-jim/chernogram_new/releases/download/latest-room-alpha/chernogram-room.apk",
            "windowsUrl": "https://github.com/jeep-jim/chernogram_new/releases/download/latest-room-alpha/chernogram-room-windows.zip",
            "sha256": "$APK_SHA",
            "windowsSha256": "$WIN_SHA",
            "notesRu": "Исправлено зависание при отправке: тяжёлые вложения вынесены из настроек на диск, отправка больше не ждёт сетевой reconnect. MQTT переведён на WSS-first. Файлы читаются и передаются частями. Windows 0.83 и новее обновляется внутри приложения с автоматическим перезапуском.",
            "notesEn": "Fixed send freezes: large attachments are kept on disk, sending no longer waits for network reconnect, MQTT is WSS-first, and files are streamed in chunks. Windows 0.83+ self-updates in app and restarts automatically."
          }
          EOF

      - name: Publish stable room channel
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-room-alpha
          name: Chernogram Room Alpha 0.83
          prerelease: true
          make_latest: false
          overwrite_files: true
          body: |
            0.83 — стабилизация отправки и online updater. Вложения больше не сериализуются целиком в SharedPreferences, сеть не блокирует отправку, транспорт сначала использует WSS. Android обновляется через OTA. Windows начиная с 0.83 скачивает ZIP, заменяет файлы и перезапускается самостоятельно.
          files: |
            dist/chernogram-room.apk
            dist/chernogram-room-windows.zip
            dist/update.json
