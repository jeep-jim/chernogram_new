name: Chernogram Android Stability 0.87

on:
  push:
    branches:
      - rebuild/minimal-room-chat-081
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: chernogram-room-alpha-build
  cancel-in-progress: true

env:
  UI_SOURCES: lib/main.dart lib/light/light_chat_app.dart lib/light/light_invite_qr.dart lib/light/light_theme.dart lib/core_models.dart lib/chat_media.dart lib/chat_screen.dart lib/call_service.dart lib/internet_core.dart lib/public_mqtt_transport.dart lib/update_service.dart lib/client_settings.dart lib/device_product_panels.dart lib/legacy_v16_features.dart lib/push_service.dart lib/app_monitor.dart lib/background_runtime.dart lib/desktop_runtime.dart lib/ui_presence.dart lib/sound_service.dart
  CG_KEYSTORE_PATH: /home/runner/.chernogram-signing/release.jks
  CG_KEYSTORE_PASSWORD: CgRoomAlpha_85_Stable_9yW2pQ7m
  CG_KEY_ALIAS: chernogram
  CG_KEY_PASSWORD: CgRoomAlpha_85_Stable_9yW2pQ7m
  CG_CERT_SHA256: 764bb1b6135f9203d8eca41dc7fd84ec6cafdd7b4eb3ad6044765de899195749

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Restore permanent Chernogram signing key
        uses: actions/cache@v4
        with:
          path: ~/.chernogram-signing/release.jks
          key: chernogram-release-signing-v1
          fail-on-cache-miss: true

      - name: Apply proven transport, UI and Android stability 0.87
        run: |
          python tool/apply_minimal_room_081.py
          python tool/fix_minimal_room_081.py
          python tool/fix_invite_host_082.py
          python tool/fix_stability_083.py
          python tool/ui_full_084.py
          python tool/fix_ui_084_compile.py
          python tool/ui_polish_085.py
          python tool/fix_ui_085_compile.py
          python tool/presence_notifications_085.py
          python tool/fix_windows_updater_085.py
          python tool/chat_files_notifications_085.py
          python tool/signing_085.py
          python tool/updater_086.py
          python tool/fix_updater_086_compile.py
          python tool/android_startup_087.py

      - name: Materialize mask icons and ringtone
        run: |
          python -m pip install --disable-pip-version-check pillow
          python tool/materialize_brand_assets_085.py

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze client
        run: flutter analyze --no-fatal-infos --no-fatal-warnings $UI_SOURCES

      - name: Build Android APK
        run: flutter build apk --release

      - name: Verify permanent Android signer
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n1)
          CERT_INFO=$("$APKSIGNER" verify --print-certs build/app/outputs/flutter-apk/app-release.apk)
          echo "$CERT_INFO"
          echo "$CERT_INFO" | grep -qi "$CG_CERT_SHA256"

      - name: Prepare versioned Android artifact
        run: cp build/app/outputs/flutter-apk/app-release.apk chernogram-android-0.87.apk

      - uses: actions/upload-artifact@v4
        with:
          name: chernogram-android-0.87
          path: chernogram-android-0.87.apk
          if-no-files-found: error

  windows:
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Apply proven transport, UI and updater 0.87
        shell: pwsh
        run: |
          python tool/apply_minimal_room_081.py
          python tool/fix_minimal_room_081.py
          python tool/fix_invite_host_082.py
          python tool/fix_stability_083.py
          python tool/ui_full_084.py
          python tool/fix_ui_084_compile.py
          python tool/ui_polish_085.py
          python tool/fix_ui_085_compile.py
          python tool/presence_notifications_085.py
          python tool/fix_windows_updater_085.py
          python tool/chat_files_notifications_085.py
          python tool/updater_086.py
          python tool/fix_updater_086_compile.py
          python tool/android_startup_087.py

      - name: Materialize mask icons and ringtone
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check pillow
          python tool/materialize_brand_assets_085.py

      - name: Resolve dependencies
        run: flutter pub get

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Analyze client
        shell: pwsh
        run: flutter analyze --no-fatal-infos --no-fatal-warnings $env:UI_SOURCES.Split(' ')

      - name: Build Windows client
        run: flutter build windows --release

      - name: Enable MSVC command line
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build native updater helper
        shell: pwsh
        run: |
          cl.exe /nologo /std:c++17 /EHsc windows\updater\chernogram_updater.cpp /Fe:build\windows\x64\runner\Release\chernogram_updater.exe
          if (!(Test-Path build\windows\x64\runner\Release\chernogram_updater.exe)) { throw 'chernogram_updater.exe was not built' }

      - name: Pack versioned Windows client
        shell: pwsh
        run: |
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath chernogram-windows-0.87.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: chernogram-windows-0.87
          path: chernogram-windows-0.87.zip
          if-no-files-found: error

  release:
    needs: [android, windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: chernogram-android-0.87
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: chernogram-windows-0.87
          path: dist

      - name: Create exact-version update manifest
        shell: bash
        run: |
          APK_SHA=$(sha256sum dist/chernogram-android-0.87.apk | cut -d ' ' -f 1)
          WIN_SHA=$(sha256sum dist/chernogram-windows-0.87.zip | cut -d ' ' -f 1)
          cat > dist/update.json <<EOF
          {
            "versionName": "0.87.0",
            "versionCode": 87,
            "apkUrl": "https://github.com/jeep-jim/chernogram_new/releases/download/latest-room-alpha/chernogram-android-0.87.apk",
            "windowsUrl": "https://github.com/jeep-jim/chernogram_new/releases/download/latest-room-alpha/chernogram-windows-0.87.zip",
            "sha256": "$APK_SHA",
            "windowsSha256": "$WIN_SHA",
            "notesRu": "Исправлен запуск Android после 0.86 без изменения рабочих MQTT/WebRTC маршрутов. Фоновая служба и push больше не блокируют первый экран; ошибки OEM-фона не могут закрыть приложение. Android OTA возвращён на проверенный системный установщик ota_update, а постоянная подпись 0.85+ сохранена. Windows updater остаётся нативным и автоматическим.",
            "notesEn": "Android startup fix after 0.86 without changing the proven MQTT/WebRTC routes. Background service and push no longer block the first frame; OEM background errors cannot close the app. Android OTA uses the proven ota_update system-installer flow with the pinned 0.85+ signing certificate. Windows keeps the native automatic updater."
          }
          EOF

      - name: Publish 0.87
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-room-alpha
          name: Chernogram Room Alpha 0.87
          prerelease: true
          make_latest: false
          overwrite_files: true
          body: |
            0.87 исправляет Android startup/OTA. MQTT/WebRTC маршруты не изменяются.
          files: |
            dist/chernogram-android-0.87.apk
            dist/chernogram-windows-0.87.zip
            dist/update.json
