name: Chernogram UI Room 0.85

on:
  push:
    branches:
      - rebuild/minimal-room-chat-081
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: chernogram-room-alpha-build
  cancel-in-progress: true

env:
  UI_SOURCES: lib/main.dart lib/light/light_chat_app.dart lib/light/light_invite_qr.dart lib/light/light_theme.dart lib/core_models.dart lib/chat_media.dart lib/chat_screen.dart lib/call_service.dart lib/internet_core.dart lib/public_mqtt_transport.dart lib/update_service.dart lib/client_settings.dart lib/device_product_panels.dart lib/legacy_v16_features.dart lib/push_service.dart lib/app_monitor.dart lib/background_runtime.dart lib/desktop_runtime.dart lib/ui_presence.dart lib/sound_service.dart
  CG_KEYSTORE_PATH: /home/runner/.chernogram-signing/release.jks
  CG_KEYSTORE_PASSWORD: CgRoomAlpha_85_Stable_9yW2pQ7m
  CG_KEY_ALIAS: chernogram
  CG_KEY_PASSWORD: CgRoomAlpha_85_Stable_9yW2pQ7m

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Restore Chernogram signing key
        id: signing-cache
        uses: actions/cache@v4
        with:
          path: ~/.chernogram-signing/release.jks
          key: chernogram-release-signing-v1

      - name: Create Chernogram signing key once
        if: steps.signing-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.chernogram-signing
          keytool -genkeypair -v \
            -keystore "$CG_KEYSTORE_PATH" \
            -storetype JKS \
            -storepass "$CG_KEYSTORE_PASSWORD" \
            -keypass "$CG_KEY_PASSWORD" \
            -alias "$CG_KEY_ALIAS" \
            -keyalg RSA \
            -keysize 4096 \
            -validity 10000 \
            -dname "CN=Chernogram, OU=Room, O=Chernogram, L=Internet, C=DE"

      - name: Apply proven transport and UI 0.85
        run: |
          python tool/apply_minimal_room_081.py
          python tool/fix_minimal_room_081.py
          python tool/fix_invite_host_082.py
          python tool/fix_stability_083.py
          python tool/ui_full_084.py
          python tool/fix_ui_084_compile.py
          python tool/ui_polish_085.py
          python tool/fix_ui_085_compile.py
          python tool/presence_notifications_085.py
          python tool/fix_windows_updater_085.py
          python tool/fix_windows_updater_085_v2.py
          python tool/signing_085.py

      - name: Materialize mask icons and user ringtone
        run: |
          python -m pip install --disable-pip-version-check pillow
          python tool/materialize_brand_assets_085.py

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze UI client
        run: flutter analyze --no-fatal-infos --no-fatal-warnings $UI_SOURCES

      - name: Build Android APK
        run: flutter build apk --release --target-platform android-arm64

      - name: Verify Android signature
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n1)
          "$APKSIGNER" verify --print-certs build/app/outputs/flutter-apk/app-release.apk

      - name: Prepare Android artifact
        run: cp build/app/outputs/flutter-apk/app-release.apk chernogram-room.apk

      - uses: actions/upload-artifact@v4
        with:
          name: chernogram-room-android-085
          path: chernogram-room.apk
          if-no-files-found: error

  windows:
    runs-on: windows-2025
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Apply proven transport and UI 0.85
        shell: pwsh
        run: |
          python tool/apply_minimal_room_081.py
          python tool/fix_minimal_room_081.py
          python tool/fix_invite_host_082.py
          python tool/fix_stability_083.py
          python tool/ui_full_084.py
          python tool/fix_ui_084_compile.py
          python tool/ui_polish_085.py
          python tool/fix_ui_085_compile.py
          python tool/presence_notifications_085.py
          python tool/fix_windows_updater_085.py
          python tool/fix_windows_updater_085_v2.py

      - name: Materialize exact Chernogram icons and user ringtone
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check pillow
          python tool/materialize_brand_assets_085.py

      - name: Resolve dependencies
        run: flutter pub get

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Analyze UI client
        shell: pwsh
        run: flutter analyze --no-fatal-infos --no-fatal-warnings $env:UI_SOURCES.Split(' ')

      - name: Build Windows client
        run: flutter build windows --release

      - name: Pack Windows client
        shell: pwsh
        run: |
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath chernogram-room-windows.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: chernogram-room-windows-085
          path: chernogram-room-windows.zip
          if-no-files-found: error

  release:
    needs: [android, windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: chernogram-room-android-085
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: chernogram-room-windows-085
          path: dist

      - name: Create online update manifest
        shell: bash
        run: |
          APK_SHA=$(sha256sum dist/chernogram-room.apk | cut -d ' ' -f 1)
          WIN_SHA=$(sha256sum dist/chernogram-room-windows.zip | cut -d ' ' -f 1)
          cat > dist/update.json <<EOF
          {
            "versionName": "0.85.0",
            "versionCode": 85,
            "apkUrl": "https://github.com/jeep-jim/chernogram_new/releases/download/latest-room-alpha/chernogram-room.apk",
            "windowsUrl": "https://github.com/jeep-jim/chernogram_new/releases/download/latest-room-alpha/chernogram-room-windows.zip",
            "sha256": "$APK_SHA",
            "windowsSha256": "$WIN_SHA",
            "notesRu": "Интерфейс и фон без изменения работающих MQTT/WebRTC маршрутов: фото комнаты; профиль вместо логотипа и без нижней панели; фирменная мелодия звонка; единая маска-иконка; Windows остаётся в трее после закрытия окна; Android держит фоновую службу; карандаш при наборе; явное прочитано; реакции только по удерживанию; QR приглашения закрывается после подключения; уведомление не перекрывает открытый чат и показывается при другом чате, свёрнутом или закрытом приложении; улучшен Windows updater.",
            "notesEn": "UI/background release preserving the working MQTT/WebRTC routes: room avatar, profile in the header with no bottom bar, branded ringtone, unified mask icon, Windows tray residency, Android foreground receiver, typing pencil, explicit read state, reactions on long press, invite QR auto-closes after peer joins, notifications stay out of the open room and return when minimized/hidden, and the Windows updater is hardened."
          }
          EOF

      - name: Publish online update 0.85
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-room-alpha
          name: Chernogram Room Alpha 0.85
          prerelease: true
          make_latest: false
          overwrite_files: true
          body: |
            0.85 не меняет рабочие MQTT/WebRTC маршруты 0.83. Это интерфейс, локальные медиа, фоновые уведомления, typing/read, QR-подключение, фирменные иконки/звук и надёжность встроенного обновления.
          files: |
            dist/chernogram-room.apk
            dist/chernogram-room-windows.zip
            dist/update.json
