name: Chernogram Clipboard Images 0.94

on:
  push:
    branches:
      - rebuild/minimal-room-chat-081
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: chernogram-room-alpha-build
  cancel-in-progress: true

env:
  UI_SOURCES: lib/main.dart lib/light/light_chat_app.dart lib/light/light_invite_qr.dart lib/light/light_theme.dart lib/core_models.dart lib/chat_media.dart lib/chat_screen.dart lib/call_service.dart lib/internet_core.dart lib/public_mqtt_transport.dart lib/update_service.dart lib/client_settings.dart lib/device_product_panels.dart lib/legacy_v16_features.dart lib/push_service.dart lib/app_monitor.dart lib/background_runtime.dart lib/desktop_runtime.dart lib/ui_presence.dart lib/sound_service.dart
  CG_KEYSTORE_PATH: /home/runner/.chernogram-signing/release.jks
  CG_KEYSTORE_PASSWORD: CgRoomAlpha_85_Stable_9yW2pQ7m
  CG_KEY_ALIAS: chernogram
  CG_KEY_PASSWORD: CgRoomAlpha_85_Stable_9yW2pQ7m
  CG_CERT_SHA256: 764bb1b6135f9203d8eca41dc7fd84ec6cafdd7b4eb3ad6044765de899195749

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Restore permanent Chernogram signing key
        uses: actions/cache@v4
        with:
          path: ~/.chernogram-signing/release.jks
          key: chernogram-release-signing-v1
          fail-on-cache-miss: true

      - name: Apply proven transport, UI and 0.91 features
        run: |
          python tool/apply_minimal_room_081.py
          python tool/fix_minimal_room_081.py
          python tool/fix_invite_host_082.py
          python tool/fix_stability_083.py
          python tool/ui_full_084.py
          python tool/fix_ui_084_compile.py
          python tool/ui_polish_085.py
          python tool/fix_ui_085_compile.py
          python tool/presence_notifications_085.py
          python tool/fix_windows_updater_085.py
          python tool/chat_files_notifications_085.py
          python tool/signing_085.py
          python tool/updater_086.py
          python tool/fix_updater_086_compile.py
          python tool/prepare_android_startup_087.py
          python tool/android_startup_087.py
          python tool/android_fgs_088.py
          python tool/android_storage_startup_089.py
          python tool/install_update_090.py
          python tool/media_presence_091.py
          python tool/install_update_091.py
          python tool/fix_media_presence_091_compile.py
          python tool/finalize_brand_ring_actions_092.py
          python tool/finalize_reliability_profiles_093.py
          python tool/clipboard_images_094.py

      - name: Materialize mask icons and ringtone
        run: |
          python -m pip install --disable-pip-version-check pillow
          python tool/materialize_brand_assets_085.py

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze client
        run: flutter analyze --no-fatal-infos --no-fatal-warnings $UI_SOURCES

      - name: Verify 0.94 Android features
        run: |
          grep -q 'version: 0.94.0+94' pubspec.yaml
          grep -q 'pasteboard: ^0.5.0' pubspec.yaml
          grep -q 'desktop_drop: ^0.7.1' pubspec.yaml
          grep -q 'chernogram-android-0.94.apk' lib/client_settings.dart
          grep -q 'Pasteboard.image' lib/chat_screen.dart
          grep -q 'contextMenuBuilder: _composerContextMenu' lib/chat_screen.dart
          grep -q 'LogicalKeyboardKey.keyV' lib/chat_screen.dart
          grep -q 'class _CgInlineVideoPreview' lib/chat_media.dart
          grep -q 'class _CgInlineCircle' lib/chat_media.dart
          grep -q 'DropTarget(' lib/chat_screen.dart
          grep -q 'chernogram_messages_v3' lib/push_service.dart
          ! grep -q 'additionalFlags: Int32List.fromList' lib/push_service.dart
          grep -q "'action': 'file_request'" lib/internet_core.dart
          grep -q 'authorAvatarBase64' lib/chat_screen.dart
          test ! -e android/app/src/main/res/mipmap-anydpi/ic_launcher.xml
          test ! -e android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          grep -q 'chernogram_calls_v3' lib/background_runtime.dart
          grep -q 'additionalFlags: Int32List.fromList' lib/background_runtime.dart
          grep -q 'for (final tunnel in recent)' lib/background_runtime.dart
          ! grep -q 'recent.take(12)' lib/background_runtime.dart
          ! grep -q 'archiveTunnels(_chats)' lib/light/light_chat_app.dart
          grep -q "'sourcePath': source.path" lib/chat_media.dart
          grep -q 'messages.sort((left, right) => left.sentAt.compareTo(right.sentAt))' lib/chat_screen.dart
          grep -q 'source.inputStream().buffered()' android/app/src/main/kotlin/com/example/chernogram/MainActivity.kt

      - name: Build Android APK
        run: flutter build apk --release

      - name: Verify permanent Android signer
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n1)
          CERT_INFO=$("$APKSIGNER" verify --print-certs build/app/outputs/flutter-apk/app-release.apk)
          echo "$CERT_INFO"
          echo "$CERT_INFO" | grep -qi "$CG_CERT_SHA256"

      - name: Verify merged Android manifest
        run: |
          APKANALYZER=$(find "$ANDROID_HOME" -name apkanalyzer -type f | head -n1)
          "$APKANALYZER" manifest print build/app/outputs/flutter-apk/app-release.apk > /tmp/chernogram-manifest.xml
          grep -q 'FOREGROUND_SERVICE_REMOTE_MESSAGING' /tmp/chernogram-manifest.xml
          grep -q 'id.flutter.flutter_background_service.BackgroundService' /tmp/chernogram-manifest.xml
          grep -q 'android.permission.WAKE_LOCK' /tmp/chernogram-manifest.xml
          grep -Eqi 'foregroundServiceType="0x200"|remoteMessaging' /tmp/chernogram-manifest.xml

      - name: Prepare Android artifact
        run: cp build/app/outputs/flutter-apk/app-release.apk chernogram-android-0.94.apk

      - uses: actions/upload-artifact@v4
        with:
          name: chernogram-android-0.94
          path: chernogram-android-0.94.apk
          if-no-files-found: error

  windows:
    runs-on: windows-2025
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Apply proven transport, UI and 0.91 features
        shell: pwsh
        run: |
          python tool/apply_minimal_room_081.py
          python tool/fix_minimal_room_081.py
          python tool/fix_invite_host_082.py
          python tool/fix_stability_083.py
          python tool/ui_full_084.py
          python tool/fix_ui_084_compile.py
          python tool/ui_polish_085.py
          python tool/fix_ui_085_compile.py
          python tool/presence_notifications_085.py
          python tool/fix_windows_updater_085.py
          python tool/chat_files_notifications_085.py
          python tool/updater_086.py
          python tool/fix_updater_086_compile.py
          python tool/prepare_android_startup_087.py
          python tool/android_startup_087.py
          python tool/android_fgs_088.py
          python tool/android_storage_startup_089.py
          python tool/install_update_090.py
          python tool/media_presence_091.py
          python tool/install_update_091.py
          python tool/fix_media_presence_091_compile.py
          python tool/finalize_brand_ring_actions_092.py
          python tool/finalize_reliability_profiles_093.py
          python tool/clipboard_images_094.py

      - name: Materialize mask icons and ringtone
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check pillow
          python tool/materialize_brand_assets_085.py

      - name: Resolve dependencies
        run: flutter pub get

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Analyze client
        shell: pwsh
        run: flutter analyze --no-fatal-infos --no-fatal-warnings $env:UI_SOURCES.Split(' ')

      - name: Verify 0.94 Windows features
        shell: pwsh
        run: |
          if (!(Select-String -Path pubspec.yaml -Pattern 'version: 0.94.0+94' -SimpleMatch -Quiet)) { throw '0.94 version missing' }
          if (!(Select-String -Path pubspec.yaml -Pattern 'pasteboard: ^0.5.0' -SimpleMatch -Quiet)) { throw 'pasteboard plugin missing' }
          if (!(Select-String -Path pubspec.yaml -Pattern 'desktop_drop: ^0.7.1' -SimpleMatch -Quiet)) { throw 'desktop_drop missing' }
          if (!(Select-String -Path lib\chat_screen.dart -Pattern 'DropTarget(' -SimpleMatch -Quiet)) { throw 'drop target missing' }
          if (!(Select-String -Path lib\chat_media.dart -Pattern 'class _CgInlineVideoPreview' -SimpleMatch -Quiet)) { throw 'video preview missing' }
          if (!(Select-String -Path lib\client_settings.dart -Pattern 'chernogram-android-0.94.apk' -SimpleMatch -Quiet)) { throw '0.94 QR URL missing' }
          if (!(Select-String -Path lib\chat_screen.dart -Pattern 'Pasteboard.image' -SimpleMatch -Quiet)) { throw 'clipboard image paste missing' }
          if (!(Select-String -Path lib\chat_screen.dart -Pattern 'contextMenuBuilder: _composerContextMenu' -SimpleMatch -Quiet)) { throw 'composer context menu missing' }
          if (!(Select-String -Path lib\chat_screen.dart -Pattern 'LogicalKeyboardKey.keyV' -SimpleMatch -Quiet)) { throw 'Ctrl+V shortcut missing' }
          if (!(Select-String -Path lib\internet_core.dart -Pattern "'action': 'file_request'" -SimpleMatch -Quiet)) { throw 'file retry missing' }
          if (!(Select-String -Path lib\chat_screen.dart -Pattern 'authorAvatarBase64' -SimpleMatch -Quiet)) { throw 'message avatars missing' }
          if (!(Select-String -Path lib\chat_screen.dart -Pattern 'messages.sort((left, right) => left.sentAt.compareTo(right.sentAt))' -SimpleMatch -Quiet)) { throw 'chronological chat ordering missing' }

      - name: Build Windows client
        run: flutter build windows --release

      - name: Enable MSVC command line
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build native updater helper
        shell: pwsh
        run: |
          cl.exe /nologo /std:c++17 /EHsc windows\updater\chernogram_updater.cpp /Fe:build\windows\x64\runner\Release\chernogram_updater.exe
          if (!(Test-Path build\windows\x64\runner\Release\chernogram_updater.exe)) { throw 'chernogram_updater.exe was not built' }

      - name: Pack Windows client
        shell: pwsh
        run: |
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath chernogram-windows-0.94.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: chernogram-windows-0.94
          path: chernogram-windows-0.94.zip
          if-no-files-found: error

  release:
    needs: [android, windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: chernogram-android-0.94
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: chernogram-windows-0.94
          path: dist

      - name: Create online update manifest
        shell: bash
        run: |
          APK_SHA=$(sha256sum dist/chernogram-android-0.94.apk | cut -d ' ' -f 1)
          WIN_SHA=$(sha256sum dist/chernogram-windows-0.94.zip | cut -d ' ' -f 1)
          cat > dist/update.json <<EOF
          {
            "versionName": "0.94.0",
            "versionCode": 94,
            "apkUrl": "https://github.com/jeep-jim/chernogram_new/releases/download/latest-room-alpha/chernogram-android-0.94.apk",
            "windowsUrl": "https://github.com/jeep-jim/chernogram_new/releases/download/latest-room-alpha/chernogram-windows-0.94.zip",
            "sha256": "$APK_SHA",
            "windowsSha256": "$WIN_SHA",
            "notesRu": "Версия 0.94: вставка изображений из системного буфера через Ctrl+V на Windows и через пункт Вставить в контекстном меню поля сообщения на Windows и Android.",
            "notesEn": "Version 0.94: paste clipboard images with Ctrl+V on Windows or Paste in the message field context menu on Windows and Android."
          }
          EOF

      - name: Publish 0.94
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-room-alpha
          name: Chernogram Room Alpha 0.94
          prerelease: true
          make_latest: false
          overwrite_files: true
          body: |
            0.94 — вставка изображений из буфера обмена по Ctrl+V и через контекстное меню поля сообщения на Windows и Android.
          files: |
            dist/chernogram-android-0.94.apk
            dist/chernogram-windows-0.94.zip
            dist/update.json
