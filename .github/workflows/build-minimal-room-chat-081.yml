name: Chernogram UI Room 0.84

on:
  push:
    branches:
      - rebuild/minimal-room-chat-081
  workflow_dispatch:

permissions:
  contents: write

env:
  UI_SOURCES: lib/main.dart lib/light/light_chat_app.dart lib/light/light_theme.dart lib/core_models.dart lib/chat_media.dart lib/chat_screen.dart lib/call_service.dart lib/internet_core.dart lib/public_mqtt_transport.dart lib/update_service.dart lib/client_settings.dart lib/device_product_panels.dart lib/legacy_v16_features.dart lib/push_service.dart lib/app_monitor.dart

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Apply proven transport and UI 0.84
        run: |
          python tool/apply_minimal_room_081.py
          python tool/fix_minimal_room_081.py
          python tool/fix_invite_host_082.py
          python tool/fix_stability_083.py
          python tool/ui_full_084.py
          python tool/fix_ui_084_compile.py

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze UI client
        run: flutter analyze --no-fatal-infos --no-fatal-warnings $UI_SOURCES

      - name: Build Android APK
        run: flutter build apk --release --target-platform android-arm64

      - name: Prepare Android artifact
        run: cp build/app/outputs/flutter-apk/app-release.apk chernogram-room.apk

      - uses: actions/upload-artifact@v4
        with:
          name: chernogram-room-android-084
          path: chernogram-room.apk
          if-no-files-found: error

  windows:
    runs-on: windows-2025
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Apply proven transport and UI 0.84
        shell: pwsh
        run: |
          python tool/apply_minimal_room_081.py
          python tool/fix_minimal_room_081.py
          python tool/fix_invite_host_082.py
          python tool/fix_stability_083.py
          python tool/ui_full_084.py
          python tool/fix_ui_084_compile.py

      - name: Generate exact Chernogram desktop icon
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check pillow
          python tool/generate_windows_icon_084.py

      - name: Resolve dependencies
        run: flutter pub get

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Analyze UI client
        shell: pwsh
        run: flutter analyze --no-fatal-infos --no-fatal-warnings $env:UI_SOURCES.Split(' ')

      - name: Build Windows client
        run: flutter build windows --release

      - name: Pack Windows client
        shell: pwsh
        run: |
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath chernogram-room-windows.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: chernogram-room-windows-084
          path: chernogram-room-windows.zip
          if-no-files-found: error

  release:
    needs: [android, windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: chernogram-room-android-084
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: chernogram-room-windows-084
          path: dist

      - name: Create online update manifest
        shell: bash
        run: |
          APK_SHA=$(sha256sum dist/chernogram-room.apk | cut -d ' ' -f 1)
          WIN_SHA=$(sha256sum dist/chernogram-room-windows.zip | cut -d ' ' -f 1)
          cat > dist/update.json <<EOF
          {
            "versionName": "0.84.0",
            "versionCode": 84,
            "apkUrl": "https://github.com/jeep-jim/chernogram_new/releases/download/latest-room-alpha/chernogram-room.apk",
            "windowsUrl": "https://github.com/jeep-jim/chernogram_new/releases/download/latest-room-alpha/chernogram-room-windows.zip",
            "sha256": "$APK_SHA",
            "windowsSha256": "$WIN_SHA",
            "notesRu": "Интерфейсный релиз без изменения работающих маршрутов связи: нормальная навигация Windows и кнопка назад, отправка текста по Enter, файлы и медиа с локальным хранением и плеером, шкала памяти устройства, приватность и разрешения, QR установки спрятан в Поделиться, системные уведомления о сообщениях и звонках, фирменная иконка Чернограма на Windows.",
            "notesEn": "UI-only release preserving the working routes: proper Windows navigation/back button, Enter-to-send, local files/media and player, device storage meter, privacy and permissions, install QR moved into Share, system message/call notifications, and the real Chernogram Windows icon."
          }
          EOF

      - name: Publish online update 0.84
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-room-alpha
          name: Chernogram Room Alpha 0.84
          prerelease: true
          make_latest: false
          overwrite_files: true
          body: |
            0.84 меняет интерфейс и локальные возможности поверх работающего транспорта 0.83. Маршруты MQTT/WebRTC не менялись. Добавлены полноценная desktop-навигация, Enter для отправки, локальные медиа и плеер, память устройства, настройки приватности/разрешений, уведомления и правильная Windows-иконка. Обновление устанавливается из самого приложения.
          files: |
            dist/chernogram-room.apk
            dist/chernogram-room-windows.zip
            dist/update.json
