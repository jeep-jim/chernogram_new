name: Chernogram Stable Updater 0.86

on:
  push:
    branches:
      - rebuild/minimal-room-chat-081
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: chernogram-room-alpha-build
  cancel-in-progress: true

env:
  UI_SOURCES: lib/main.dart lib/light/light_chat_app.dart lib/light/light_invite_qr.dart lib/light/light_theme.dart lib/core_models.dart lib/chat_media.dart lib/chat_screen.dart lib/call_service.dart lib/internet_core.dart lib/public_mqtt_transport.dart lib/update_service.dart lib/client_settings.dart lib/device_product_panels.dart lib/legacy_v16_features.dart lib/push_service.dart lib/app_monitor.dart lib/background_runtime.dart lib/desktop_runtime.dart lib/ui_presence.dart lib/sound_service.dart
  CG_KEYSTORE_PATH: /home/runner/.chernogram-signing/release.jks
  CG_KEYSTORE_PASSWORD: CgRoomAlpha_85_Stable_9yW2pQ7m
  CG_KEY_ALIAS: chernogram
  CG_KEY_PASSWORD: CgRoomAlpha_85_Stable_9yW2pQ7m
  CG_CERT_SHA256: 764bb1b6135f9203d8eca41dc7fd84ec6cafdd7b4eb3ad6044765de899195749

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Restore permanent Chernogram signing key
        uses: actions/cache@v4
        with:
          path: ~/.chernogram-signing/release.jks
          key: chernogram-release-signing-v1
          fail-on-cache-miss: true

      - name: Apply proven transport, UI and updater 0.86
        run: |
          python tool/apply_minimal_room_081.py
          python tool/fix_minimal_room_081.py
          python tool/fix_invite_host_082.py
          python tool/fix_stability_083.py
          python tool/ui_full_084.py
          python tool/fix_ui_084_compile.py
          python tool/ui_polish_085.py
          python tool/fix_ui_085_compile.py
          python tool/presence_notifications_085.py
          python tool/fix_windows_updater_085.py
          python tool/chat_files_notifications_085.py
          python tool/signing_085.py
          python tool/updater_086.py
          python tool/fix_updater_086_compile.py

      - name: Materialize mask icons and ringtone
        run: |
          python -m pip install --disable-pip-version-check pillow
          python tool/materialize_brand_assets_085.py

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze client
        run: flutter analyze --no-fatal-infos --no-fatal-warnings $UI_SOURCES

      - name: Build Android APK
        run: flutter build apk --release

      - name: Verify permanent Android signer
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n1)
          CERT_INFO=$("$APKSIGNER" verify --print-certs build/app/outputs/flutter-apk/app-release.apk)
          echo "$CERT_INFO"
          echo "$CERT_INFO" | grep -qi "$CG_CERT_SHA256"

      - name: Prepare versioned Android artifact
        run: cp build/app/outputs/flutter-apk/app-release.apk chernogram-android-0.86.apk

      - uses: actions/upload-artifact@v4
        with:
          name: chernogram-android-0.86
          path: chernogram-android-0.86.apk
          if-no-files-found: error

  windows:
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Apply proven transport, UI and updater 0.86
        shell: pwsh
        run: |
          python tool/apply_minimal_room_081.py
          python tool/fix_minimal_room_081.py
          python tool/fix_invite_host_082.py
          python tool/fix_stability_083.py
          python tool/ui_full_084.py
          python tool/fix_ui_084_compile.py
          python tool/ui_polish_085.py
          python tool/fix_ui_085_compile.py
          python tool/presence_notifications_085.py
          python tool/fix_windows_updater_085.py
          python tool/chat_files_notifications_085.py
          python tool/updater_086.py
          python tool/fix_updater_086_compile.py

      - name: Materialize mask icons and ringtone
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check pillow
          python tool/materialize_brand_assets_085.py

      - name: Resolve dependencies
        run: flutter pub get

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Analyze client
        shell: pwsh
        run: flutter analyze --no-fatal-infos --no-fatal-warnings $env:UI_SOURCES.Split(' ')

      - name: Build Windows client
        run: flutter build windows --release

      - name: Enable MSVC command line
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build native updater helper
        shell: pwsh
        run: |
          cl.exe /nologo /std:c++17 /EHsc windows\updater\chernogram_updater.cpp /Fe:build\windows\x64\runner\Release\chernogram_updater.exe
          if (!(Test-Path build\windows\x64\runner\Release\chernogram_updater.exe)) { throw 'chernogram_updater.exe was not built' }

      - name: Pack versioned Windows client
        shell: pwsh
        run: |
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath chernogram-windows-0.86.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: chernogram-windows-0.86
          path: chernogram-windows-0.86.zip
          if-no-files-found: error

  release:
    needs: [android, windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: chernogram-android-0.86
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: chernogram-windows-0.86
          path: dist

      - name: Create exact-version update manifest
        shell: bash
        run: |
          APK_SHA=$(sha256sum dist/chernogram-android-0.86.apk | cut -d ' ' -f 1)
          WIN_SHA=$(sha256sum dist/chernogram-windows-0.86.zip | cut -d ' ' -f 1)
          cat > dist/update.json <<EOF
          {
            "versionName": "0.86.0",
            "versionCode": 86,
            "apkUrl": "https://github.com/jeep-jim/chernogram_new/releases/download/latest-room-alpha/chernogram-android-0.86.apk",
            "windowsUrl": "https://github.com/jeep-jim/chernogram_new/releases/download/latest-room-alpha/chernogram-windows-0.86.zip",
            "sha256": "$APK_SHA",
            "windowsSha256": "$WIN_SHA",
            "notesRu": "Стабилизация обновлений без изменения рабочих маршрутов связи. Android скачивает APK внутри Чернограма, проверяет SHA-256 и передаёт его системному установщику; подпись жёстко закреплена и сборка запрещена при потере ключа. Windows распаковывает пакет до закрытия приложения и применяет его отдельным нативным updater-helper с автоматическим перезапуском. Файлы релиза теперь всегда содержат номер версии.",
            "notesEn": "Updater stabilization without changing working communication routes. Android downloads and verifies the APK inside Chernogram and opens the system package installer with a pinned signing certificate. Windows stages the package before shutdown and applies it with a native updater helper, then restarts automatically. Release filenames always include the version."
          }
          EOF

      - name: Publish 0.86 with versioned filenames
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-room-alpha
          name: Chernogram Room Alpha 0.86
          prerelease: true
          make_latest: false
          overwrite_files: true
          body: |
            0.86 фиксирует механизм обновлений. MQTT/WebRTC маршруты не изменяются.
          files: |
            dist/chernogram-android-0.86.apk
            dist/chernogram-windows-0.86.zip
            dist/update.json
