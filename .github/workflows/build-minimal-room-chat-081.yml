name: Chernogram Android Recovery 0.89

on:
  push:
    branches:
      - rebuild/minimal-room-chat-081
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: chernogram-android-recovery-089
  cancel-in-progress: true

env:
  UI_SOURCES: lib/main.dart lib/light/light_chat_app.dart lib/light/light_invite_qr.dart lib/light/light_theme.dart lib/core_models.dart lib/chat_media.dart lib/chat_screen.dart lib/call_service.dart lib/internet_core.dart lib/public_mqtt_transport.dart lib/update_service.dart lib/client_settings.dart lib/device_product_panels.dart lib/legacy_v16_features.dart lib/push_service.dart lib/app_monitor.dart lib/background_runtime.dart lib/desktop_runtime.dart lib/ui_presence.dart lib/sound_service.dart
  CG_KEYSTORE_PATH: /home/runner/.chernogram-signing/release.jks
  CG_KEYSTORE_PASSWORD: CgRoomAlpha_85_Stable_9yW2pQ7m
  CG_KEY_ALIAS: chernogram
  CG_KEY_PASSWORD: CgRoomAlpha_85_Stable_9yW2pQ7m
  CG_CERT_SHA256: 764bb1b6135f9203d8eca41dc7fd84ec6cafdd7b4eb3ad6044765de899195749

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Restore permanent Chernogram signing key
        uses: actions/cache@v4
        with:
          path: ~/.chernogram-signing/release.jks
          key: chernogram-release-signing-v1
          fail-on-cache-miss: true

      - name: Apply proven transport, UI and Android recovery 0.89
        run: |
          python tool/apply_minimal_room_081.py
          python tool/fix_minimal_room_081.py
          python tool/fix_invite_host_082.py
          python tool/fix_stability_083.py
          python tool/ui_full_084.py
          python tool/fix_ui_084_compile.py
          python tool/ui_polish_085.py
          python tool/fix_ui_085_compile.py
          python tool/presence_notifications_085.py
          python tool/fix_windows_updater_085.py
          python tool/chat_files_notifications_085.py
          python tool/signing_085.py
          python tool/updater_086.py
          python tool/fix_updater_086_compile.py
          python tool/prepare_android_startup_087.py
          python tool/android_startup_087.py
          python tool/android_fgs_088.py
          python tool/android_storage_startup_089.py

      - name: Materialize mask icons and ringtone
        run: |
          python -m pip install --disable-pip-version-check pillow
          python tool/materialize_brand_assets_085.py

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze client
        run: flutter analyze --no-fatal-infos --no-fatal-warnings $UI_SOURCES

      - name: Verify startup and file-streaming guards in source
        run: |
          ! grep -q 'archiveTunnels(_chats)' lib/light/light_chat_app.dart
          ! grep -A12 -B4 "'saveToDownloads'" lib/chat_media.dart | grep -q 'readAsBytes'
          grep -q "'sourcePath': source.path" lib/chat_media.dart
          grep -q 'source.inputStream().buffered()' android/app/src/main/kotlin/com/example/chernogram/MainActivity.kt
          grep -q 'version: 0.89.0+89' pubspec.yaml

      - name: Build Android APK
        run: flutter build apk --release

      - name: Verify permanent Android signer
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n1)
          CERT_INFO=$("$APKSIGNER" verify --print-certs build/app/outputs/flutter-apk/app-release.apk)
          echo "$CERT_INFO"
          echo "$CERT_INFO" | grep -qi "$CG_CERT_SHA256"

      - name: Verify merged Android manifest
        run: |
          APKANALYZER=$(find "$ANDROID_HOME" -name apkanalyzer -type f | head -n1)
          "$APKANALYZER" manifest print build/app/outputs/flutter-apk/app-release.apk > /tmp/chernogram-manifest.xml
          grep -q 'FOREGROUND_SERVICE_REMOTE_MESSAGING' /tmp/chernogram-manifest.xml
          grep -q 'id.flutter.flutter_background_service.BackgroundService' /tmp/chernogram-manifest.xml
          grep -Eqi 'foregroundServiceType="0x200"|remoteMessaging' /tmp/chernogram-manifest.xml

      - name: Prepare versioned Android artifact
        run: cp build/app/outputs/flutter-apk/app-release.apk chernogram-android-0.89.apk

      - uses: actions/upload-artifact@v4
        with:
          name: chernogram-android-0.89
          path: chernogram-android-0.89.apk
          if-no-files-found: error

  release:
    needs: android
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: chernogram-android-0.89
          path: dist

      - name: Publish Android recovery 0.89 without replacing OTA manifest
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-room-alpha
          name: Chernogram Room Alpha 0.89 Android Recovery
          prerelease: true
          make_latest: false
          overwrite_files: true
          body: |
            Android recovery 0.89. Убран массовый экспорт всей истории файлов при старте; системное сохранение файлов теперь потоковое и не загружает весь файл в память. MQTT/WebRTC маршруты не изменены. update.json намеренно пока не заменяется, чтобы рабочий Windows 0.88 не получил ложное обновление.
          files: |
            dist/chernogram-android-0.89.apk
