name: Validate LiveKit Calls v1

on:
  push:
    branches:
      - feature/livekit-calls-v1
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cernogram-livekit-calls-v1
  cancel-in-progress: true

jobs:
  broker:
    if: github.actor != 'github-actions[bot]'
    name: Validate Python broker and Docker
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/livekit-calls-v1
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/livekit_broker/requirements.txt

      - name: Validate broker and Docker
        shell: bash
        run: |
          set -o pipefail
          (
            set -euo pipefail
            cd services/livekit_broker
            python -m pip install -r requirements.txt
            python -m compileall -q broker.py test_broker.py
            python -m unittest -v
            cd ../..
            docker compose --env-file .env.livekit.example -f docker-compose.livekit.yml config
            docker build -t cernogram-livekit-broker-ci services/livekit_broker
          ) 2>&1 | tee broker-ci.log

      - name: Upload broker diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: livekit-broker-ci-log
          path: broker-ci.log
          if-no-files-found: warn
          retention-days: 14

  android:
    if: github.actor != 'github-actions[bot]'
    name: Build Android LiveKit client
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/livekit-calls-v1
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: false

      - name: Validate Flutter and build Android
        shell: bash
        run: |
          set -o pipefail
          (
            set -euo pipefail
            python tooling/materialize_livekit_calls_v1.py
            flutter --version
            flutter pub get
            dart format lib/livekit_test_screen.dart lib/v12.dart
            flutter analyze --no-fatal-infos --no-fatal-warnings
            flutter test
            flutter build apk --debug
          ) 2>&1 | tee android-ci.log

      - name: Upload Android diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: livekit-android-ci-log
          path: android-ci.log
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Android test APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: cernogram-livekit-android-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14

  windows:
    if: github.actor != 'github-actions[bot]'
    name: Build Windows LiveKit client
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/livekit-calls-v1
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: false

      - name: Validate Flutter and build Windows
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $log = Join-Path $PWD 'windows-ci.log'

          function Invoke-Logged {
            param([scriptblock]$Command, [string]$Name)
            "===== $Name =====" | Tee-Object -FilePath $log -Append
            & $Command *>&1 | Tee-Object -FilePath $log -Append
            if ($LASTEXITCODE -ne 0) {
              throw "$Name failed with exit code $LASTEXITCODE"
            }
          }

          try {
            Invoke-Logged { python tooling/materialize_livekit_calls_v1.py } 'Materialize LiveKit source'
            Invoke-Logged { flutter --version } 'Flutter version'
            Invoke-Logged { flutter config --enable-windows-desktop } 'Enable Windows desktop'
            if (-not (Test-Path 'windows/CMakeLists.txt')) {
              Invoke-Logged { flutter create --platforms=windows --project-name chernogram --no-pub . } 'Create Windows runner'
            }

            $definition = 'add_compile_definitions(_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS)'
            $cmakePath = Join-Path $PWD 'windows/CMakeLists.txt'
            $cmakeLines = Get-Content $cmakePath
            if (-not ($cmakeLines -contains $definition)) {
              $patched = @($cmakeLines[0], '', $definition) + $cmakeLines[1..($cmakeLines.Length - 1)]
              Set-Content -Path $cmakePath -Value $patched -Encoding UTF8
            }
            $env:CL = "/D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS $env:CL"
            "Applied MSVC coroutine compatibility definition" | Tee-Object -FilePath $log -Append

            Invoke-Logged { flutter pub get } 'Flutter pub get'
            Invoke-Logged { dart format lib/livekit_test_screen.dart lib/v12.dart } 'Dart format'
            Invoke-Logged { flutter analyze --no-fatal-infos --no-fatal-warnings } 'Flutter analyze'
            Invoke-Logged { flutter test } 'Flutter test'
            Invoke-Logged { flutter build windows --debug } 'Build Windows debug'
          } catch {
            "ERROR: $($_.Exception.Message)" | Tee-Object -FilePath $log -Append
            throw
          }

      - name: Upload Windows diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: livekit-windows-ci-log
          path: windows-ci.log
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Windows test build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: cernogram-livekit-windows-debug
          path: build/windows/x64/runner/Debug
          retention-days: 14

  finalize:
    if: always() && github.actor != 'github-actions[bot]'
    name: Save LiveKit CI result
    needs:
      - broker
      - android
      - windows
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/livekit-calls-v1
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: livekit-*-ci-log
          path: ci-logs
          merge-multiple: true

      - uses: actions/setup-python@v5
        if: needs.broker.result == 'success' && needs.android.result == 'success' && needs.windows.result == 'success'
        with:
          python-version: '3.12'

      - uses: subosito/flutter-action@v2
        if: needs.broker.result == 'success' && needs.android.result == 'success' && needs.windows.result == 'success'
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: false

      - name: Prepare result files
        shell: bash
        env:
          BROKER_RESULT: ${{ needs.broker.result }}
          ANDROID_RESULT: ${{ needs.android.result }}
          WINDOWS_RESULT: ${{ needs.windows.result }}
        run: |
          set -euo pipefail
          SUCCESS=false
          if [ "$BROKER_RESULT" = success ] && [ "$ANDROID_RESULT" = success ] && [ "$WINDOWS_RESULT" = success ]; then
            SUCCESS=true
          fi

          if [ "$SUCCESS" = true ]; then
            python tooling/materialize_livekit_calls_v1.py
            flutter pub get
            dart format lib/livekit_test_screen.dart lib/v12.dart
            cat > LIVEKIT_CI_STATUS.md <<EOF
          LiveKit Calls v1 ready
          Commit: ${GITHUB_SHA}
          Time: $(date -u +'%Y-%m-%dT%H:%M:%SZ')
          Version: 0.21.0+51
          Broker: ${BROKER_RESULT}
          Android: ${ANDROID_RESULT}
          Windows: ${WINDOWS_RESULT}
          Media: LiveKit room with microphone, camera and immediate hang-up
          Infrastructure: Python token broker, LiveKit Server, Redis and Docker Compose
          EOF
            rm -f LIVEKIT_CI_ERROR.md
          else
            {
              echo '# LiveKit Calls v1 CI failed'
              echo
              echo "Commit: ${GITHUB_SHA}"
              echo "Time: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
              echo "Broker: ${BROKER_RESULT}"
              echo "Android: ${ANDROID_RESULT}"
              echo "Windows: ${WINDOWS_RESULT}"
              echo
              for file in ci-logs/*.log; do
                [ -f "$file" ] || continue
                echo "## $(basename "$file")"
                echo '```text'
                tail -n 350 "$file"
                echo '```'
                echo
              done
            } > LIVEKIT_CI_ERROR.md
            rm -f LIVEKIT_CI_STATUS.md
          fi

      - name: Commit result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -rf ci-logs
          git add -A
          git commit -m "Сохранить результат LiveKit CI Android и Windows [skip ci]" || true
          git push origin HEAD:feature/livekit-calls-v1
