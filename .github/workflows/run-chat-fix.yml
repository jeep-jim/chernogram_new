name: Run chat fix

# Second commit intentionally starts the registered workflow.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/run-chat-fix.yml'

permissions:
  contents: write

jobs:
  run-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Extract and apply prepared patch
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          lines = Path('.github/workflows/apply-chat-qr-performance-fix.yml').read_text(encoding='utf-8').splitlines()
          start = next(i for i, line in enumerate(lines) if line.strip() == "python3 <<'PY'") + 1
          end = next(i for i in range(start, len(lines)) if lines[i] == '          PY')
          script = '\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in lines[start:end]
          ) + '\n'
          Path('/tmp/apply_chat_fix.py').write_text(script, encoding='utf-8')
          PY
          python3 /tmp/apply_chat_fix.py

      - name: Resolve dependencies and validate
        shell: bash
        run: |
          flutter pub get
          dart format lib/v07.dart lib/chat_screen.dart lib/internet_core.dart lib/core_models.dart lib/qr_image_decoder.dart
          flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Commit fixes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pubspec.yaml pubspec.lock lib/v07.dart lib/chat_screen.dart lib/internet_core.dart lib/core_models.dart lib/qr_image_decoder.dart
          git commit -m 'Исправить QR из файла, кнопку назад и мгновенное открытие чатов'
          git push origin HEAD:main
