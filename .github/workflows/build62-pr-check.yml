name: Чернограм build 62 — точная PR-проверка

on:
  pull_request:
    branches: [fix/current-ui-working-core-061]
    paths:
      - lib/**
      - android/**
      - pubspec.yaml
      - .github/workflows/build62-pr-check.yml

permissions:
  contents: read

env:
  VERSION_NAME: 0.24.2
  VERSION_CODE: 62
  CERT_SHA256: "F4:A2:C8:36:A8:36:71:19:78:10:FA:6E:98:2D:77:F4:C7:31:D0:9B:18:95:15:C0:13:D0:2D:0D:94:2D:9B:BE"

jobs:
  verify:
    name: Интерфейс, иконка, анализ, тесты и подписанный APK
    runs-on: ubuntu-22.04
    timeout-minutes: 80

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          channel: stable
          cache: true

      - uses: actions/cache/restore@v4
        with:
          path: ~/.android/debug.keystore
          key: chernogram-stable-signing-v2
          fail-on-cache-miss: false

      - name: Подключить функции и точную launcher-иконку
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          ui_path = Path('lib/android_data_first.dart')
          text = ui_path.read_text(encoding='utf-8')

          import_anchor = "import 'core_models.dart';\n"
          if "import 'device_product_panels.dart';" not in text:
              if import_anchor not in text:
                  raise RuntimeError('Не найден импорт core_models.dart')
              text = text.replace(
                  import_anchor,
                  import_anchor + "import 'device_product_panels.dart';\n",
                  1,
              )

          files_start = text.index('class _FilesPageState extends State<_FilesPage> {')
          files_end = text.index('class _MusicEntry', files_start)
          files_block = text[files_start:files_end]
          if 'CgDeviceStorageCard(ru: widget.ru)' not in files_block:
              anchor = (
                  "        Padding(\n"
                  "          padding: const EdgeInsets.symmetric(horizontal: 14),\n"
                  "          child: Row(\n"
              )
              if anchor not in files_block:
                  raise RuntimeError('Не найдена строка фильтров раздела Файлы')
              card = (
                  "        Padding(\n"
                  "          padding: const EdgeInsets.fromLTRB(14, 0, 14, 9),\n"
                  "          child: CgDeviceStorageCard(ru: widget.ru),\n"
                  "        ),\n"
              )
              files_block = files_block.replace(anchor, card + anchor, 1)
              text = text[:files_start] + files_block + text[files_end:]

          profile_start = text.index('class _ProfilePage extends StatelessWidget {')
          profile_end = text.index('class _ProfileAction', profile_start)
          profile_block = text[profile_start:profile_end]
          if "title: ru ? 'Версия и поделиться'" not in profile_block:
              anchor = (
                  "      _ProfileAction(\n"
                  "        icon: Icons.system_update_alt_rounded,\n"
                  "        title: ru ? 'Проверить обновления' : 'Check updates',\n"
              )
              if anchor not in profile_block:
                  raise RuntimeError('Не найден пункт Проверить обновления')
              action = (
                  "      _ProfileAction(\n"
                  "        icon: Icons.qr_code_2_rounded,\n"
                  "        title: ru ? 'Версия и поделиться' : 'Version and share',\n"
                  "        subtitle: ru\n"
                  "            ? 'Номер версии, ссылка установки и QR-код.'\n"
                  "            : 'Product version, installation link, and QR code.',\n"
                  "        onTap: () => showChernogramProductInfo(context, ru: ru),\n"
                  "      ),\n"
                  "      const SizedBox(height: 8),\n"
              )
              profile_block = profile_block.replace(anchor, action + anchor, 1)
              text = text[:profile_start] + profile_block + text[profile_end:]

          ui_path.write_text(text, encoding='utf-8')

          panel_path = Path('lib/device_product_panels.dart')
          panel = panel_path.read_text(encoding='utf-8')
          panel = panel.replace(
              "https://githubraw.com/jeep-jim/chernogram_new/main/docs/index.html",
              "https://github.com/jeep-jim/chernogram_new/releases/download/chernogram-0.24.2-build62/chernogram.apk?v=62",
          )
          panel_path.write_text(panel, encoding='utf-8')

          pubspec = Path('pubspec.yaml')
          pub = pubspec.read_text(encoding='utf-8')
          pub, count = re.subn(
              r'(?m)^version:\s*[^\n]+$',
              'version: 0.24.2+62',
              pub,
              count=1,
          )
          if count != 1:
              raise RuntimeError('Не найдена версия в pubspec.yaml')
          pubspec.write_text(pub, encoding='utf-8')

          icon = '''<vector xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:aapt="http://schemas.android.com/aapt"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="1080"
              android:viewportHeight="1080">
              <path
                  android:fillColor="#070A12"
                  android:pathData="M180,70 H900 A110,110 0,0 1,1010 180 V900 A110,110 0,0 1,900 1010 H180 A110,110 0,0 1,70 900 V180 A110,110 0,0 1,180 70 Z" />
              <path
                  android:fillColor="@android:color/transparent"
                  android:strokeWidth="22.8571"
                  android:strokeLineCap="round"
                  android:pathData="M151.20,248.40 L151.20,480.60 M206.74,181.65 L206.74,686.26 M262.29,157.70 L262.29,399.60 M262.29,480.60 L262.29,763.50 M317.83,142.04 L317.83,399.60 M317.83,480.60 L317.83,815.87 M373.37,131.31 L373.37,399.60 M373.37,480.60 L373.37,853.48 M428.91,124.20 L428.91,399.60 M428.91,480.60 L428.91,880.19 M484.46,120.13 L484.46,897.81 M540.00,118.80 L540.00,907.20 M595.54,120.13 L595.54,897.81 M651.09,124.20 L651.09,399.60 M651.09,480.60 L651.09,880.19 M706.63,131.31 L706.63,399.60 M706.63,480.60 L706.63,853.48 M762.17,142.04 L762.17,399.60 M762.17,480.60 L762.17,815.87 M817.71,157.70 L817.71,399.60 M817.71,480.60 L817.71,763.50 M873.26,181.65 L873.26,686.26 M928.80,248.40 L928.80,480.60">
                  <aapt:attr name="android:strokeColor">
                      <gradient
                          android:type="linear"
                          android:startX="540"
                          android:startY="118.8"
                          android:endX="540"
                          android:endY="907.2">
                          <item android:offset="0" android:color="#B9A8FF" />
                          <item android:offset="0.52" android:color="#7B5CFF" />
                          <item android:offset="1" android:color="#20C7FF" />
                      </gradient>
                  </aapt:attr>
              </path>
          </vector>
          '''
          Path(
              'android/app/src/main/res/drawable/chernogram_launcher_icon.xml'
          ).write_text(icon, encoding='utf-8')
          PY

          dart format lib/android_data_first.dart lib/device_product_panels.dart
          grep -q "CgDeviceStorageCard(ru: widget.ru)" lib/android_data_first.dart
          grep -q "Версия и поделиться" lib/android_data_first.dart
          grep -q "version: 0.24.2+62" pubspec.yaml
          grep -q "M151.20,248.40" android/app/src/main/res/drawable/chernogram_launcher_icon.xml
          grep -q 'android:icon="@drawable/chernogram_launcher_icon"' android/app/src/main/AndroidManifest.xml
          grep -q 'android:roundIcon="@drawable/chernogram_launcher_icon"' android/app/src/main/AndroidManifest.xml

      - name: Flutter pub get
        run: flutter pub get

      - name: Flutter analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Flutter tests
        run: flutter test

      - name: Android release compile
        run: flutter build apk --release

      - name: Восстановить прежнюю подпись
        shell: bash
        env:
          CHERNOGRAM_KEYSTORE_B64: ${{ secrets.CHERNOGRAM_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          if [ -n "${CHERNOGRAM_KEYSTORE_B64:-}" ]; then
            printf '%s' "$CHERNOGRAM_KEYSTORE_B64" | base64 --decode > "$HOME/.android/debug.keystore"
            chmod 600 "$HOME/.android/debug.keystore"
          fi
          test -s "$HOME/.android/debug.keystore"
          keytool -list -v \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android > certificate.txt
          ACTUAL=$(grep -m1 'SHA256:' certificate.txt | sed 's/.*SHA256: //' | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')
          EXPECTED=$(printf '%s' "$CERT_SHA256" | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')
          test "$ACTUAL" = "$EXPECTED"

      - name: Подписать и проверить APK
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_APK=build/app/outputs/flutter-apk/app-release.apk
          test -s "$SOURCE_APK"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)
          "$APKSIGNER" sign \
            --ks "$HOME/.android/debug.keystore" \
            --ks-key-alias androiddebugkey \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out chernogram.apk \
            "$SOURCE_APK"
          "$APKSIGNER" verify --print-certs chernogram.apk | tee apk-signature.txt
          "$AAPT" dump badging chernogram.apk | tee apk-badging.txt
          grep -q "versionCode='$VERSION_CODE'" apk-badging.txt
          grep -q "versionName='$VERSION_NAME'" apk-badging.txt
          sha256sum chernogram.apk | tee apk-sha256.txt

      - name: Сохранить подписанный APK и журналы
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build62-signed-icon-check
          path: |
            chernogram.apk
            apk-signature.txt
            apk-badging.txt
            apk-sha256.txt
          if-no-files-found: warn
          retention-days: 3
