name: Контроль Чернограм build 76

on:
  pull_request:
    paths:
      - .github/workflows/control-ui-076.yml

permissions:
  contents: read
  actions: read

jobs:
  status:
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    steps:
      - name: Найти и дождаться публикации build 76
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RUN_ID=0
          for attempt in $(seq 1 90); do
            RUN_ID=$(gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow publish-076-install-qr-ui.yml \
              --limit 1 \
              --json databaseId \
              --jq '.[0].databaseId // 0')
            if [ "$RUN_ID" != "0" ]; then break; fi
            sleep 2
          done
          test "$RUN_ID" != "0"
          echo "UI_RUN_ID=$RUN_ID"
          gh run watch "$RUN_ID" --repo "$GITHUB_REPOSITORY" --exit-status
          gh run view "$RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --json databaseId,status,conclusion,url,jobs \
            | tee ui-status76.json

      - name: Сохранить статус
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chernogram-ui-status-76
          if-no-files-found: warn
          retention-days: 7
          path: ui-status76.json
