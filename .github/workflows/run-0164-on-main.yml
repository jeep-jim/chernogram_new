name: Run 0.16.4 patch on main

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Execute prepared patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/apply-0164-feedback.yml').read_text(encoding='utf-8')
          start_marker = "          python3 - <<'PY'\n"
          end_marker = "\n          PY"
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index(end_marker, start)
          block = workflow[start:end]
          script = '\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in block.splitlines()
          )
          exec(compile(script, 'apply_0164.py', 'exec'), {})
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-0164-feedback.yml
          git rm .github/workflows/run-0164-on-pr.yml
          git rm .github/workflows/run-0164-on-main.yml
          git rm TRIGGER_0164.txt
          if [ -f TRIGGER_MAIN_0164.txt ]; then git rm TRIGGER_MAIN_0164.txt; fi
          git add -A
          git commit -m "Исправить отбой, онлайн и установку 0.16.4"
          git push origin HEAD:main
