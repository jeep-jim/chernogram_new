name: Windows Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: chernogram-windows-release
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 70

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter 3.44.8
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.8"
          channel: stable
          cache: false

      - name: Build Windows application
        shell: pwsh
        run: ./tooling/build_windows.ps1

      - name: Package portable application
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $log = 'windows-package.txt'
          Set-Content -Path $log -Value '===== WINDOWS PORTABLE PACKAGE =====' -Encoding UTF8
          try {
            $versionFull = ((Select-String -Path pubspec.yaml -Pattern '^version:').Line -split '\s+')[1]
            $versionName = ($versionFull -split '\+')[0]
            $release = 'build/windows/x64/runner/Release'
            $exe = Join-Path $release 'chernogram.exe'
            if (-not (Test-Path $exe)) {
              throw 'chernogram.exe was not produced'
            }

            foreach ($dll in @('msvcp140.dll', 'vcruntime140.dll', 'vcruntime140_1.dll')) {
              $source = Join-Path $env:WINDIR "System32/$dll"
              if (Test-Path $source) {
                Copy-Item $source $release -Force
                Add-Content $log "Bundled $dll"
              }
            }

            $readme = @(
              'ЧЕРНОГРАМ ДЛЯ WINDOWS',
              '',
              "Версия: $versionFull",
              'Поддержка: Windows 10 и Windows 11, 64-бит.',
              '',
              '1. Распакуйте ZIP целиком в отдельную папку.',
              '2. Запустите chernogram.exe.',
              '3. Не переносите EXE отдельно от папки data и DLL-файлов.',
              '',
              'При предупреждении SmartScreen нажмите «Подробнее» → «Выполнить в любом случае».',
              'Приложение пока не подписано платным сертификатом Windows.'
            )
            Set-Content -Path "$release/README-RU.txt" -Value $readme -Encoding UTF8

            $zip = 'chernogram-windows-portable.zip'
            if (Test-Path $zip) { Remove-Item $zip -Force }
            Compress-Archive -Path "$release/*" -DestinationPath $zip -CompressionLevel Optimal
            if (-not (Test-Path $zip)) { throw 'Portable ZIP was not created' }

            $portableHash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
            $manifest = @{
              versionName = $versionName
              versionFull = $versionFull
              architecture = 'x64'
              minimumWindows = '10'
              portableUrl = 'https://github.com/jeep-jim/chernogram_new/releases/download/latest-windows/chernogram-windows-portable.zip'
              portableSha256 = $portableHash
              packageType = 'portable-zip'
            } | ConvertTo-Json
            Set-Content -Path 'windows-update.json' -Value $manifest -Encoding UTF8
            Add-Content $log "Created $zip"
            Add-Content $log "SHA256: $portableHash"
          }
          catch {
            $message = "PACKAGE ERROR: $($_.Exception.Message)"
            Write-Host $message -ForegroundColor Red
            Add-Content $log $message
            exit 1
          }

      - name: Publish Windows release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $versionFull = ((Select-String -Path pubspec.yaml -Pattern '^version:').Line -split '\s+')[1]
          $versionName = ($versionFull -split '\+')[0]
          gh release delete latest-windows --cleanup-tag --yes 2>$null
          gh release create latest-windows `
            'chernogram-windows-portable.zip' `
            'windows-update.json' `
            --target main `
            --title "Чернограм Windows $versionName" `
            --notes "Чернограм для Windows 10/11 x64. Распакуйте ZIP целиком и запустите chernogram.exe. Портативная версия не требует установки и прав администратора." `
            --prerelease 2>&1 | Tee-Object -FilePath 'windows-release.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Save failure diagnostics
        if: failure()
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          foreach ($name in @('windows-build.txt', 'windows-package.txt', 'windows-release.txt')) {
            Copy-Item $name "$env:TEMP/$name" -ErrorAction SilentlyContinue
          }
          git fetch origin main
          git reset --hard origin/main
          $lines = @(
            'Windows build failed',
            "Commit: $env:GITHUB_SHA",
            "Time: $([DateTime]::UtcNow.ToString('yyyy-MM-ddTHH:mm:ssZ'))"
          )
          foreach ($name in @('windows-build.txt', 'windows-package.txt', 'windows-release.txt')) {
            $temp = "$env:TEMP/$name"
            if (Test-Path $temp) {
              $lines += "===== $name ====="
              $lines += Get-Content $temp
            }
          }
          Set-Content 'WINDOWS_CI_ERROR.txt' -Value $lines -Encoding UTF8
          git add -f WINDOWS_CI_ERROR.txt
          git commit -m "Сохранить подробную ошибку Windows сборки [skip ci]" 2>$null
          git push origin HEAD:main

      - name: Mark Windows ready
        if: success()
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          $versionFull = ((Select-String -Path pubspec.yaml -Pattern '^version:').Line -split '\s+')[1]
          git fetch origin main
          git reset --hard origin/main
          @(
            'Windows ready',
            "Commit: $env:GITHUB_SHA",
            "Time: $([DateTime]::UtcNow.ToString('yyyy-MM-ddTHH:mm:ssZ'))",
            "Version: $versionFull",
            'Architecture: x64',
            'Supported: Windows 10 and Windows 11',
            'Package: portable ZIP, no administrator rights required',
            'Download: https://github.com/jeep-jim/chernogram_new/releases/download/latest-windows/chernogram-windows-portable.zip'
          ) | Set-Content 'WINDOWS_BUILD_STATUS.md' -Encoding UTF8
          git add WINDOWS_BUILD_STATUS.md
          if (git ls-files --error-unmatch WINDOWS_CI_ERROR.txt 2>$null) { git rm -f WINDOWS_CI_ERROR.txt }
          git commit -m "Windows версия Чернограма готова [skip ci]" 2>$null
          git push origin HEAD:main
