name: Windows Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: chernogram-windows-release
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 80

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter 3.44.8
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.8"
          channel: stable
          cache: false

      - name: Build Windows application
        shell: pwsh
        run: ./tooling/build_windows.ps1

      - name: Package portable application and repair installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $log = 'windows-package.txt'
          Set-Content -Path $log -Value '===== WINDOWS PACKAGE AND REPAIR INSTALLER =====' -Encoding UTF8
          try {
            $versionFull = ((Select-String -Path pubspec.yaml -Pattern '^version:').Line -split '\s+')[1]
            $versionName = ($versionFull -split '\+')[0]
            $release = 'build/windows/x64/runner/Release'
            $appExe = Join-Path $release 'chernogram.exe'
            if (-not (Test-Path $appExe)) {
              throw 'chernogram.exe was not produced'
            }

            foreach ($dll in @('msvcp140.dll', 'vcruntime140.dll', 'vcruntime140_1.dll')) {
              $source = Join-Path $env:WINDIR "System32/$dll"
              if (Test-Path $source) {
                Copy-Item $source $release -Force
                Add-Content $log "Bundled $dll into app"
              }
            }

            $package = 'windows-package'
            if (Test-Path $package) { Remove-Item $package -Recurse -Force }
            New-Item -ItemType Directory -Path "$package/app" -Force | Out-Null
            Copy-Item "$release/*" "$package/app" -Recurse -Force

            $bootstrap = Join-Path $package 'chernogram.exe'
            $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
            if (-not (Test-Path $vswhere)) { throw 'vswhere.exe was not found' }
            $vsPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
            if (-not $vsPath) { throw 'Visual Studio C++ tools were not found' }
            $vcvars = Join-Path $vsPath 'VC/Auxiliary/Build/vcvars64.bat'
            if (-not (Test-Path $vcvars)) { throw 'vcvars64.bat was not found' }
            $compile = "call `"$vcvars`" && cl.exe /nologo /O2 /MT /EHsc /DUNICODE /D_UNICODE tooling\windows_bootstrap.cpp shell32.lib /link /SUBSYSTEM:WINDOWS /OUT:`"$bootstrap`""
            cmd.exe /D /S /C $compile 2>&1 | Tee-Object -FilePath $log -Append
            if ($LASTEXITCODE -ne 0) { throw "Bootstrap compilation failed: $LASTEXITCODE" }
            if (-not (Test-Path $bootstrap)) { throw 'Windows bootstrap was not created' }

            foreach ($dll in @('msvcp140.dll', 'vcruntime140.dll', 'vcruntime140_1.dll')) {
              $source = Join-Path $release $dll
              if (Test-Path $source) {
                Copy-Item $source $package -Force
                Add-Content $log "Bundled $dll beside bootstrap"
              }
            }

            $readme = @(
              'ЧЕРНОГРАМ ДЛЯ WINDOWS',
              '',
              "Версия: $versionFull",
              'Поддержка: Windows 10 и Windows 11, 64-бит.',
              '',
              'Запускайте chernogram.exe из корня распакованной папки.',
              'Папка app содержит основные файлы программы и не должна удаляться.',
              '',
              'Если старая переносимая версия закрывается при обновлении и остаётся прежней,',
              'один раз запустите Chernogram-Windows-Setup.exe из релиза. После установки',
              'используйте созданный ярлык «Чернограм» — следующие обновления будут ставиться в установленную папку.'
            )
            Set-Content -Path "$package/README-RU.txt" -Value $readme -Encoding UTF8

            $zip = 'chernogram-windows-portable.zip'
            if (Test-Path $zip) { Remove-Item $zip -Force }
            Compress-Archive -Path "$package/*" -DestinationPath $zip -CompressionLevel Optimal
            if (-not (Test-Path $zip)) { throw 'Portable ZIP was not created' }

            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw "Inno Setup installation failed: $LASTEXITCODE" }

            $iss = @"
          #define MyAppName "Чернограм"
          #define MyAppVersion "$versionName"
          #define MyAppPublisher "Chernogram"
          #define MyAppExeName "chernogram.exe"

          [Setup]
          AppId={{B6C33A77-38D4-4CA0-BE3A-B0C431E40F16}
          AppName={#MyAppName}
          AppVersion={#MyAppVersion}
          AppPublisher={#MyAppPublisher}
          DefaultDirName={localappdata}\Programs\Chernogram
          DefaultGroupName=Чернограм
          DisableProgramGroupPage=yes
          DisableDirPage=yes
          OutputDir=.
          OutputBaseFilename=Chernogram-Windows-Setup
          Compression=lzma2
          SolidCompression=yes
          WizardStyle=modern
          PrivilegesRequired=lowest
          ArchitecturesAllowed=x64compatible
          ArchitecturesInstallIn64BitMode=x64compatible
          MinVersion=10.0
          SetupIconFile=windows\runner\resources\app_icon.ico
          UninstallDisplayIcon={app}\{#MyAppExeName}
          CloseApplications=yes
          RestartApplications=no

          [Languages]
          Name: "russian"; MessagesFile: "compiler:Languages\Russian.isl"
          Name: "english"; MessagesFile: "compiler:Default.isl"

          [Files]
          Source: "$package\*"; DestDir: "{app}"; Flags: ignoreversion recursesubdirs createallsubdirs

          [Icons]
          Name: "{group}\Чернограм"; Filename: "{app}\{#MyAppExeName}"; WorkingDir: "{app}"
          Name: "{autodesktop}\Чернограм"; Filename: "{app}\{#MyAppExeName}"; WorkingDir: "{app}"

          [Run]
          Filename: "{app}\{#MyAppExeName}"; WorkingDir: "{app}"; Description: "Запустить Чернограм"; Flags: nowait runascurrentuser
          "@
            Set-Content 'chernogram-windows.iss' -Value $iss -Encoding UTF8
            & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' 'chernogram-windows.iss' 2>&1 | Tee-Object -FilePath $log -Append
            if ($LASTEXITCODE -ne 0) { throw "ISCC failed: $LASTEXITCODE" }
            if (-not (Test-Path 'Chernogram-Windows-Setup.exe')) { throw 'Setup EXE was not created' }

            $portableHash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
            $installerHash = (Get-FileHash 'Chernogram-Windows-Setup.exe' -Algorithm SHA256).Hash.ToLower()
            $manifest = @{
              versionName = $versionName
              versionFull = $versionFull
              architecture = 'x64'
              minimumWindows = '10'
              portableUrl = 'https://github.com/jeep-jim/chernogram_new/releases/download/latest-windows/chernogram-windows-portable.zip'
              portableSha256 = $portableHash
              installerUrl = 'https://github.com/jeep-jim/chernogram_new/releases/download/latest-windows/Chernogram-Windows-Setup.exe'
              installerSha256 = $installerHash
              packageType = 'portable-zip-bootstrap-v3-with-repair-installer'
            } | ConvertTo-Json
            Set-Content -Path 'windows-update.json' -Value $manifest -Encoding UTF8
            Add-Content $log "Created $zip"
            Add-Content $log "Portable SHA256: $portableHash"
            Add-Content $log "Installer SHA256: $installerHash"
          }
          catch {
            $message = "PACKAGE ERROR: $($_.Exception.Message)"
            Write-Host $message -ForegroundColor Red
            Add-Content $log $message
            exit 1
          }

      - name: Publish Windows release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $versionFull = ((Select-String -Path pubspec.yaml -Pattern '^version:').Line -split '\s+')[1]
          $versionName = ($versionFull -split '\+')[0]
          gh release delete latest-windows --cleanup-tag --yes 2>$null
          gh release create latest-windows `
            'Chernogram-Windows-Setup.exe' `
            'chernogram-windows-portable.zip' `
            'windows-update.json' `
            --target main `
            --title "Чернограм Windows $versionName" `
            --notes "Исправление только для Windows. Добавлен обычный установщик Chernogram-Windows-Setup.exe для перехода со старой переносимой версии, которая закрывается, но не заменяет файлы. Установщик создаёт новый рабочий ярлык и запускает актуальную версию." `
            --prerelease 2>&1 | Tee-Object -FilePath 'windows-release.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Save failure diagnostics
        if: failure()
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          foreach ($name in @('windows-build.txt', 'windows-package.txt', 'windows-release.txt')) {
            Copy-Item $name "$env:TEMP/$name" -ErrorAction SilentlyContinue
          }
          git fetch origin main
          git reset --hard origin/main
          $lines = @(
            'Windows build failed',
            "Commit: $env:GITHUB_SHA",
            "Time: $([DateTime]::UtcNow.ToString('yyyy-MM-ddTHH:mm:ssZ'))"
          )
          foreach ($name in @('windows-build.txt', 'windows-package.txt', 'windows-release.txt')) {
            $temp = "$env:TEMP/$name"
            if (Test-Path $temp) {
              $lines += "===== $name ====="
              $lines += Get-Content $temp
            }
          }
          Set-Content 'WINDOWS_CI_ERROR.txt' -Value $lines -Encoding UTF8
          git add -f WINDOWS_CI_ERROR.txt
          git commit -m "Сохранить подробную ошибку Windows сборки [skip ci]" 2>$null
          git push origin HEAD:main

      - name: Mark Windows ready
        if: success()
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          $versionFull = ((Select-String -Path pubspec.yaml -Pattern '^version:').Line -split '\s+')[1]
          git fetch origin main
          git reset --hard origin/main
          @(
            'Windows ready',
            "Commit: $env:GITHUB_SHA",
            "Time: $([DateTime]::UtcNow.ToString('yyyy-MM-ddTHH:mm:ssZ'))",
            "Version: $versionFull",
            'Architecture: x64',
            'Supported: Windows 10 and Windows 11',
            'Package: portable ZIP plus repair installer',
            'Installer: https://github.com/jeep-jim/chernogram_new/releases/download/latest-windows/Chernogram-Windows-Setup.exe',
            'Portable: https://github.com/jeep-jim/chernogram_new/releases/download/latest-windows/chernogram-windows-portable.zip'
          ) | Set-Content 'WINDOWS_BUILD_STATUS.md' -Encoding UTF8
          git add WINDOWS_BUILD_STATUS.md
          if (git ls-files --error-unmatch WINDOWS_CI_ERROR.txt 2>$null) { git rm -f WINDOWS_CI_ERROR.txt }
          git commit -m "Windows версия Чернограма готова [skip ci]" 2>$null
          git push origin HEAD:main
