name: Decode v0167 brand patch

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  decode:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decode current brand patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, zlib
          parts = (
              'v0167_c01.txt',
              'v0167_c02.txt',
              'v0167_c03.txt',
              'v0167_c04_05.txt',
              'v0167_c06_07.txt',
              'v0167_c08_09.txt',
              'v0167_c10_11.txt',
              'v0167_c12_13.txt',
              'v0167_c14.txt',
          )
          payload = ''.join(Path('tooling', p).read_text().strip() for p in parts)
          source = zlib.decompress(base64.b64decode(payload)).decode('utf-8')
          Path('tooling/v0167_decoded.py').write_text(source, encoding='utf-8')
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/decode-v0167-brand.yml
          git add tooling/v0167_decoded.py
          git commit -m "Раскрыть код бренда 0.16.7 [skip ci]"
          git push
