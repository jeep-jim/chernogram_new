name: Build Chernogram 0.24 on second-day transport

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/second-day-transport-024-build.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cernogram-second-day-transport-024
  cancel-in-progress: true

env:
  SOURCE_BRANCH: fix/second-day-core-024
  EXPECTED_VERSION: 0.24.0+56
  EXPECTED_CERT_SHA256: "F4:A2:C8:36:A8:36:71:19:78:10:FA:6E:98:2D:77:F4:C7:31:D0:9B:18:95:15:C0:13:D0:2D:0D:94:2D:9B:BE"

jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_BRANCH }}
          fetch-depth: 0
      - run: git fetch --tags --force
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
      - name: Restore proven transport, analyze and test
        shell: bash
        run: |
          set -o pipefail
          (
            set -euo pipefail
            python tooling/materialize_second_day_transport_024.py
            test "$(awk '/^version:/ {print $2}' pubspec.yaml)" = "$EXPECTED_VERSION"
            flutter pub get
            dart format lib
            flutter analyze --no-fatal-infos --no-fatal-warnings
            flutter test
          ) 2>&1 | tee verify-second-day-024.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verify-second-day-024-log
          path: verify-second-day-024.log
          if-no-files-found: warn
          retention-days: 14

  android:
    needs: verify
    runs-on: ubuntu-22.04
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_BRANCH }}
          fetch-depth: 0
      - run: git fetch --tags --force
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
      - uses: actions/cache/restore@v4
        with:
          path: ~/.android/debug.keystore
          key: chernogram-stable-signing-v2
          fail-on-cache-miss: false
      - name: Restore permanent signing identity
        shell: bash
        env:
          CHERNOGRAM_KEYSTORE_B64: ${{ secrets.CHERNOGRAM_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          if [ -n "${CHERNOGRAM_KEYSTORE_B64:-}" ]; then
            printf '%s' "$CHERNOGRAM_KEYSTORE_B64" | base64 --decode > "$HOME/.android/debug.keystore"
            chmod 600 "$HOME/.android/debug.keystore"
          fi
          test -s "$HOME/.android/debug.keystore"
          keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android > signing-second-day-024.txt
          ACTUAL=$(grep -m1 'SHA256:' signing-second-day-024.txt | sed 's/.*SHA256: //' | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')
          EXPECTED=$(printf '%s' "$EXPECTED_CERT_SHA256" | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')
          test "$ACTUAL" = "$EXPECTED"
      - name: Build and sign Android
        shell: bash
        run: |
          set -o pipefail
          (
            set -euo pipefail
            python tooling/materialize_second_day_transport_024.py
            flutter pub get
            dart format lib
            flutter build apk --release
            APK=build/app/outputs/flutter-apk/app-release.apk
            test -s "$APK"
            APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
            "$APKSIGNER" sign --ks "$HOME/.android/debug.keystore" --ks-key-alias androiddebugkey --ks-pass pass:android --key-pass pass:android --out chernogram-android-0.24.0.apk "$APK"
            "$APKSIGNER" verify --print-certs chernogram-android-0.24.0.apk | tee apk-signature-second-day-024.txt
            APK_CERT=$(sed -n -e 's/^Signer #1 certificate SHA-256 digest: //p' -e 's/^V2 Signer: certificate SHA-256 digest: //p' -e 's/^V3.0 Signer: certificate SHA-256 digest: //p' apk-signature-second-day-024.txt | head -n 1 | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')
            EXPECTED=$(printf '%s' "$EXPECTED_CERT_SHA256" | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')
            test "$APK_CERT" = "$EXPECTED"
            sha256sum chernogram-android-0.24.0.apk | tee android-sha256-second-day-024.txt
          ) 2>&1 | tee android-second-day-024.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chernogram-android-0.24.0-second-day
          path: |
            chernogram-android-0.24.0.apk
            android-sha256-second-day-024.txt
            apk-signature-second-day-024.txt
            android-second-day-024.log
          if-no-files-found: warn
          retention-days: 14

  windows:
    needs: verify
    runs-on: windows-2022
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_BRANCH }}
          fetch-depth: 0
      - run: git fetch --tags --force
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
      - name: Build Windows from the same source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $log = Join-Path $PWD 'windows-second-day-024.log'
          function Invoke-Logged {
            param([scriptblock]$Command, [string]$Name)
            "===== $Name =====" | Tee-Object -FilePath $log -Append
            & $Command *>&1 | Tee-Object -FilePath $log -Append
            if ($LASTEXITCODE -ne 0) { throw "$Name failed with exit code $LASTEXITCODE" }
          }
          try {
            Invoke-Logged { python tooling/materialize_second_day_transport_024.py } 'Restore second-day transport'
            Invoke-Logged { flutter config --enable-windows-desktop } 'Enable Windows desktop'
            if (-not (Test-Path 'windows/CMakeLists.txt')) {
              Invoke-Logged { flutter create --platforms=windows --project-name chernogram --no-pub . } 'Create Windows runner'
            }
            $definition = 'add_compile_definitions(_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS)'
            $cmakePath = Join-Path $PWD 'windows/CMakeLists.txt'
            $lines = Get-Content $cmakePath
            if (-not ($lines -contains $definition)) {
              $patched = @($lines[0], '', $definition) + $lines[1..($lines.Length - 1)]
              Set-Content -Path $cmakePath -Value $patched -Encoding UTF8
            }
            $env:CL = "/D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS $env:CL"
            Invoke-Logged { flutter pub get } 'Flutter pub get'
            Invoke-Logged { dart format lib } 'Dart format'
            Invoke-Logged { flutter build windows --release } 'Build Windows release'
            $release = 'build/windows/x64/runner/Release'
            if (-not (Test-Path "$release/chernogram.exe")) { throw 'Windows executable was not produced' }
            Compress-Archive -Path "$release/*" -DestinationPath chernogram-windows-0.24.0.zip -Force
            Get-FileHash chernogram-windows-0.24.0.zip -Algorithm SHA256 | Format-List | Out-File windows-sha256-second-day-024.txt
          } catch {
            "ERROR: $($_.Exception.Message)" | Tee-Object -FilePath $log -Append
            throw
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chernogram-windows-0.24.0-second-day
          path: |
            chernogram-windows-0.24.0.zip
            windows-sha256-second-day-024.txt
            windows-second-day-024.log
          if-no-files-found: warn
          retention-days: 14

  finalize:
    needs: [verify, android, windows]
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_BRANCH }}
          fetch-depth: 0
      - run: git fetch --tags --force
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Commit direct source and success status
        shell: bash
        run: |
          set -euo pipefail
          python tooling/materialize_second_day_transport_024.py
          cat > SECOND_DAY_CORE_024_STATUS.md <<EOF
          Chernogram 0.24 second-day transport ready
          Version: ${EXPECTED_VERSION}
          Historical transport: d696e470cb96e61a0e5cc29c9e335b5da5a8f69b
          Current interface and 0.16 features: preserved
          Analyze and tests: passed
          Signed Android release: passed
          Windows release: passed
          Endless connection blocking: removed
          Public update channel: not changed yet
          Time: $(date -u +'%Y-%m-%dT%H:%M:%SZ')
          EOF
          rm -f SECOND_DAY_CORE_024_DIAGNOSTICS.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Чернограм 0.24 на ядре второго дня готов [skip ci]" || true
          git push origin HEAD:"$SOURCE_BRANCH"

  failure-report:
    if: failure()
    needs: [verify, android, windows]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_BRANCH }}
          fetch-depth: 0
      - name: Save failure marker
        shell: bash
        run: |
          set -euo pipefail
          cat > SECOND_DAY_CORE_024_BUILD_ERROR.md <<EOF
          # Chernogram 0.24 second-day transport build failed

          Workflow commit: ${GITHUB_SHA}
          Source branch: ${SOURCE_BRANCH}
          Time: $(date -u +'%Y-%m-%dT%H:%M:%SZ')

          Verify, Android or Windows failed. Exact logs are stored as workflow artifacts.
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SECOND_DAY_CORE_024_BUILD_ERROR.md
          git commit -m "Сохранить сбой сборки 0.24 на ядре второго дня [skip ci]" || true
          git push origin HEAD:"$SOURCE_BRANCH"
