name: Chernogram 0.24 second-day core branch check

on:
  push:
    branches: [fix/second-day-core-024]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cernogram-second-day-core-024-branch
  cancel-in-progress: true

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/second-day-core-024
          fetch-depth: 0
      - run: git fetch --tags --force
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
      - name: Diagnose second-day core
        id: diagnose
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          (
            set -euo pipefail
            mkdir -p reference/second_day
            cp lib/internet_core.dart /tmp/current-internet.dart
            cp lib/call_service.dart /tmp/current-call.dart
            cp lib/app_monitor.dart /tmp/current-monitor.dart
            git show d696e470cb96e61a0e5cc29c9e335b5da5a8f69b:lib/internet_core.dart > reference/second_day/internet_core.dart.txt
            git show d696e470cb96e61a0e5cc29c9e335b5da5a8f69b:lib/call_service.dart > reference/second_day/call_service.dart.txt
            git show d696e470cb96e61a0e5cc29c9e335b5da5a8f69b:lib/app_monitor.dart > reference/second_day/app_monitor.dart.txt
            python tooling/materialize_second_day_core_024.py
            flutter pub get
            dart format lib
            flutter analyze --no-fatal-infos --no-fatal-warnings
            flutter test
          ) 2>&1 | tee /tmp/second-day-core-024.log
      - name: Commit exact result and references
        if: always()
        shell: bash
        env:
          OUTCOME: ${{ steps.diagnose.outcome }}
        run: |
          set -euo pipefail
          cp /tmp/second-day-core-024.log /tmp/diagnostic.log 2>/dev/null || true
          git fetch origin fix/second-day-core-024
          git reset --hard origin/fix/second-day-core-024
          mkdir -p reference/second_day
          git show d696e470cb96e61a0e5cc29c9e335b5da5a8f69b:lib/internet_core.dart > reference/second_day/internet_core.dart.txt
          git show d696e470cb96e61a0e5cc29c9e335b5da5a8f69b:lib/call_service.dart > reference/second_day/call_service.dart.txt
          git show d696e470cb96e61a0e5cc29c9e335b5da5a8f69b:lib/app_monitor.dart > reference/second_day/app_monitor.dart.txt
          {
            echo '# Chernogram 0.24 second-day core diagnostics'
            echo
            echo "Outcome: ${OUTCOME}"
            echo "Time: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo
            echo '```text'
            tail -n 1800 /tmp/diagnostic.log 2>/dev/null || true
            echo '```'
          } > SECOND_DAY_CORE_024_DIAGNOSTICS.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reference/second_day SECOND_DAY_CORE_024_DIAGNOSTICS.md
          git commit -m "Сохранить результат ядра второго дня 0.24 [skip ci]" || true
          git push origin HEAD:fix/second-day-core-024
          test "$OUTCOME" = success
