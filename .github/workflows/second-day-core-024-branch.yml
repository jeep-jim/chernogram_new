name: Chernogram 0.24 exact 0.7.3 core check

on:
  push:
    branches: [fix/second-day-core-024]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cernogram-exact-073-core-024
  cancel-in-progress: true

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/second-day-core-024
          fetch-depth: 0
      - run: git fetch --tags --force
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
      - name: Restore and diagnose exact 0.7.3 chat and video calls
        id: diagnose
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          (
            set -euo pipefail
            mkdir -p reference/working_073
            git show d1cad8649d00259ab615e65ea196213713b2385f:lib/internet_core.dart > reference/working_073/internet_core.dart.txt
            git show d1cad8649d00259ab615e65ea196213713b2385f:lib/call_service.dart > reference/working_073/call_service.dart.txt
            git show d1cad8649d00259ab615e65ea196213713b2385f:lib/chat_screen.dart > reference/working_073/chat_screen.dart.txt
            python tooling/materialize_second_day_core_024.py
            flutter pub get
            dart format lib
            flutter analyze --no-fatal-infos --no-fatal-warnings
            flutter test
          ) 2>&1 | tee /tmp/exact-073-core-024.log
      - name: Commit exact result and references
        if: always()
        shell: bash
        env:
          OUTCOME: ${{ steps.diagnose.outcome }}
        run: |
          set -euo pipefail
          cp /tmp/exact-073-core-024.log /tmp/diagnostic.log 2>/dev/null || true
          git fetch origin fix/second-day-core-024
          git reset --hard origin/fix/second-day-core-024
          mkdir -p reference/working_073
          git show d1cad8649d00259ab615e65ea196213713b2385f:lib/internet_core.dart > reference/working_073/internet_core.dart.txt
          git show d1cad8649d00259ab615e65ea196213713b2385f:lib/call_service.dart > reference/working_073/call_service.dart.txt
          git show d1cad8649d00259ab615e65ea196213713b2385f:lib/chat_screen.dart > reference/working_073/chat_screen.dart.txt
          {
            echo '# Chernogram 0.24 exact 0.7.3 diagnostics'
            echo
            echo "Outcome: ${OUTCOME}"
            echo "Reference: d1cad8649d00259ab615e65ea196213713b2385f (0.7.3+14)"
            echo "Time: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo
            echo '```text'
            tail -n 1800 /tmp/diagnostic.log 2>/dev/null || true
            echo '```'
          } > EXACT_073_CORE_024_DIAGNOSTICS.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reference/working_073 EXACT_073_CORE_024_DIAGNOSTICS.md
          git commit -m "Сохранить результат точного ядра 0.7.3 для 0.24 [skip ci]" || true
          git push origin HEAD:fix/second-day-core-024
          test "$OUTCOME" = success
