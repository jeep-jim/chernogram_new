name: Build iOS foundation

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: chernogram-ios-main
  cancel-in-progress: true

jobs:
  build-ios:
    name: Build unsigned iOS simulator app
    runs-on: macos-latest
    timeout-minutes: 50

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Flutter 3.44.8
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: false

      - name: Prepare current Chernogram source
        shell: bash
        run: |
          set -e
          python3 tooling/apply_v06.py
          python3 tooling/apply_v061.py
          python3 tooling/fix_v062.py
          flutter create --platforms=ios --org com.chernogram --project-name chernogram .

      - name: Configure iOS identity and permissions
        shell: bash
        run: |
          set -e
          PLIST="ios/Runner/Info.plist"
          PROJECT="ios/Runner.xcodeproj/project.pbxproj"

          sed -i '' 's/com\.chernogram\.chernogram/com.chernogram.app/g' "$PROJECT"
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName Чернограм" "$PLIST" || \
            /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string Чернограм" "$PLIST"

          /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string Камера нужна для QR-кодов, видеосообщений и звонков." "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Add :NSMicrophoneUsageDescription string Микрофон нужен для голосовых сообщений и звонков." "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Add :NSContactsUsageDescription string Контакты нужны только для выбора людей, которым вы отправляете приглашение." "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryUsageDescription string Доступ к медиатеке нужен для выбора локальных фото и видео." "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryAddUsageDescription string Разрешение нужно для сохранения выбранных файлов на устройстве." "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Add :NSLocalNetworkUsageDescription string Локальная сеть используется для прямого соединения устройств без центрального хранилища." "$PLIST" || true

          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes array" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0 dict" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLName string com.chernogram.app" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes array" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes:0 string chernogram" "$PLIST" || true

      - name: Validate and build iOS simulator app
        id: build_ios
        shell: bash
        run: |
          set +e
          set -o pipefail
          {
            flutter --version
            flutter pub get
            dart format lib
            flutter analyze --no-fatal-infos --no-fatal-warnings
            flutter test
            flutter build ios --simulator --debug
          } 2>&1 | tee ios-build.txt
          STATUS=${PIPESTATUS[0]}
          exit "$STATUS"

      - name: Package simulator build
        shell: bash
        run: |
          set -e
          ditto -c -k --sequesterRsrc --keepParent \
            build/ios/iphonesimulator/Runner.app \
            chernogram-ios-simulator.zip

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: chernogram-ios-simulator
          path: |
            chernogram-ios-simulator.zip
            ios-build.txt
          if-no-files-found: error
          retention-days: 30

      - name: Save iOS failure diagnostics
        if: failure()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp ios-build.txt /tmp/ios-build.txt 2>/dev/null || true
          git fetch origin main
          git reset --hard origin/main
          {
            echo "iOS simulator build failed"
            echo "Commit: ${GITHUB_SHA}"
            echo "Time: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            if [ -f /tmp/ios-build.txt ]; then
              echo "===== IOS BUILD OUTPUT ====="
              cat /tmp/ios-build.txt
            fi
          } > IOS_ERROR.txt
          git add -f IOS_ERROR.txt
          git commit -m "Сохранить ошибку iOS сборки 0.6.2 [skip ci]" || true
          git push origin HEAD:main || true

      - name: Mark iOS foundation as ready
        if: success()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git reset --hard origin/main
          cat > IOS_STATUS.md <<EOF
          iOS simulator build ready
          Commit: ${GITHUB_SHA}
          Time: $(date -u +'%Y-%m-%dT%H:%M:%SZ')
          Version: 0.6.2+9
          Bundle ID foundation: com.chernogram.app
          Native iPhone installation: requires Apple Developer signing and TestFlight/App Store distribution
          EOF
          git add IOS_STATUS.md
          if git ls-files --error-unmatch IOS_ERROR.txt >/dev/null 2>&1; then
            git rm -f IOS_ERROR.txt
          fi
          git commit -m "iOS основа 0.6.2 собрана [skip ci]" || true
          git push origin HEAD:main || true