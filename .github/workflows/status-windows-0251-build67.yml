name: Статус Windows 0.25.1 build 67

on:
  push:
    branches: [experiment/windows-room-desktop-066]
    paths:
      - .github/workflows/status-windows-0251-build67.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  status:
    runs-on: ubuntu-22.04
    timeout-minutes: 125
    steps:
      - name: Найти Windows build 67
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 40); do
            RUN_ID=$(gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow windows-0251-startup-fix-build67.yml \
              --branch experiment/windows-room-desktop-066 \
              --limit 1 \
              --json databaseId \
              --jq '.[0].databaseId // empty')
            if [ -n "$RUN_ID" ]; then
              echo "RUN_ID=$RUN_ID" >> "$GITHUB_ENV"
              echo "Найден Windows build 67: $RUN_ID"
              exit 0
            fi
            sleep 3
          done
          echo 'Windows build 67 не найден' >&2
          exit 1

      - name: Дождаться завершения Windows build 67
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run watch "$RUN_ID" --repo "$GITHUB_REPOSITORY" --exit-status

      - name: Сохранить итог
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run view "$RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --json databaseId,status,conclusion,url,jobs \
            > windows-build67-status.json
          cat windows-build67-status.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-build67-status
          path: windows-build67-status.json
          if-no-files-found: warn
          retention-days: 3
