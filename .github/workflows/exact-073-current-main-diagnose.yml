name: Diagnose exact 0.7.3 core on current main

on:
  push:
    branches: [fix/exact-073-current-main-024]
    paths:
      - .github/workflows/exact-073-current-main-diagnose.yml
      - tooling/materialize_exact_073_core_024.py
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: diagnose-exact-073-current-main
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/exact-073-current-main-024
          fetch-depth: 0
      - run: git fetch --tags --force
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
      - name: Run exact diagnostic
        id: check
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          (
            set -euo pipefail
            python tooling/materialize_exact_073_core_024.py
            flutter pub get
            dart format lib/internet_core.dart lib/call_service.dart lib/app_monitor.dart
            flutter analyze --no-fatal-infos --no-fatal-warnings
            flutter test
          ) 2>&1 | tee /tmp/exact-073-current-main.log
      - name: Commit exact diagnostic
        if: always()
        shell: bash
        env:
          OUTCOME: ${{ steps.check.outcome }}
        run: |
          set -euo pipefail
          cp /tmp/exact-073-current-main.log /tmp/diagnostic.log 2>/dev/null || true
          git fetch origin fix/exact-073-current-main-024
          git reset --hard origin/fix/exact-073-current-main-024
          {
            echo '# Exact 0.7.3 core diagnostic on current main'
            echo
            echo "Outcome: ${OUTCOME}"
            echo "Reference: d1cad8649d00259ab615e65ea196213713b2385f (0.7.3+14)"
            echo "Time: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo
            echo '```text'
            tail -n 1800 /tmp/diagnostic.log 2>/dev/null || true
            echo '```'
          } > EXACT_073_CURRENT_MAIN_024_DIAGNOSTICS.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add EXACT_073_CURRENT_MAIN_024_DIAGNOSTICS.md
          git commit -m "Сохранить точную диагностику ядра 0.7.3 на текущем main [skip ci]" || true
          git push origin HEAD:fix/exact-073-current-main-024
          test "$OUTCOME" = success
