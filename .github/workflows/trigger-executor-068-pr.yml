name: Контроль Android build 69

on:
  pull_request:
    branches: [main]
    paths:
      - TRIGGER_EXECUTE_068.md

permissions:
  actions: write
  contents: read

jobs:
  trigger:
    name: Запустить компактный Android build 69
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Запустить Android workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BEFORE=$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow publish-android-069.yml \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId // 0')
          gh workflow run publish-android-069.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main
          for attempt in $(seq 1 20); do
            sleep 2
            RUN_ID=$(gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow publish-android-069.yml \
              --limit 1 \
              --json databaseId \
              --jq '.[0].databaseId // 0')
            if [ "$RUN_ID" != "0" ] && [ "$RUN_ID" != "$BEFORE" ]; then
              echo "Компактный Android build 69: $RUN_ID"
              exit 0
            fi
          done
          echo "Событие принято, но ID Android-сборки ещё не появился."
