name: Build iPhone Sideload IPA

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: chernogram-ios-sideload-main
  cancel-in-progress: true

jobs:
  build-ios:
    name: Build unsigned IPA for personal signing
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Flutter 3.44.8
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.8"
          channel: stable
          cache: false

      - name: Generate iOS host project when absent
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d ios/Runner.xcodeproj ]; then
            flutter create --platforms=ios --org com.chernogram .
          fi

      - name: Apply Chernogram source fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 tooling/fix_v07_compile.py
          python3 tooling/fix_v09_media_calls.py
          python3 tooling/fix_v09_compile.py
          python3 tooling/fix_v091_player_header.py
          python3 tooling/fix_v010_rtc_circles.py

      - name: Configure iPhone permissions and deployment target
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import plistlib

          podfile = Path('ios/Podfile')
          text = podfile.read_text(encoding='utf-8')
          if "platform :ios" in text:
              lines = []
              replaced = False
              for line in text.splitlines():
                  if line.lstrip().startswith("# platform :ios") or line.lstrip().startswith("platform :ios"):
                      lines.append("platform :ios, '13.0'")
                      replaced = True
                  else:
                      lines.append(line)
              text = '\n'.join(lines) + '\n'
              if not replaced:
                  text = "platform :ios, '13.0'\n" + text
          else:
              text = "platform :ios, '13.0'\n" + text
          podfile.write_text(text, encoding='utf-8')

          plist_path = Path('ios/Runner/Info.plist')
          with plist_path.open('rb') as fh:
              plist = plistlib.load(fh)
          plist['CFBundleDisplayName'] = 'Чернограм'
          plist['NSCameraUsageDescription'] = 'Камера нужна для видеозвонков и видеокружков.'
          plist['NSMicrophoneUsageDescription'] = 'Микрофон нужен для звонков и голосовых сообщений.'
          plist['NSPhotoLibraryUsageDescription'] = 'Доступ нужен для отправки фото и видео в чат.'
          plist['NSContactsUsageDescription'] = 'Доступ нужен для сохранения собеседников в контакты.'
          plist['UIBackgroundModes'] = ['audio', 'voip']
          with plist_path.open('wb') as fh:
              plistlib.dump(plist, fh)
          PY

      - name: Resolve CocoaPods and build iPhone app without distribution signing
        shell: bash
        run: |
          set +e
          set -o pipefail
          {
            flutter --version
            flutter pub get
            cd ios
            pod install --repo-update
            cd ..
            flutter build ios --release --no-codesign
          } 2>&1 | tee ios-build.txt
          STATUS=${PIPESTATUS[0]}
          exit "$STATUS"

      - name: Package sideloadable IPA
        shell: bash
        run: |
          set -euo pipefail
          APP=build/ios/iphoneos/Runner.app
          if [ ! -d "$APP" ]; then
            echo "::error::Runner.app was not produced"
            exit 1
          fi
          rm -rf Payload chernogram-ios.ipa
          mkdir Payload
          cp -R "$APP" Payload/Чернограм.app
          ditto -c -k --sequesterRsrc --keepParent Payload chernogram-ios.ipa
          shasum -a 256 chernogram-ios.ipa | tee ios-sha256.txt

      - name: Publish iPhone sideload release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION_FULL=$(awk '/^version:/ {print $2}' pubspec.yaml)
          VERSION_NAME=${VERSION_FULL%%+*}
          gh release delete latest-ios-sideload --cleanup-tag --yes || true
          gh release create latest-ios-sideload chernogram-ios.ipa ios-sha256.txt \
            --target main \
            --title "Чернограм iPhone ${VERSION_NAME}" \
            --notes "Неподписанный IPA для личного тестирования через SideStore, AltStore или Xcode Personal Team. При бесплатной подписи Apple приложение нужно обновлять/переподписывать каждые 7 дней." \
            --prerelease

      - name: Save iOS build diagnostics
        if: failure()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp ios-build.txt /tmp/ios-build.txt 2>/dev/null || true
          git fetch origin main
          git reset --hard origin/main
          {
            echo "iOS sideload build failed"
            echo "Commit: ${GITHUB_SHA}"
            echo "Time: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            if [ -f /tmp/ios-build.txt ]; then
              echo "===== LAST 500 BUILD LINES ====="
              tail -n 500 /tmp/ios-build.txt
            fi
          } > IOS_BUILD_ERROR.txt
          git add -f IOS_BUILD_ERROR.txt
          git commit -m "Сохранить ошибку iPhone сборки 0.10 [skip ci]" || true
          git push origin HEAD:main || true

      - name: Mark iPhone IPA as ready
        if: success()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git reset --hard origin/main
          cat > IOS_BUILD_STATUS.md <<EOF
          iPhone IPA ready
          Commit: ${GITHUB_SHA}
          Time: $(date -u +'%Y-%m-%dT%H:%M:%SZ')
          Version: $(awk '/^version:/ {print $2}' pubspec.yaml)
          Signing: unsigned IPA intended for SideStore/AltStore/Xcode Personal Team re-signing
          Download: https://github.com/jeep-jim/chernogram_new/releases/download/latest-ios-sideload/chernogram-ios.ipa
          EOF
          git add IOS_BUILD_STATUS.md
          if git ls-files --error-unmatch IOS_BUILD_ERROR.txt >/dev/null 2>&1; then
            git rm -f IOS_BUILD_ERROR.txt
          fi
          git commit -m "IPA 0.10 для iPhone готов [skip ci]" || true
          git push origin HEAD:main || true