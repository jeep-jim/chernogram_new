name: Publish Android 0.22.2 In-App Update

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/android-release-0222.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cernogram-android-release-0222
  cancel-in-progress: true

env:
  SOURCE_BRANCH: feature/android-data-first-v1
  EXPECTED_VERSION: 0.22.2+54
  EXPECTED_CERT_SHA256: "F4:A2:C8:36:A8:36:71:19:78:10:FA:6E:98:2D:77:F4:C7:31:D0:9B:18:95:15:C0:13:D0:2D:0D:94:2D:9B:BE"

jobs:
  android:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Checkout Android source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_BRANCH }}
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true

      - name: Restore permanent Android signing key
        uses: actions/cache/restore@v4
        with:
          path: ~/.android/debug.keystore
          key: chernogram-stable-signing-v2
          fail-on-cache-miss: false

      - name: Restore and verify signing identity
        shell: bash
        env:
          CHERNOGRAM_KEYSTORE_B64: ${{ secrets.CHERNOGRAM_KEYSTORE_B64 }}
        run: |
          set -o pipefail
          (
            set -euo pipefail
            mkdir -p "$HOME/.android"
            if [ -n "${CHERNOGRAM_KEYSTORE_B64:-}" ]; then
              printf '%s' "$CHERNOGRAM_KEYSTORE_B64" | base64 --decode > "$HOME/.android/debug.keystore"
              chmod 600 "$HOME/.android/debug.keystore"
            fi
            test -s "$HOME/.android/debug.keystore" || { echo '::error::Signing key unavailable'; exit 1; }
            keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android | tee signing-key.txt
            ACTUAL=$(grep -m1 'SHA256:' signing-key.txt | sed 's/.*SHA256: //' | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')
            EXPECTED=$(printf '%s' "$EXPECTED_CERT_SHA256" | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')
            test "$ACTUAL" = "$EXPECTED" || { echo '::error::Signing fingerprint mismatch'; exit 1; }
          ) 2>&1 | tee android-release-0222.log

      - name: Materialize full features and build release
        shell: bash
        run: |
          set -o pipefail
          (
            set -euo pipefail
            VERSION=$(awk '/^version:/ {print $2}' pubspec.yaml)
            test "$VERSION" = "$EXPECTED_VERSION"
            bash tooling/build_android_data_first.sh
          ) 2>&1 | tee -a android-release-0222.log

      - name: Sign and verify release APK
        shell: bash
        run: |
          set -o pipefail
          (
            set -euo pipefail
            SOURCE_APK=build/app/outputs/flutter-apk/app-release.apk
            test -s "$SOURCE_APK"
            APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
            test -n "$APKSIGNER"
            "$APKSIGNER" sign \
              --ks "$HOME/.android/debug.keystore" \
              --ks-key-alias androiddebugkey \
              --ks-pass pass:android \
              --key-pass pass:android \
              --out chernogram.apk \
              "$SOURCE_APK"
            "$APKSIGNER" verify --print-certs chernogram.apk | tee apk-signature.txt
            APK_CERT=$(sed -n -e 's/^Signer #1 certificate SHA-256 digest: //p' -e 's/^V2 Signer: certificate SHA-256 digest: //p' -e 's/^V3.0 Signer: certificate SHA-256 digest: //p' apk-signature.txt | head -n 1 | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')
            EXPECTED=$(printf '%s' "$EXPECTED_CERT_SHA256" | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')
            test -n "$APK_CERT" && test "$APK_CERT" = "$EXPECTED"
            sha256sum chernogram.apk | tee apk-sha256.txt
          ) 2>&1 | tee -a android-release-0222.log

      - name: Prepare in-app update manifest
        shell: bash
        run: |
          set -euo pipefail
          VERSION_FULL=$(awk '/^version:/ {print $2}' pubspec.yaml)
          VERSION_NAME=${VERSION_FULL%%+*}
          VERSION_CODE=${VERSION_FULL##*+}
          APK_SHA256=$(awk '{print $1}' apk-sha256.txt)
          cat > update.json <<EOF
          {
            "versionName": "${VERSION_NAME}",
            "versionCode": ${VERSION_CODE},
            "apkUrl": "https://github.com/jeep-jim/chernogram_new/releases/download/latest-apk/chernogram.apk?v=${VERSION_CODE}",
            "sha256": "${APK_SHA256}",
            "certificateSha256": "${EXPECTED_CERT_SHA256}",
            "notesRu": "Версия 0.22.2 возвращает все функции чатов в новом интерфейсе: настройки приватности, ответы и пересылку, копирование и выделение текста, кликабельные ссылки, файлы, голосовые и видеокружки вне текстовых облаков. Исправлено воспроизведение музыки. Возвращена прежняя иконка приложения.",
            "notesEn": "Version 0.22.2 restores full chat functionality in the new interface: privacy settings, replies and forwarding, copy and text selection, clickable links, files, voice notes and video circles outside text bubbles. Music playback is fixed and the previous launcher icon is restored."
          }
          EOF

      - name: Publish latest-apk for every installed Android client
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          (
            set -euo pipefail
            gh release delete latest-apk --cleanup-tag --yes || true
            gh release create latest-apk \
              chernogram.apk \
              update.json \
              --target "$SOURCE_BRANCH" \
              --title "Чернограм Android 0.22.2" \
              --notes "Обновление распространяется штатной кнопкой внутри приложения. Удалять приложение и устанавливать APK вручную не требуется." \
              --prerelease
          ) 2>&1 | tee -a android-release-0222.log

      - name: Commit materialized Android source and status
        shell: bash
        run: |
          set -euo pipefail
          APK_BYTES=$(stat -c '%s' chernogram.apk)
          APK_SHA=$(awk '{print $1}' apk-sha256.txt)
          cat > ANDROID_DATA_FIRST_STATUS.md <<EOF
          Android Data First published
          Version: ${EXPECTED_VERSION}
          Source branch: ${SOURCE_BRANCH}
          Base transport: published stable 0.9.1
          Previous launcher icon: restored
          Agent: removed
          Privacy screen settings: restored
          Reply, forward, copy and selectable text: restored
          Clickable links: restored
          Files, voice messages and video circles: outside text bubbles
          Music playback: fixed
          Flutter analyze: success
          Flutter tests: success
          Android release build: success
          APK bytes: ${APK_BYTES}
          APK SHA-256: ${APK_SHA}
          Signing certificate: ${EXPECTED_CERT_SHA256}
          Android release tag: latest-apk
          In-app update manifest: main/update.json
          Windows: not touched
          Time: $(date -u +'%Y-%m-%dT%H:%M:%SZ')
          EOF
          cp update.json /tmp/chernogram-update-0222.json
          rm -f ANDROID_DATA_FIRST_CI_ERROR.md signing-key.txt apk-signature.txt android-release-0222.log apk-sha256.txt chernogram.apk update.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Android 0.22.2 функции восстановлены и проверены [skip ci]"
          git push origin HEAD:"$SOURCE_BRANCH"

      - name: Publish update manifest on main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
          cp /tmp/chernogram-update-0222.json update.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add update.json
          git commit -m "Опубликовать Android 0.22.2 для обновления из приложения [skip ci]"
          git push origin HEAD:main

      - name: Upload release artifact and log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cernogram-android-0.22.2-release
          path: |
            chernogram.apk
            update.json
            android-release-0222.log
            apk-signature.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Save failure report
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          cp android-release-0222.log /tmp/android-release-0222.log 2>/dev/null || true
          cp signing-key.txt /tmp/signing-key.txt 2>/dev/null || true
          cp apk-signature.txt /tmp/apk-signature.txt 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "$SOURCE_BRANCH"
          git reset --hard "origin/$SOURCE_BRANCH"
          {
            echo '# Android 0.22.2 release failed'
            echo
            echo "Source head: $(git rev-parse HEAD)"
            echo "Workflow commit: ${GITHUB_SHA}"
            echo "Time: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            for file in /tmp/android-release-0222.log /tmp/signing-key.txt /tmp/apk-signature.txt; do
              [ -f "$file" ] || continue
              echo
              echo "## $(basename "$file")"
              echo '```text'
              tail -n 900 "$file"
              echo '```'
            done
          } > ANDROID_DATA_FIRST_CI_ERROR.md
          rm -f ANDROID_DATA_FIRST_STATUS.md
          git add -A
          git commit -m "Сохранить ошибку Android 0.22.2 [skip ci]" || exit 0
          git push origin HEAD:"$SOURCE_BRANCH"
