name: Контроль Чернограм build 75

on:
  pull_request:
    branches: [main]
    paths:
      - STATUS_RELIABILITY_075.md

permissions:
  actions: read
  contents: read

jobs:
  status:
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    steps:
      - name: Найти и дождаться публикации build 75
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          RUN_ID=0
          for attempt in $(seq 1 60); do
            RUN_ID=$(gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow publish-075-reliability.yml \
              --limit 1 \
              --json databaseId \
              --jq '.[0].databaseId // 0')
            if [ "$RUN_ID" != "0" ]; then break; fi
            sleep 2
          done
          test "$RUN_ID" != "0"
          echo "RELIABILITY_RUN_ID=$RUN_ID"
          gh run watch "$RUN_ID" --repo "$GITHUB_REPOSITORY" --exit-status
          gh run view "$RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --json databaseId,status,conclusion,url,jobs \
            | tee reliability-status75.json

      - name: Сохранить статус
        uses: actions/upload-artifact@v4
        with:
          name: reliability-075-status
          path: reliability-status75.json
          if-no-files-found: error
          retention-days: 3
