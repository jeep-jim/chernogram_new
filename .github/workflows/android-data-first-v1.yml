name: Build Android Data First v1

on:
  push:
    branches:
      - feature/android-data-first-v1
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cernogram-android-data-first-v1
  cancel-in-progress: true

env:
  EXPECTED_CERT_SHA256: "F4:A2:C8:36:A8:36:71:19:78:10:FA:6E:98:2D:77:F4:C7:31:D0:9B:18:95:15:C0:13:D0:2D:0D:94:2D:9B:BE"

jobs:
  android:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    timeout-minutes: 70

    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/android-data-first-v1
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true

      - name: Restore permanent signing key
        uses: actions/cache/restore@v4
        with:
          path: ~/.android/debug.keystore
          key: chernogram-stable-signing-v2
          fail-on-cache-miss: false

      - name: Restore signing key and validate certificate
        shell: bash
        env:
          CHERNOGRAM_KEYSTORE_B64: ${{ secrets.CHERNOGRAM_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          if [ -n "${CHERNOGRAM_KEYSTORE_B64:-}" ]; then
            printf '%s' "$CHERNOGRAM_KEYSTORE_B64" | base64 --decode > "$HOME/.android/debug.keystore"
            chmod 600 "$HOME/.android/debug.keystore"
          fi
          test -s "$HOME/.android/debug.keystore" || { echo '::error::Signing key unavailable'; exit 1; }
          keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android | tee signing-key.txt
          ACTUAL=$(grep -m1 'SHA256:' signing-key.txt | sed 's/.*SHA256: //' | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')
          EXPECTED=$(printf '%s' "$EXPECTED_CERT_SHA256" | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')
          test "$ACTUAL" = "$EXPECTED"

      - name: Materialize, validate and build
        shell: bash
        run: |
          set -o pipefail
          (
            set -euo pipefail
            python tooling/materialize_android_data_first_v1.py
            flutter --version
            flutter pub get
            dart format lib/main.dart lib/brand.dart lib/account_access.dart lib/android_data_first.dart lib/chat_screen.dart
            flutter analyze --no-fatal-infos --no-fatal-warnings
            flutter test
            flutter build apk --release
            test -s build/app/outputs/flutter-apk/app-release.apk
          ) 2>&1 | tee android-data-first-ci.log

      - name: Sign and verify preview APK
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_APK=build/app/outputs/flutter-apk/app-release.apk
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          test -n "$APKSIGNER"
          "$APKSIGNER" sign \
            --ks "$HOME/.android/debug.keystore" \
            --ks-key-alias androiddebugkey \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out chernogram-android-data-first.apk \
            "$SOURCE_APK"
          "$APKSIGNER" verify --print-certs chernogram-android-data-first.apk | tee apk-signature.txt
          APK_CERT=$(sed -n -e 's/^Signer #1 certificate SHA-256 digest: //p' -e 's/^V2 Signer: certificate SHA-256 digest: //p' -e 's/^V3.0 Signer: certificate SHA-256 digest: //p' apk-signature.txt | head -n 1 | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')
          EXPECTED=$(printf '%s' "$EXPECTED_CERT_SHA256" | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')
          test -n "$APK_CERT" && test "$APK_CERT" = "$EXPECTED"
          sha256sum chernogram-android-data-first.apk | tee apk-sha256.txt

      - name: Publish isolated Android preview
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release delete android-data-first-preview --cleanup-tag --yes || true
          gh release create android-data-first-preview \
            chernogram-android-data-first.apk \
            apk-sha256.txt \
            --target feature/android-data-first-v1 \
            --title "Чернограм Android Data First 0.22.0" \
            --notes "Изолированная Android-сборка: без ИИ-агента, с разделами Чаты, Файлы, Музыка и Профиль, новой навигацией, единым логотипом, QR-контактами, поиском файлов, распознаванием музыки и переносимым Chernogram ID. Основной latest-apk не перезаписывается." \
            --prerelease

      - name: Upload Android preview
        uses: actions/upload-artifact@v4
        with:
          name: cernogram-android-data-first-0.22.0
          path: |
            chernogram-android-data-first.apk
            apk-sha256.txt
            android-data-first-ci.log
          if-no-files-found: error
          retention-days: 14

      - name: Save validated source and status
        shell: bash
        run: |
          set -euo pipefail
          cat > ANDROID_DATA_FIRST_STATUS.md <<EOF
          Android Data First ready
          Version: 0.22.0+52
          Source: feature/android-data-first-v1
          Base: stable 0.9.1
          Agent: removed
          Android build: success
          Signing certificate: ${EXPECTED_CERT_SHA256}
          Preview tag: android-data-first-preview
          Time: $(date -u +'%Y-%m-%dT%H:%M:%SZ')
          EOF
          rm -f ANDROID_DATA_FIRST_CI_ERROR.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Android data-first 0.22 проверен [skip ci]" || exit 0
          git push origin HEAD:feature/android-data-first-v1

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-data-first-failure-log
          path: |
            android-data-first-ci.log
            signing-key.txt
            apk-signature.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Save failure report
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin feature/android-data-first-v1
          git reset --hard origin/feature/android-data-first-v1
          {
            echo '# Android Data First CI failed'
            echo
            echo "Commit: ${GITHUB_SHA}"
            echo "Time: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            for file in android-data-first-ci.log signing-key.txt apk-signature.txt; do
              [ -f "$file" ] || continue
              echo
              echo "## $file"
              echo '```text'
              tail -n 500 "$file"
              echo '```'
            done
          } > ANDROID_DATA_FIRST_CI_ERROR.md
          rm -f ANDROID_DATA_FIRST_STATUS.md
          git add -A
          git commit -m "Сохранить ошибку Android data-first [skip ci]" || exit 0
          git push origin HEAD:feature/android-data-first-v1
