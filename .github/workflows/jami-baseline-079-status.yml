name: Контроль Jami NoPush baseline 0.79

on:
  pull_request:
    branches: [fix/current-ui-working-core-061]
    paths:
      - JAMI_BASELINE_079_STATUS.md

permissions:
  actions: read
  contents: read

jobs:
  status:
    runs-on: ubuntu-22.04
    timeout-minutes: 320
    steps:
      - name: Найти и дождаться baseline build
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          RUN_ID=0
          for attempt in $(seq 1 60); do
            RUN_ID=$(gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow jami-android-baseline-079.yml \
              --branch experiment/jami-core-078 \
              --limit 1 \
              --json databaseId \
              --jq '.[0].databaseId // 0')
            if [ "$RUN_ID" != "0" ]; then break; fi
            sleep 5
          done
          test "$RUN_ID" != "0"
          echo "JAMI_BASELINE_RUN_ID=$RUN_ID"
          gh run watch "$RUN_ID" --repo "$GITHUB_REPOSITORY" --exit-status
          gh run view "$RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --json databaseId,status,conclusion,url,jobs \
            | tee jami-baseline-status.json

      - name: Сохранить статус
        uses: actions/upload-artifact@v4
        with:
          name: chernogram-jami-baseline-079-status
          path: jami-baseline-status.json
          if-no-files-found: error
          retention-days: 3
