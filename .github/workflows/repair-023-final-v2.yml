name: Final Chernogram 0.23 Android and Windows v2

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/repair-023-final-v2.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: chernogram-023-final-v2
  cancel-in-progress: true

env:
  SOURCE_BRANCH: fix/realtime-ui-023
  EXPECTED_VERSION: 0.23.0+55
  FLUTTER_VERSION: 3.44.8
  EXPECTED_CERT_SHA256: "F4:A2:C8:36:A8:36:71:19:78:10:FA:6E:98:2D:77:F4:C7:31:D0:9B:18:95:15:C0:13:D0:2D:0D:94:2D:9B:BE"

jobs:
  verify:
    name: Verify repaired source
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_BRANCH }}
          fetch-depth: 0
      - run: git fetch --tags --force
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Analyze and test
        shell: bash
        run: |
          set -o pipefail
          (
            set -euo pipefail
            python tooling/apply_repair_023.py
            python tooling/restore_v16_features.py
            test "$(awk '/^version:/ {print $2}' pubspec.yaml)" = "$EXPECTED_VERSION"
            flutter --version
            flutter pub get
            dart format lib
            flutter analyze --no-fatal-infos --no-fatal-warnings
            flutter test
          ) 2>&1 | tee verify-023-v2.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verify-023-v2-log
          path: verify-023-v2.log
          if-no-files-found: warn
          retention-days: 14

  android:
    name: Build signed Android 0.23
    needs: verify
    runs-on: ubuntu-22.04
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_BRANCH }}
          fetch-depth: 0
      - run: git fetch --tags --force
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - uses: actions/cache/restore@v4
        with:
          path: ~/.android/debug.keystore
          key: chernogram-stable-signing-v2
          fail-on-cache-miss: false
      - name: Restore permanent signing key
        shell: bash
        env:
          CHERNOGRAM_KEYSTORE_B64: ${{ secrets.CHERNOGRAM_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          if [ -n "${CHERNOGRAM_KEYSTORE_B64:-}" ]; then
            printf '%s' "$CHERNOGRAM_KEYSTORE_B64" | base64 --decode > "$HOME/.android/debug.keystore"
            chmod 600 "$HOME/.android/debug.keystore"
          fi
          test -s "$HOME/.android/debug.keystore"
          keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android > signing-key-023-v2.txt
          ACTUAL=$(grep -m1 'SHA256:' signing-key-023-v2.txt | sed 's/.*SHA256: //' | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')
          EXPECTED=$(printf '%s' "$EXPECTED_CERT_SHA256" | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')
          test "$ACTUAL" = "$EXPECTED"
      - name: Build, sign and verify APK
        shell: bash
        run: |
          set -o pipefail
          (
            set -euo pipefail
            python tooling/apply_repair_023.py
            python tooling/restore_v16_features.py
            flutter pub get
            dart format lib
            flutter build apk --release
            APK=build/app/outputs/flutter-apk/app-release.apk
            test -s "$APK"
            APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
            test -n "$APKSIGNER"
            "$APKSIGNER" sign \
              --ks "$HOME/.android/debug.keystore" \
              --ks-key-alias androiddebugkey \
              --ks-pass pass:android \
              --key-pass pass:android \
              --out chernogram-android-0.23.0.apk \
              "$APK"
            "$APKSIGNER" verify --print-certs chernogram-android-0.23.0.apk | tee apk-signature-023-v2.txt
            APK_CERT=$(sed -n -e 's/^Signer #1 certificate SHA-256 digest: //p' -e 's/^V2 Signer: certificate SHA-256 digest: //p' -e 's/^V3.0 Signer: certificate SHA-256 digest: //p' apk-signature-023-v2.txt | head -n 1 | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')
            EXPECTED=$(printf '%s' "$EXPECTED_CERT_SHA256" | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')
            test "$APK_CERT" = "$EXPECTED"
            sha256sum chernogram-android-0.23.0.apk | tee android-sha256-023-v2.txt
          ) 2>&1 | tee android-023-v2.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chernogram-android-0.23.0-v2
          path: |
            chernogram-android-0.23.0.apk
            android-sha256-023-v2.txt
            apk-signature-023-v2.txt
            android-023-v2.log
          if-no-files-found: warn
          retention-days: 14

  windows:
    name: Build Windows 0.23 with generated runner
    needs: verify
    runs-on: windows-2022
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_BRANCH }}
          fetch-depth: 0
      - run: git fetch --tags --force
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Generate runner, patch MSVC and build Windows
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $log = Join-Path $PWD 'windows-023-v2.log'

          function Invoke-Logged {
            param([scriptblock]$Command, [string]$Name)
            "===== $Name =====" | Tee-Object -FilePath $log -Append
            & $Command *>&1 | Tee-Object -FilePath $log -Append
            if ($LASTEXITCODE -ne 0) {
              throw "$Name failed with exit code $LASTEXITCODE"
            }
          }

          try {
            Invoke-Logged { python tooling/apply_repair_023.py } 'Apply 0.23 repair'
            Invoke-Logged { python tooling/restore_v16_features.py } 'Restore 0.16 features'
            Invoke-Logged { flutter --version } 'Flutter version'
            Invoke-Logged { flutter config --enable-windows-desktop } 'Enable Windows desktop'

            if (-not (Test-Path 'windows/CMakeLists.txt')) {
              Invoke-Logged { flutter create --platforms=windows --project-name chernogram --no-pub . } 'Create Windows runner'
            }

            $definition = 'add_compile_definitions(_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS)'
            $cmakePath = Join-Path $PWD 'windows/CMakeLists.txt'
            $cmakeLines = Get-Content $cmakePath
            if (-not ($cmakeLines -contains $definition)) {
              $patched = @($cmakeLines[0], '', $definition) + $cmakeLines[1..($cmakeLines.Length - 1)]
              Set-Content -Path $cmakePath -Value $patched -Encoding UTF8
            }
            $env:CL = "/D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS $env:CL"
            "Generated runner and applied MSVC coroutine compatibility" | Tee-Object -FilePath $log -Append

            Invoke-Logged { flutter pub get } 'Flutter pub get'
            Invoke-Logged { dart format lib } 'Dart format'
            Invoke-Logged { flutter build windows --release } 'Build Windows release'

            $release = Join-Path $PWD 'build/windows/x64/runner/Release'
            $exe = Join-Path $release 'chernogram.exe'
            if (-not (Test-Path $exe)) {
              throw "Windows executable was not produced: $exe"
            }
            Compress-Archive -Path "$release/*" -DestinationPath chernogram-windows-0.23.0.zip -Force
            Get-FileHash chernogram-windows-0.23.0.zip -Algorithm SHA256 | Format-List | Out-File windows-sha256-023-v2.txt
          } catch {
            "ERROR: $($_.Exception.Message)" | Tee-Object -FilePath $log -Append
            throw
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chernogram-windows-0.23.0-v2
          path: |
            chernogram-windows-0.23.0.zip
            windows-sha256-023-v2.txt
            windows-023-v2.log
          if-no-files-found: warn
          retention-days: 14

  finalize:
    name: Save verified 0.23 result
    needs: [verify, android, windows]
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_BRANCH }}
          fetch-depth: 0
      - run: git fetch --tags --force
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Commit direct validated source and status
        shell: bash
        run: |
          set -euo pipefail
          python tooling/apply_repair_023.py
          python tooling/restore_v16_features.py
          cat > REPAIR_023_STATUS.md <<EOF
          Chernogram 0.23 ready
          Version: ${EXPECTED_VERSION}
          Analyze and tests: passed
          Android signed release: passed
          Windows generated runner release: passed
          Windows coroutine compatibility: applied
          Functions from 0.16: restored
          Public in-app update channel: not changed yet
          Time: $(date -u +'%Y-%m-%dT%H:%M:%SZ')
          EOF
          rm -f REPAIR_023_V16_CI_ERROR.md REPAIR_023_CI_ERROR.md REPAIR_023_DIAGNOSTICS.md REPAIR_023_PLATFORM_DIAGNOSTICS.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Чернограм 0.23 Android и Windows готовы [skip ci]" || true
          git push origin HEAD:"$SOURCE_BRANCH"
