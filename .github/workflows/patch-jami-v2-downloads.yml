name: Применить исправление зеркал Jami v2

on:
  push:
    branches: [experiment/jami-core-078]
    paths:
      - .github/workflows/patch-jami-v2-downloads.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-22.04
    steps:
      - name: Получить ветку
        uses: actions/checkout@v4
        with:
          ref: experiment/jami-core-078
          fetch-depth: 0

      - name: Изменить основной workflow
        shell: bash
        env:
          INSERT_B64: 
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path

          path = Path(".github/workflows/build-chernogram-jami-brand-080-v2.yml")
          text = path.read_text(encoding="utf-8")
          marker = "      - name: Заранее скачать проблемные GNU-зависимости\n"
          anchor = "      - name: Наложить название, пакет и иконку Чернограма\n"

          if marker not in text:
              if anchor not in text:
                  raise SystemExit("Не найден шаг брендирования")
              block = base64.b64decode(os.environ["INSERT_B64"]).decode("utf-8")
              text = text.replace(anchor, block + anchor, 1)
              path.write_text(text, encoding="utf-8")
          PY

          git diff --check
          grep -q 'Заранее скачать проблемные GNU-зависимости' .github/workflows/build-chernogram-jami-brand-080-v2.yml

      - name: Сохранить исправление и запустить сборку
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add .github/workflows/build-chernogram-jami-brand-080-v2.yml
          if git diff --cached --quiet; then
            echo "Исправление уже применено."
            exit 0
          fi
          git commit -m "ci: стабилизировать загрузку Jami contrib"
          git push origin HEAD:experiment/jami-core-078
