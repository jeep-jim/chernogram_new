name: Build Windows

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: chernogram-windows-main
  cancel-in-progress: true

jobs:
  build-windows:
    name: Build Chernogram for Windows
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Flutter 3.44.8
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.8"
          channel: stable
          cache: false

      - name: Create Windows desktop platform
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          flutter config --enable-windows-desktop
          if (-not (Test-Path 'windows/CMakeLists.txt')) {
            flutter create --platforms=windows --project-name chernogram --no-pub .
          }

      - name: Apply Chernogram application fixes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python tooling/fix_v07_compile.py
          python tooling/fix_v09_media_calls.py
          python tooling/fix_v09_compile.py
          python tooling/fix_v091_player_header.py
          python tooling/fix_v010_rtc_circles.py
          python tooling/fix_v0101_chat_keyboard.py
          python tooling/fix_v011_messenger_polish.py
          python tooling/fix_v011_compile.py
          python -m pip install pillow --disable-pip-version-check --quiet
          python tooling/fix_windows_desktop.py

      - name: Validate and build Windows release
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $log = 'windows-build.txt'
          flutter --version 2>&1 | Tee-Object -FilePath $log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          flutter pub get 2>&1 | Tee-Object -FilePath $log -Append
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dart format lib 2>&1 | Tee-Object -FilePath $log -Append
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | Tee-Object -FilePath $log -Append
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          flutter test 2>&1 | Tee-Object -FilePath $log -Append
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          flutter build windows --release 2>&1 | Tee-Object -FilePath $log -Append
          exit $LASTEXITCODE

      - name: Package portable build and installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $versionFull = ((Select-String -Path pubspec.yaml -Pattern '^version:').Line -split '\s+')[1]
          $versionName = ($versionFull -split '\+')[0]
          $release = 'build/windows/x64/runner/Release'
          if (-not (Test-Path "$release/chernogram.exe")) {
            throw 'chernogram.exe was not produced'
          }

          foreach ($dll in @('msvcp140.dll', 'vcruntime140.dll', 'vcruntime140_1.dll')) {
            $systemDll = Join-Path $env:WINDIR "System32/$dll"
            if (Test-Path $systemDll) {
              Copy-Item $systemDll $release -Force
            }
          }

          $readme = @"
          ЧЕРНОГРАМ ДЛЯ WINDOWS

          Версия: $versionFull
          Поддержка: Windows 10 и Windows 11, 64-бит.

          Запуск без установки:
          1. Распакуйте ZIP целиком.
          2. Запустите chernogram.exe.
          3. Не переносите EXE отдельно от папки data и DLL-файлов.

          Для обычной установки используйте Chernogram-Windows-Setup.exe.
          "@
          Set-Content -Path "$release/README-RU.txt" -Value $readme -Encoding UTF8

          if (Test-Path 'chernogram-windows-portable.zip') {
            Remove-Item 'chernogram-windows-portable.zip' -Force
          }
          Compress-Archive -Path "$release/*" -DestinationPath 'chernogram-windows-portable.zip' -CompressionLevel Optimal

          choco install innosetup --yes --no-progress
          $iss = @"
          #define MyAppName "Чернограм"
          #define MyAppVersion "$versionName"
          #define MyAppPublisher "Chernogram"
          #define MyAppExeName "chernogram.exe"

          [Setup]
          AppId={{B6C33A77-38D4-4CA0-BE3A-B0C431E40F16}
          AppName={#MyAppName}
          AppVersion={#MyAppVersion}
          AppPublisher={#MyAppPublisher}
          DefaultDirName={localappdata}\Programs\Chernogram
          DefaultGroupName=Чернограм
          DisableProgramGroupPage=yes
          OutputDir=.
          OutputBaseFilename=Chernogram-Windows-Setup
          Compression=lzma2
          SolidCompression=yes
          WizardStyle=modern
          PrivilegesRequired=lowest
          ArchitecturesAllowed=x64compatible
          ArchitecturesInstallIn64BitMode=x64compatible
          MinVersion=10.0
          SetupIconFile=windows\runner\resources\app_icon.ico
          UninstallDisplayIcon={app}\{#MyAppExeName}
          CloseApplications=yes
          RestartApplications=no

          [Languages]
          Name: "russian"; MessagesFile: "compiler:Languages\Russian.isl"
          Name: "english"; MessagesFile: "compiler:Default.isl"

          [Tasks]
          Name: "desktopicon"; Description: "Создать значок на рабочем столе"; GroupDescription: "Дополнительные значки:"; Flags: unchecked

          [Files]
          Source: "$release\*"; DestDir: "{app}"; Flags: ignoreversion recursesubdirs createallsubdirs

          [Icons]
          Name: "{group}\Чернограм"; Filename: "{app}\{#MyAppExeName}"
          Name: "{autodesktop}\Чернограм"; Filename: "{app}\{#MyAppExeName}"; Tasks: desktopicon

          [Run]
          Filename: "{app}\{#MyAppExeName}"; Description: "Запустить Чернограм"; Flags: nowait postinstall skipifsilent
          "@
          Set-Content -Path 'chernogram-windows.iss' -Value $iss -Encoding UTF8
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' 'chernogram-windows.iss'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $portableHash = (Get-FileHash 'chernogram-windows-portable.zip' -Algorithm SHA256).Hash.ToLower()
          $installerHash = (Get-FileHash 'Chernogram-Windows-Setup.exe' -Algorithm SHA256).Hash.ToLower()
          $manifest = @{
            versionName = $versionName
            versionFull = $versionFull
            architecture = 'x64'
            minimumWindows = '10'
            portableUrl = 'https://github.com/jeep-jim/chernogram_new/releases/download/latest-windows/chernogram-windows-portable.zip'
            installerUrl = 'https://github.com/jeep-jim/chernogram_new/releases/download/latest-windows/Chernogram-Windows-Setup.exe'
            portableSha256 = $portableHash
            installerSha256 = $installerHash
          } | ConvertTo-Json
          Set-Content -Path 'windows-update.json' -Value $manifest -Encoding UTF8

      - name: Publish Windows release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Continue'
          $versionFull = ((Select-String -Path pubspec.yaml -Pattern '^version:').Line -split '\s+')[1]
          $versionName = ($versionFull -split '\+')[0]
          gh release delete latest-windows --cleanup-tag --yes 2>&1 | Out-Null
          gh release create latest-windows `
            'Chernogram-Windows-Setup.exe' `
            'chernogram-windows-portable.zip' `
            'windows-update.json' `
            --target main `
            --title "Чернограм Windows $versionName" `
            --notes "Первая версия Чернограма для Windows 10/11 x64. В релизе есть обычный установщик EXE и переносимая ZIP-версия. Чаты, файлы, голосовые и WebRTC-звонки используют ту же основу, что и мобильная версия." `
            --prerelease 2>&1 | Tee-Object -FilePath 'windows-release.txt'
          exit $LASTEXITCODE

      - name: Save Windows failure diagnostics
        if: failure()
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          Copy-Item 'windows-build.txt' "$env:TEMP/windows-build.txt" -ErrorAction SilentlyContinue
          Copy-Item 'windows-release.txt' "$env:TEMP/windows-release.txt" -ErrorAction SilentlyContinue
          git fetch origin main
          git reset --hard origin/main
          $lines = @(
            'Windows build failed',
            "Commit: $env:GITHUB_SHA",
            "Time: $([DateTime]::UtcNow.ToString('yyyy-MM-ddTHH:mm:ssZ'))"
          )
          if (Test-Path "$env:TEMP/windows-build.txt") {
            $lines += '===== BUILD OUTPUT ====='
            $lines += Get-Content "$env:TEMP/windows-build.txt"
          }
          if (Test-Path "$env:TEMP/windows-release.txt") {
            $lines += '===== RELEASE OUTPUT ====='
            $lines += Get-Content "$env:TEMP/windows-release.txt"
          }
          Set-Content -Path 'WINDOWS_CI_ERROR.txt' -Value $lines -Encoding UTF8
          git add -f WINDOWS_CI_ERROR.txt
          git commit -m "Сохранить ошибку Windows сборки [skip ci]" 2>$null
          git push origin HEAD:main

      - name: Mark Windows build as ready
        if: success()
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          $versionFull = ((Select-String -Path pubspec.yaml -Pattern '^version:').Line -split '\s+')[1]
          git fetch origin main
          git reset --hard origin/main
          $status = @(
            'Windows ready',
            "Commit: $env:GITHUB_SHA",
            "Time: $([DateTime]::UtcNow.ToString('yyyy-MM-ddTHH:mm:ssZ'))",
            "Version: $versionFull",
            'Architecture: x64',
            'Supported: Windows 10 and Windows 11',
            'Installer: https://github.com/jeep-jim/chernogram_new/releases/download/latest-windows/Chernogram-Windows-Setup.exe',
            'Portable: https://github.com/jeep-jim/chernogram_new/releases/download/latest-windows/chernogram-windows-portable.zip'
          )
          Set-Content -Path 'WINDOWS_BUILD_STATUS.md' -Value $status -Encoding UTF8
          git add WINDOWS_BUILD_STATUS.md
          if (git ls-files --error-unmatch WINDOWS_CI_ERROR.txt 2>$null) {
            git rm -f WINDOWS_CI_ERROR.txt
          }
          git commit -m "Windows версия Чернограма готова [skip ci]" 2>$null
          git push origin HEAD:main
