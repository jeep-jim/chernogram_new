name: Опубликовать Windows 0.24.2 build 62

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-windows-0242-build62.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: publish-windows-0242-build62
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Скачать проверенный артефакт Windows build 62
        uses: actions/download-artifact@v4
        with:
          name: chernogram-windows-0.24.2-build62-validated
          path: dist
          repository: jeep-jim/chernogram_new
          run-id: 30688768931
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Проверить состав и SHA-256
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/chernogram-windows-0.24.2-portable.zip
          test -s dist/Chernogram-Windows-0.24.2-Setup.exe
          PORTABLE_SHA=$(sha256sum dist/chernogram-windows-0.24.2-portable.zip | awk '{print $1}')
          INSTALLER_SHA=$(sha256sum dist/Chernogram-Windows-0.24.2-Setup.exe | awk '{print $1}')
          test "$PORTABLE_SHA" = "8437d2f88474b0a87af928d4f1672cb1a2a532aa94a2349bfa1a98920ae8ae63"
          test "$INSTALLER_SHA" = "dae2e89716b77a190b1684fb8ab372e674dbf82ddf5cefb0cc3af935d32e1307"

      - name: Создать отдельный Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="chernogram-windows-0.24.2-build62"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release delete "$TAG" --yes --cleanup-tag
          fi
          gh release create "$TAG" \
            dist/chernogram-windows-0.24.2-portable.zip \
            dist/Chernogram-Windows-0.24.2-Setup.exe \
            dist/windows-sha256-build62.txt \
            --target main \
            --title "Чернограм Windows 0.24.2 build 62" \
            --notes "Проверенная Windows x64 сборка 0.24.2+62. В Release входят portable ZIP и установщик EXE. SHA-256 проверены перед публикацией."

      - name: Обновить Windows-манифест
        shell: bash
        run: |
          set -euo pipefail
          cat > windows-update.json <<'JSON'
          {
            "versionName": "0.24.2",
            "versionFull": "0.24.2+62",
            "versionCode": 62,
            "architecture": "x64",
            "minimumWindows": "10",
            "portableUrl": "https://github.com/jeep-jim/chernogram_new/releases/download/chernogram-windows-0.24.2-build62/chernogram-windows-0.24.2-portable.zip",
            "portableSha256": "8437d2f88474b0a87af928d4f1672cb1a2a532aa94a2349bfa1a98920ae8ae63",
            "installerUrl": "https://github.com/jeep-jim/chernogram_new/releases/download/chernogram-windows-0.24.2-build62/Chernogram-Windows-0.24.2-Setup.exe",
            "installerSha256": "dae2e89716b77a190b1684fb8ab372e674dbf82ddf5cefb0cc3af935d32e1307",
            "packageType": "portable-zip-and-installer-v6-build62"
          }
          JSON
          python -m json.tool windows-update.json >/dev/null

      - name: Зафиксировать опубликованный Windows build 62
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add windows-update.json
          git commit -m "Windows 0.24.2 build 62 опубликован [skip ci]" || true
          git push origin main
