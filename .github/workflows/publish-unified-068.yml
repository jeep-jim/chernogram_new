name: Чернограм 0.26.0+68 — Android и Windows

on:
  push:
    branches:
      - feature/unified-android-windows-068
    paths:
      - .github/workflows/publish-unified-068.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: chernogram-unified-build68
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.44.8
  VERSION_NAME: 0.26.0
  VERSION_CODE: 68
  VERSION_FULL: 0.26.0+68
  SOURCE_REF: feature/unified-android-windows-068
  ANDROID_TAG: chernogram-0.26.0-build68
  WINDOWS_TAG: chernogram-windows-0.26.0-build68
  SIMPLEX_VERSION: v6.5.6
  SIMPLEX_APK_SHA256: 79ae9650905abf0de50f83d72ee2c8b159feb67e093a6fac30f578a66d0181b6
  CERT_SHA256: F4:A2:C8:36:A8:36:71:19:78:10:FA:6E:98:2D:77:F4:C7:31:D0:9B:18:95:15:C0:13:D0:2D:0D:94:2D:9B:BE

jobs:
  android:
    name: Android — профиль, QR, реакции, фон и статусы
    runs-on: ubuntu-22.04
    timeout-minutes: 110

    steps:
      - name: Получить общую ветку
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_REF }}
          fetch-depth: 0

      - name: Установить Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Установить Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Восстановить постоянную подпись
        uses: actions/cache/restore@v4
        with:
          path: ~/.android/debug.keystore
          key: chernogram-stable-signing-v2
          fail-on-cache-miss: true

      - name: Проверить сертификат
        shell: bash
        run: |
          set -euo pipefail
          test -s "$HOME/.android/debug.keystore"
          keytool -list -v \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android | tee signing-certificate.txt
          ACTUAL=$(grep -m1 'SHA256:' signing-certificate.txt | sed 's/.*SHA256: //' | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')
          EXPECTED=$(printf '%s' "$CERT_SHA256" | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')
          test "$ACTUAL" = "$EXPECTED"

      - name: Применить единый интерфейс build 68
        shell: bash
        run: |
          set -euo pipefail
          if grep -q "import 'device_identity.dart';" lib/core_models.dart \
             && grep -q "case 'read_receipt'" lib/chat_screen.dart \
             && ! grep -q "agent_screen.dart" lib/android_data_first.dart; then
            echo "Патч уже сохранён в ветке"
          else
            python3 tool/apply_unified_068.py
          fi
          dart format \
            lib/main.dart \
            lib/core_models.dart \
            lib/android_data_first.dart \
            lib/chat_screen.dart \
            lib/chat_media.dart \
            lib/app_monitor.dart \
            lib/windows_desktop_app.dart \
            lib/device_identity.dart \
            lib/device_pairing.dart \
            lib/client_settings.dart \
            lib/background_runtime.dart
          grep -q "showChernogramInstallShare" lib/android_data_first.dart
          grep -q "showDesktopRoomPairing" lib/windows_desktop_app.dart
          grep -q "case 'read_receipt'" lib/chat_screen.dart
          grep -q "class _CgInlineCircle" lib/chat_media.dart
          ! grep -R -n -E "Агент и автоматизация|Agent and automation|локальные задачи|local tasks" lib

      - name: Сохранить применённый исходный код в общей ветке
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            lib/core_models.dart \
            lib/android_data_first.dart \
            lib/chat_screen.dart \
            lib/chat_media.dart \
            lib/app_monitor.dart
          if ! git diff --cached --quiet; then
            git commit -m "Применить единый интерфейс и статусы build 68 [skip ci]"
            git push origin HEAD:${SOURCE_REF}
          fi

      - name: Скачать официальное Android-ядро SimpleX
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --retry-delay 3 \
            -o simplex-aarch64.apk \
            "https://github.com/simplex-chat/simplex-chat/releases/download/${SIMPLEX_VERSION}/simplex-aarch64.apk"
          printf '%s  %s\n' "$SIMPLEX_APK_SHA256" simplex-aarch64.apk | sha256sum --check

      - name: Извлечь нативные библиотеки SimpleX
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          import shutil
          import subprocess
          import zipfile

          apk = Path('simplex-aarch64.apk')
          output = Path('android/app/src/main/jniLibs/arm64-v8a')
          if output.exists():
              shutil.rmtree(output)
          output.mkdir(parents=True, exist_ok=True)
          temp = Path('.simplex-libs')
          if temp.exists():
              shutil.rmtree(temp)
          temp.mkdir()
          system = {
              'libandroid.so', 'libc.so', 'libdl.so', 'libEGL.so',
              'libGLESv2.so', 'libjnigraphics.so', 'liblog.so',
              'libm.so', 'libOpenSLES.so', 'libvulkan.so', 'libz.so',
          }
          with zipfile.ZipFile(apk) as archive:
              entries = {
                  Path(name).name: name
                  for name in archive.namelist()
                  if name.startswith('lib/arm64-v8a/') and name.endswith('.so')
              }
              required = ['libapp-lib.so', 'libsimplex.so', 'libsupport.so']
              queue = list(required)
              copied = set()
              while queue:
                  library = queue.pop(0)
                  if library in copied or library in system:
                      continue
                  member = entries.get(library)
                  if member is None:
                      raise RuntimeError(f'Missing native dependency {library}')
                  extracted = Path(archive.extract(member, temp))
                  destination = output / library
                  shutil.copy2(extracted, destination)
                  copied.add(library)
                  dynamic = subprocess.check_output(
                      ['readelf', '-d', str(destination)],
                      text=True,
                      errors='replace',
                  )
                  for dependency in re.findall(
                      r'\(NEEDED\).*Shared library: \[(.+?)\]', dynamic
                  ):
                      if dependency not in copied and dependency not in system:
                          queue.append(dependency)
          for name in required:
              if not (output / name).is_file():
                  raise RuntimeError(f'Native library not extracted: {name}')
          PY

      - name: Получить зависимости, проверить код и тесты
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get
          flutter analyze --no-fatal-infos --no-fatal-warnings
          flutter test

      - name: Собрать Android arm64
        shell: bash
        run: |
          set -o pipefail
          set +e
          flutter build apk --release --target-platform android-arm64 2>&1 | tee android-build.log
          STATUS=${PIPESTATUS[0]}
          set -e
          tail -n 350 android-build.log > android-build-tail.log
          test "$STATUS" = "0"
          test -s build/app/outputs/flutter-apk/app-release.apk

      - name: Подписать и проверить APK
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_APK=build/app/outputs/flutter-apk/app-release.apk
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)
          "$APKSIGNER" sign \
            --ks "$HOME/.android/debug.keystore" \
            --ks-key-alias androiddebugkey \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out chernogram.apk \
            "$SOURCE_APK"
          "$APKSIGNER" verify --print-certs chernogram.apk | tee apk-signature.txt
          ACTUAL=$(grep -m1 'SHA-256 digest:' apk-signature.txt | sed 's/.*digest: //' | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')
          EXPECTED=$(printf '%s' "$CERT_SHA256" | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')
          test "$ACTUAL" = "$EXPECTED"
          "$AAPT" dump badging chernogram.apk | tee apk-badging.txt
          grep -q "package: name='com.example.chernogram'" apk-badging.txt
          grep -q "versionCode='68'" apk-badging.txt
          grep -q "versionName='0.26.0'" apk-badging.txt
          grep -q "application-label:'Чернограм'" apk-badging.txt
          unzip -l chernogram.apk | tee apk-files.txt
          grep -q 'lib/arm64-v8a/libapp-lib.so' apk-files.txt
          grep -q 'lib/arm64-v8a/libsimplex.so' apk-files.txt
          grep -q 'lib/arm64-v8a/libsupport.so' apk-files.txt
          sha256sum chernogram.apk | tee apk-sha256.txt

      - name: Создать манифест обновления Android
        shell: bash
        run: |
          set -euo pipefail
          SHA=$(cut -d' ' -f1 apk-sha256.txt)
          cat > update-build68.json <<EOF
          {
            "versionName": "${VERSION_NAME}",
            "versionCode": ${VERSION_CODE},
            "apkUrl": "https://github.com/${GITHUB_REPOSITORY}/releases/download/latest-apk/chernogram.apk?v=${VERSION_CODE}",
            "sha256": "${SHA}",
            "certificateSha256": "${CERT_SHA256}",
            "notesRu": "Убраны агент и внутренние тексты. Возвращена утверждённая маска. Добавлены QR установки и подключения Windows, устойчивый ID устройства, настройки профиля, реакции одним нажатием, удаление по удерживанию, статусы прочтения, онлайн-точки, круглые видео без облачка и фоновая доставка сообщений и звонков.",
            "notesEn": "Removed agent and internal roadmap text. Restored the approved mask icon. Added install and desktop pairing QR codes, stable device ID, profile settings, quick reactions, long-press deletion, read receipts, online dots, inline circular video and background message/call delivery."
          }
          EOF
          python3 -m json.tool update-build68.json >/dev/null

      - name: Опубликовать Android Release и актуальную ссылку
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release delete "$ANDROID_TAG" --cleanup-tag -y || true
          gh release create "$ANDROID_TAG" \
            chernogram.apk \
            update-build68.json \
            apk-sha256.txt \
            apk-signature.txt \
            apk-badging.txt \
            --target "$SOURCE_REF" \
            --title "Чернограм 0.26.0+68 — профиль, QR, статусы и фон" \
            --notes "Android build 68: рабочая связь build 66 сохранена; добавлены профиль устройства, QR, реакции, прочтение, онлайн, круги и фоновая доставка."
          gh release delete latest-apk --cleanup-tag -y || true
          gh release create latest-apk \
            chernogram.apk \
            update-build68.json \
            --target "$SOURCE_REF" \
            --title "Чернограм — актуальная Android-версия 0.26.0+68" \
            --notes "Стабильная тестовая Android-сборка build 68."

      - name: Включить обновление build 68
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch origin main
          rm -rf /tmp/chernogram-main-68
          git worktree add -B publish-build68 /tmp/chernogram-main-68 origin/main
          cd /tmp/chernogram-main-68
          cp "$GITHUB_WORKSPACE/update-build68.json" update.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add update.json
          git commit -m "Включить обновление Чернограма 0.26.0+68 [skip ci]"
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main
            sleep 3
          done
          exit 1

      - name: Выдать Android APK и диагностику
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chernogram-android-0.26.0-build68
          path: |
            chernogram.apk
            update-build68.json
            apk-sha256.txt
            apk-signature.txt
            apk-badging.txt
            android-build-tail.log
          if-no-files-found: warn
          retention-days: 14

  windows:
    name: Windows — единый интерфейс комнат и файлов
    runs-on: windows-2022
    timeout-minutes: 110

    steps:
      - name: Получить общую ветку
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_REF }}
          fetch-depth: 0

      - name: Установить Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Применить единый интерфейс build 68
        shell: pwsh
        run: |
          $already = (Select-String -Path lib/core_models.dart -Pattern "device_identity.dart" -Quiet) -and
                     (Select-String -Path lib/chat_screen.dart -Pattern "case 'read_receipt'" -Quiet) -and
                     -not (Select-String -Path lib/android_data_first.dart -Pattern "agent_screen.dart" -Quiet)
          if (-not $already) {
            python tool/apply_unified_068.py
          }
          dart format lib/main.dart lib/core_models.dart lib/android_data_first.dart lib/chat_screen.dart lib/chat_media.dart lib/app_monitor.dart lib/windows_desktop_app.dart lib/device_identity.dart lib/device_pairing.dart lib/client_settings.dart lib/background_runtime.dart

      - name: Создать утверждённую маску для Windows EXE
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check pillow
          @'
          from PIL import Image, ImageDraw
          from pathlib import Path
          import math

          size = 256
          image = Image.new('RGBA', (size, size), (7, 10, 18, 255))
          draw = ImageDraw.Draw(image)
          colors = [
              '#B9A8FF','#AE98FF','#A087FF','#9277FF','#8668FF',
              '#7B5CFF','#715FFB','#666AF8','#5B78F4','#5088F1',
              '#4599EE','#3BA9EC','#31B7EC','#27C1F3','#20C7FF'
          ]
          count = len(colors)
          for i, color in enumerate(colors):
              t = i / (count - 1)
              nx = t * 2 - 1
              x = 48 + t * 160
              ellipse = math.sqrt(max(0, 1 - nx * nx))
              top = 38 + (1 - ellipse) * 25
              bottom = 124 + ellipse * 92 - abs(nx) * 8
              width = 8
              eye_gap = .17 < abs(nx) < .72
              if eye_gap:
                  draw.line((x, top, x, 96), fill=color, width=width)
                  draw.line((x, 116, x, bottom), fill=color, width=width)
              else:
                  draw.line((x, top, x, bottom), fill=color, width=width)
              draw.ellipse((x-width/2, top-width/2, x+width/2, top+width/2), fill=color)
              draw.ellipse((x-width/2, bottom-width/2, x+width/2, bottom+width/2), fill=color)
          target = Path('windows/runner/resources/app_icon.ico')
          target.parent.mkdir(parents=True, exist_ok=True)
          image.save(target, format='ICO', sizes=[(16,16),(32,32),(48,48),(64,64),(128,128),(256,256)])
          '@ | Set-Content -Encoding UTF8 make_windows_icon.py
          python make_windows_icon.py
          Test-Path windows/runner/resources/app_icon.ico

      - name: Получить зависимости, проверить код и тесты
        shell: pwsh
        run: |
          flutter config --enable-windows-desktop
          flutter pub get
          flutter analyze --no-fatal-infos --no-fatal-warnings
          flutter test

      - name: Собрать Windows x64
        shell: pwsh
        run: |
          flutter build windows --release 2>&1 | Tee-Object -FilePath windows-build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $release = 'build/windows/x64/runner/Release'
          if (-not (Test-Path "$release/chernogram.exe")) { throw 'chernogram.exe not found' }
          Compress-Archive -Path "$release/*" -DestinationPath 'chernogram-windows-0.26.0-portable.zip' -Force

      - name: Создать установщик EXE
        shell: pwsh
        run: |
          $release = (Resolve-Path 'build/windows/x64/runner/Release').Path
          $icon = (Resolve-Path 'windows/runner/resources/app_icon.ico').Path
          $iss = @"
          [Setup]
          AppId={{7D440E55-6347-4EF8-8B49-2868B0D4A068}
          AppName=Чернограм
          AppVersion=0.26.0
          AppPublisher=Чернограм
          DefaultDirName={autopf}\Чернограм
          DefaultGroupName=Чернограм
          OutputDir=$env:GITHUB_WORKSPACE
          OutputBaseFilename=Chernogram-Windows-0.26.0-Setup
          SetupIconFile=$icon
          UninstallDisplayIcon={app}\chernogram.exe
          Compression=lzma2
          SolidCompression=yes
          ArchitecturesAllowed=x64compatible
          ArchitecturesInstallIn64BitMode=x64compatible
          WizardStyle=modern
          PrivilegesRequired=lowest

          [Files]
          Source: "$release\*"; DestDir: "{app}"; Flags: ignoreversion recursesubdirs createallsubdirs

          [Icons]
          Name: "{autoprograms}\Чернограм"; Filename: "{app}\chernogram.exe"
          Name: "{autodesktop}\Чернограм"; Filename: "{app}\chernogram.exe"; Tasks: desktopicon

          [Tasks]
          Name: "desktopicon"; Description: "Создать ярлык на рабочем столе"; GroupDescription: "Ярлыки:"; Flags: unchecked

          [Run]
          Filename: "{app}\chernogram.exe"; Description: "Запустить Чернограм"; Flags: nowait postinstall skipifsilent
          "@
          Set-Content -Path installer.iss -Value $iss -Encoding UTF8
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          & $iscc installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-FileHash Chernogram-Windows-0.26.0-Setup.exe -Algorithm SHA256 | Format-List | Out-File windows-setup-sha256.txt
          Get-FileHash chernogram-windows-0.26.0-portable.zip -Algorithm SHA256 | Format-List | Out-File windows-portable-sha256.txt

      - name: Опубликовать Windows Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete $env:WINDOWS_TAG --cleanup-tag -y 2>$null
          gh release create $env:WINDOWS_TAG `
            Chernogram-Windows-0.26.0-Setup.exe `
            chernogram-windows-0.26.0-portable.zip `
            windows-setup-sha256.txt `
            windows-portable-sha256.txt `
            --target $env:SOURCE_REF `
            --title "Чернограм Windows 0.26.0+68" `
            --notes "Тот же Чернограм, что на Android: комнаты слева, чат в центре, участники и файлы справа. Подключение к комнате через QR с телефона, общий и закрытый доступ к файлам, профиль и настройки."

      - name: Выдать Windows установщик и portable
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chernogram-windows-0.26.0-build68
          path: |
            Chernogram-Windows-0.26.0-Setup.exe
            chernogram-windows-0.26.0-portable.zip
            windows-setup-sha256.txt
            windows-portable-sha256.txt
            windows-build.log
          if-no-files-found: warn
          retention-days: 14
