name: Контроль Impulse build 74

on:
  pull_request:
    branches: [main]
    paths:
      - TRIGGER_IMPULSE_074.md

permissions:
  actions: write
  contents: read

jobs:
  trigger:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Запустить проверку нового транспорта
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BEFORE=$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow check-impulse-074.yml \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId // 0')
          gh workflow run check-impulse-074.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main
          for attempt in $(seq 1 25); do
            sleep 2
            RUN_ID=$(gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow check-impulse-074.yml \
              --limit 1 \
              --json databaseId \
              --jq '.[0].databaseId // 0')
            if [ "$RUN_ID" != "0" ] && [ "$RUN_ID" != "$BEFORE" ]; then
              echo "Impulse build 74 check: $RUN_ID"
              exit 0
            fi
          done
          exit 1
