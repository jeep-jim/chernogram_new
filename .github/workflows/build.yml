name: Validate Music Player v2

on:
  push:
    branches:
      - feature/music-player-v2
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cernogram-music-player-v2
  cancel-in-progress: true

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/music-player-v2
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.8"
          channel: stable
          cache: false

      - name: Apply compile-safe player fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('lib/music_player.dart')
          source = path.read_text(encoding='utf-8')
          if "import 'dart:ui';" not in source:
              source = source.replace(
                  "import 'dart:math' as math;\n",
                  "import 'dart:math' as math;\nimport 'dart:ui';\n",
                  1,
              )
          source = source.replace(
              """    await Future.wait<void>(<Future<void>>[
      prefs.remove(_queueKey),
      prefs.remove(_activePathKey),
      prefs.remove(_positionKey),
    ]);""",
              """    await prefs.remove(_queueKey);
    await prefs.remove(_activePathKey);
    await prefs.remove(_positionKey);""",
          )
          path.write_text(source, encoding='utf-8')
          PY

      - name: Validate Flutter player
        shell: bash
        run: |
          set -euo pipefail
          {
            flutter pub get
            dart format lib/music_player.dart
            flutter analyze --no-fatal-infos --no-fatal-warnings
            flutter test
          } 2>&1 | tee music-player-ci.txt

      - name: Commit validated player
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cat > MUSIC_PLAYER_CI_STATUS.md <<EOF
          Music Player v2 ready
          Commit: ${GITHUB_SHA}
          Time: $(date -u +'%Y-%m-%dT%H:%M:%SZ')
          Features: source filters, elapsed/remaining, shuffle, repeat, queue and position restore, hard close
          EOF
          git add lib/music_player.dart MUSIC_PLAYER_CI_STATUS.md
          if git ls-files --error-unmatch MUSIC_PLAYER_CI_ERROR.txt >/dev/null 2>&1; then
            git rm -f MUSIC_PLAYER_CI_ERROR.txt
          fi
          git commit -m "Расширить музыкальный плеер Cernogram v2" || true
          git push origin HEAD:feature/music-player-v2 || true

      - name: Save player failure diagnostics
        if: failure()
        shell: bash
        run: |
          set +e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp music-player-ci.txt /tmp/music-player-ci.txt 2>/dev/null || true
          git fetch origin feature/music-player-v2
          git reset --hard origin/feature/music-player-v2
          {
            echo 'Music Player v2 validation failed'
            echo "Commit: ${GITHUB_SHA}"
            echo "Time: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            if [ -f /tmp/music-player-ci.txt ]; then cat /tmp/music-player-ci.txt; fi
          } > MUSIC_PLAYER_CI_ERROR.txt
          git add -f MUSIC_PLAYER_CI_ERROR.txt
          git commit -m "Сохранить ошибку Music Player CI [skip ci]" || true
          git push origin HEAD:feature/music-player-v2 || true
