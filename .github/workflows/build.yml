name: Validate Chat Patterns v1

on:
  push:
    branches:
      - feature/chat-patterns-v1
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cernogram-chat-patterns-v1
  cancel-in-progress: true

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/chat-patterns-v1
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.8"
          channel: stable
          cache: false

      - name: Connect lightweight patterns to chat
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          patterns = Path('lib/chat_patterns.dart')
          text = patterns.read_text(encoding='utf-8')
          text = text.replace(
              "alpha: math.min(1, color.a + .18)",
              "alpha: math.min(1.0, color.a + .18).toDouble()",
          )
          patterns.write_text(text, encoding='utf-8')

          path = Path('lib/chat_screen.dart')
          source = path.read_text(encoding='utf-8')

          def replace_once(old, new, label):
              global source
              if new in source:
                  return
              if old not in source:
                  raise SystemExit(f'{label}: source block not found')
              source = source.replace(old, new, 1)

          replace_once(
              "import 'chat_media.dart';\n",
              "import 'chat_media.dart';\nimport 'chat_patterns.dart';\n",
              'chat patterns import',
          )
          replace_once(
              """                case 'settings':
                  _showSettings();
                  break;
""",
              """                case 'appearance':
                  Navigator.push<void>(
                    context,
                    MaterialPageRoute(
                      builder: (_) => CgChatPatternSettingsScreen(ru: widget.ru),
                    ),
                  );
                  break;
                case 'settings':
                  _showSettings();
                  break;
""",
              'appearance menu handler',
          )
          replace_once(
              """              PopupMenuItem(
                value: 'settings',
                child: ListTile(
                  leading: const Icon(Icons.tune_rounded),
                  title: Text(
                    widget.ru ? 'Настройки чата' : 'Chat settings',
                  ),
                ),
              ),
""",
              """              PopupMenuItem(
                value: 'appearance',
                child: ListTile(
                  leading: const Icon(Icons.wallpaper_rounded),
                  title: Text(widget.ru ? 'Фон чатов' : 'Chat background'),
                ),
              ),
              PopupMenuItem(
                value: 'settings',
                child: ListTile(
                  leading: const Icon(Icons.tune_rounded),
                  title: Text(
                    widget.ru ? 'Настройки чата' : 'Chat settings',
                  ),
                ),
              ),
""",
              'appearance menu item',
          )
          replace_once(
              """      body: DropTarget(
        enable: Platform.isWindows || Platform.isLinux || Platform.isMacOS,
""",
              """      body: Stack(
        children: [
          const Positioned.fill(child: CgChatPatternLayer()),
          DropTarget(
        enable: Platform.isWindows || Platform.isLinux || Platform.isMacOS,
""",
              'pattern stack start',
          )
          replace_once(
              """        ],
      ),
      ),
    );
""",
              """        ],
      ),
      ),
        ],
      ),
    );
""",
              'pattern stack end',
          )
          path.write_text(source, encoding='utf-8')
          PY

      - name: Validate Flutter pattern implementation
        shell: bash
        run: |
          set -euo pipefail
          {
            flutter pub get
            dart format lib/chat_patterns.dart lib/chat_screen.dart
            flutter analyze --no-fatal-infos --no-fatal-warnings
            flutter test
          } 2>&1 | tee chat-patterns-ci.txt

      - name: Commit validated patterns
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cat > CHAT_PATTERNS_CI_STATUS.md <<EOF
          Chat Patterns v1 ready
          Commit: ${GITHUB_SHA}
          Time: $(date -u +'%Y-%m-%dT%H:%M:%SZ')
          Patterns: Cernogram masks, waves, constellations, dots; separate light/dark switches
          Rendering: lightweight CustomPainter
          EOF
          git add lib/chat_patterns.dart lib/chat_screen.dart CHAT_PATTERNS_CI_STATUS.md
          if git ls-files --error-unmatch CHAT_PATTERNS_CI_ERROR.txt >/dev/null 2>&1; then
            git rm -f CHAT_PATTERNS_CI_ERROR.txt
          fi
          git commit -m "Добавить паттерны фона чатов для светлой и тёмной темы" || true
          git push origin HEAD:feature/chat-patterns-v1 || true

      - name: Save pattern failure diagnostics
        if: failure()
        shell: bash
        run: |
          set +e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp chat-patterns-ci.txt /tmp/chat-patterns-ci.txt 2>/dev/null || true
          git fetch origin feature/chat-patterns-v1
          git reset --hard origin/feature/chat-patterns-v1
          {
            echo 'Chat Patterns v1 validation failed'
            echo "Commit: ${GITHUB_SHA}"
            echo "Time: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            if [ -f /tmp/chat-patterns-ci.txt ]; then cat /tmp/chat-patterns-ci.txt; fi
          } > CHAT_PATTERNS_CI_ERROR.txt
          git add -f CHAT_PATTERNS_CI_ERROR.txt
          git commit -m "Сохранить ошибку Chat Patterns CI [skip ci]" || true
          git push origin HEAD:feature/chat-patterns-v1 || true
