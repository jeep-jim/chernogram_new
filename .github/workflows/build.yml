name: Validate Music Recognition v1

on:
  push:
    branches:
      - feature/music-recognition-v1
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cernogram-music-recognition-v1
  cancel-in-progress: true

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/music-recognition-v1
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.8"
          channel: stable
          cache: false

      - name: Validate Python fingerprint service
        working-directory: server/music_recognition
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r requirements.txt
          python -m compileall app.py test_app.py
          python -m unittest -v test_app.py

      - name: Build Music Recognition Docker image
        working-directory: server/music_recognition
        shell: bash
        run: |
          set -euo pipefail
          docker build -t cernogram-music-recognition:ci . 2>&1 | tee recognition-ci.txt

      - name: Validate Flutter recognition client
        shell: bash
        run: |
          set -euo pipefail
          {
            flutter pub get
            dart format lib/music_recognition.dart
            flutter analyze --no-fatal-infos --no-fatal-warnings
            flutter test
          } 2>&1 | tee -a server/music_recognition/recognition-ci.txt

      - name: Commit validated recognition feature
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cat > MUSIC_RECOGNITION_CI_STATUS.md <<EOF
          Music Recognition v1 ready
          Commit: ${GITHUB_SHA}
          Time: $(date -u +'%Y-%m-%dT%H:%M:%SZ')
          Engine: open-source Chromaprint/fpcalc
          Catalog: JSON chunks of 500 indexed tracks
          Privacy: uploaded recognition sample is deleted after fingerprinting
          Checks: Python tests, Docker build, Flutter analyze/tests
          EOF
          git add server/music_recognition lib/music_recognition.dart MUSIC_RECOGNITION_CI_STATUS.md
          if git ls-files --error-unmatch MUSIC_RECOGNITION_CI_ERROR.txt >/dev/null 2>&1; then
            git rm -f MUSIC_RECOGNITION_CI_ERROR.txt
          fi
          git commit -m "Добавить распознавание музыки через Chromaprint" || true
          git push origin HEAD:feature/music-recognition-v1 || true

      - name: Save recognition failure diagnostics
        if: failure()
        shell: bash
        run: |
          set +e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp server/music_recognition/recognition-ci.txt /tmp/recognition-ci.txt 2>/dev/null || true
          git fetch origin feature/music-recognition-v1
          git reset --hard origin/feature/music-recognition-v1
          {
            echo 'Music Recognition v1 validation failed'
            echo "Commit: ${GITHUB_SHA}"
            echo "Time: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            if [ -f /tmp/recognition-ci.txt ]; then cat /tmp/recognition-ci.txt; fi
          } > MUSIC_RECOGNITION_CI_ERROR.txt
          git add -f MUSIC_RECOGNITION_CI_ERROR.txt
          git commit -m "Сохранить ошибку Music Recognition CI [skip ci]" || true
          git push origin HEAD:feature/music-recognition-v1 || true
