name: Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: chernogram-apk-main
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Mark build as started
        run: |
          echo "Build started for ${GITHUB_SHA} at $(date -u +'%Y-%m-%dT%H:%M:%SZ')" > BUILD_STATUS.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add BUILD_STATUS.md
          git commit -m "Сборка APK запущена [skip ci]"
          git push origin HEAD:main

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Restore prototype signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: chernogram-prototype-signing-v1

      - name: Setup Flutter 3.44.8
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.8"
          channel: stable
          cache: false

      - name: Build with diagnostics
        shell: bash
        run: |
          set +e
          {
            flutter --version
            python3 tooling/prepare_build.py
            dart format lib/main.dart lib/update_service.dart
            flutter pub get
            flutter build apk --release
          } 2>&1 | tee BUILD_ERROR.log
          STATUS=${PIPESTATUS[0]}

          if [ "$STATUS" -ne 0 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add BUILD_ERROR.log
            git commit -m "Сохранить лог ошибки сборки [skip ci]" || true
            git push origin HEAD:main || true
            exit "$STATUS"
          fi

          rm -f BUILD_ERROR.log

      - name: Save prepared source files
        run: |
          git add lib/main.dart lib/update_service.dart
          if git diff --cached --quiet; then
            echo "Updater source files are already prepared."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Подключить интерфейс автообновления [skip ci]"
          git push origin HEAD:main

      - name: Prepare release files
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk chernogram.apk
          VERSION_FULL=$(awk '/^version:/ {print $2}' pubspec.yaml)
          VERSION_NAME=${VERSION_FULL%%+*}
          VERSION_CODE=${VERSION_FULL##*+}
          APK_SHA256=$(sha256sum chernogram.apk | awk '{print $1}')
          cat > update.json <<EOF
          {
            "versionName": "${VERSION_NAME}",
            "versionCode": ${VERSION_CODE},
            "apkUrl": "https://github.com/jeep-jim/chernogram_new/releases/download/latest-apk/chernogram.apk?v=${VERSION_CODE}",
            "sha256": "${APK_SHA256}",
            "notesRu": "Новая версия Чернограма: автообновление одной кнопкой, автоматическая проверка при запуске и улучшения приложения.",
            "notesEn": "A new Chernogram version: one-tap updates, automatic update checks on launch, and app improvements."
          }
          EOF
          cat update.json

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: chernogram-apk
          path: |
            chernogram.apk
            update.json
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest-apk --cleanup-tag --yes || true
          gh release create latest-apk chernogram.apk update.json \
            --target "$GITHUB_SHA" \
            --title "Чернограм — тестовая APK" \
            --notes "Автоматически собранная тестовая версия приложения для Android." \
            --prerelease

      - name: Mark build as ready
        run: |
          cat > BUILD_STATUS.md <<EOF
          Build ready for ${GITHUB_SHA} at $(date -u +'%Y-%m-%dT%H:%M:%SZ')
          Version: $(awk '/^version:/ {print $2}' pubspec.yaml)
          Download: https://github.com/jeep-jim/chernogram_new/releases/download/latest-apk/chernogram.apk
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add BUILD_STATUS.md
          git commit -m "APK готов к скачиванию [skip ci]"
          git push origin HEAD:main
