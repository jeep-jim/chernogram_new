name: Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: chernogram-apk-main
  cancel-in-progress: true

jobs:
  build:
    name: Build Android Test APK
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Apply Chernogram 0.5 changes
        shell: bash
        run: |
          set -e
          python3 tooling/apply_05.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib pubspec.yaml
          if ! git diff --cached --quiet; then
            git commit -m "Чернограм 0.5: QR, аватарки и права туннеля [skip ci]"
            git push origin HEAD:main
          fi

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Restore prototype signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: chernogram-prototype-signing-v1

      - name: Setup Flutter 3.44.8
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.8"
          channel: stable
          cache: false

      - name: Validate and build APK
        id: build_apk
        shell: bash
        run: |
          set +e
          set -o pipefail
          {
            flutter --version
            dart format lib
            flutter pub get
            flutter analyze --no-fatal-infos --no-fatal-warnings
            flutter test
            flutter build apk --debug
          } 2>&1 | tee ci-build.txt
          STATUS=${PIPESTATUS[0]}
          exit "$STATUS"

      - name: Prepare update files
        shell: bash
        run: |
          set -e
          cp build/app/outputs/flutter-apk/app-debug.apk chernogram.apk
          VERSION_FULL=$(awk '/^version:/ {print $2}' pubspec.yaml)
          VERSION_NAME=${VERSION_FULL%%+*}
          VERSION_CODE=${VERSION_FULL##*+}
          APK_SHA256=$(sha256sum chernogram.apk | awk '{print $1}')
          cat > update.json <<EOF
          {
            "versionName": "${VERSION_NAME}",
            "versionCode": ${VERSION_CODE},
            "apkUrl": "https://github.com/jeep-jim/chernogram_new/releases/download/latest-apk/chernogram.apk?v=${VERSION_CODE}",
            "sha256": "${APK_SHA256}",
            "notesRu": "Чернограм 0.5: QR-код туннеля, локальные аватарки, права собеседника и исправленный переход к системной установке обновлений.",
            "notesEn": "Chernogram 0.5: tunnel QR codes, local avatars, guest permissions and an improved Android update installation flow."
          }
          EOF

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: chernogram-apk
          path: |
            chernogram.apk
            update.json
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK to GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          set -o pipefail
          VERSION_FULL=$(awk '/^version:/ {print $2}' pubspec.yaml)
          VERSION_NAME=${VERSION_FULL%%+*}
          {
            gh release delete latest-apk --cleanup-tag --yes || true
            gh release create latest-apk chernogram.apk update.json \
              --target main \
              --title "Чернограм ${VERSION_NAME} — QR и аватарки" \
              --notes "Тестовая Android-версия: QR туннелей, аватарки, права доступа и улучшенное обновление." \
              --prerelease
          } 2>&1 | tee ci-release.txt
          STATUS=${PIPESTATUS[0]}
          exit "$STATUS"

      - name: Save exact failure diagnostics
        if: failure()
        shell: bash
        run: |
          {
            echo "GitHub Actions build failed"
            echo "Commit: ${GITHUB_SHA}"
            echo "Time: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo
            if [ -f ci-build.txt ]; then
              echo "===== BUILD OUTPUT ====="
              cat ci-build.txt
            fi
            if [ -f ci-release.txt ]; then
              echo
              echo "===== RELEASE OUTPUT ====="
              cat ci-release.txt
            fi
          } > CI_ERROR.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main || true
          git add -f CI_ERROR.txt
          git commit -m "Сохранить точную ошибку сборки 0.5 [skip ci]" || true
          git push origin HEAD:main || true

      - name: Mark APK as ready
        if: success()
        shell: bash
        run: |
          cat > BUILD_STATUS.md <<EOF
          APK ready
          Commit: ${GITHUB_SHA}
          Time: $(date -u +'%Y-%m-%dT%H:%M:%SZ')
          Version: $(awk '/^version:/ {print $2}' pubspec.yaml)
          Download: https://github.com/jeep-jim/chernogram_new/releases/download/latest-apk/chernogram.apk
          EOF
          rm -f CI_ERROR.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main || true
          git add -A BUILD_STATUS.md CI_ERROR.txt
          git commit -m "APK 0.5 готов к скачиванию [skip ci]" || true
          git push origin HEAD:main || true
