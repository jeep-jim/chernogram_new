name: Publish Cernogram Experience Suite

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cernogram-experience-release-020
  cancel-in-progress: true

env:
  SOURCE_BRANCH: feature/experience-suite-020
  EXPECTED_CERT_SHA256: "F4:A2:C8:36:A8:36:71:19:78:10:FA:6E:98:2D:77:F4:C7:31:D0:9B:18:95:15:C0:13:D0:2D:0D:94:2D:9B:BE"

jobs:
  android:
    name: Publish Android 0.20
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Checkout validated source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_BRANCH }}
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Restore permanent signing key
        uses: actions/cache/restore@v4
        with:
          path: ~/.android/debug.keystore
          key: chernogram-stable-signing-v2
          fail-on-cache-miss: false

      - name: Restore key backup and verify certificate
        shell: bash
        env:
          CHERNOGRAM_KEYSTORE_B64: ${{ secrets.CHERNOGRAM_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          if [ -n "${CHERNOGRAM_KEYSTORE_B64:-}" ]; then
            printf '%s' "$CHERNOGRAM_KEYSTORE_B64" | base64 --decode > "$HOME/.android/debug.keystore"
            chmod 600 "$HOME/.android/debug.keystore"
          fi
          test -s "$HOME/.android/debug.keystore" || { echo '::error::Signing key unavailable'; exit 1; }
          keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android | tee signing-key.txt
          ACTUAL=$(grep -m1 'SHA256:' signing-key.txt | sed 's/.*SHA256: //' | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')
          EXPECTED=$(printf '%s' "$EXPECTED_CERT_SHA256" | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')
          test "$ACTUAL" = "$EXPECTED" || { echo '::error::Signing fingerprint mismatch'; exit 1; }

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.8"
          channel: stable
          cache: false

      - name: Validate and build Android
        shell: bash
        run: |
          set -euo pipefail
          flutter --version
          flutter pub get
          dart format --output=none --set-exit-if-changed lib
          flutter analyze --no-fatal-infos --no-fatal-warnings
          flutter test
          flutter build apk --release

      - name: Re-sign and verify APK
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_APK=build/app/outputs/flutter-apk/app-release.apk
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          test -n "$APKSIGNER"
          "$APKSIGNER" sign \
            --ks "$HOME/.android/debug.keystore" \
            --ks-key-alias androiddebugkey \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out chernogram.apk \
            "$SOURCE_APK"
          "$APKSIGNER" verify --print-certs chernogram.apk | tee apk-signature.txt
          APK_CERT=$(sed -n -e 's/^Signer #1 certificate SHA-256 digest: //p' -e 's/^V2 Signer: certificate SHA-256 digest: //p' -e 's/^V3.0 Signer: certificate SHA-256 digest: //p' apk-signature.txt | head -n 1 | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')
          EXPECTED=$(printf '%s' "$EXPECTED_CERT_SHA256" | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')
          test -n "$APK_CERT" && test "$APK_CERT" = "$EXPECTED"

      - name: Prepare Android manifest
        shell: bash
        run: |
          set -euo pipefail
          VERSION_FULL=$(awk '/^version:/ {print $2}' pubspec.yaml)
          VERSION_NAME=${VERSION_FULL%%+*}
          VERSION_CODE=${VERSION_FULL##*+}
          APK_SHA256=$(sha256sum chernogram.apk | awk '{print $1}')
          cat > update.json <<EOF
          {
            "versionName": "${VERSION_NAME}",
            "versionCode": ${VERSION_CODE},
            "apkUrl": "https://github.com/jeep-jim/chernogram_new/releases/download/latest-apk/chernogram.apk?v=${VERSION_CODE}",
            "sha256": "${APK_SHA256}",
            "certificateSha256": "${EXPECTED_CERT_SHA256}",
            "notesRu": "Experience Suite 0.20: новый цифровой Агент с голосом и потоковыми ответами, полноценная музыкальная медиатека с очередью, плейлистами, repeat/shuffle и восстановлением позиции, телефонная книга и набор номера. Связь и утверждённая иконка в этом выпуске не изменялись.",
            "notesEn": "Experience Suite 0.20 adds the voice-enabled streaming Agent, a full music library with queues, playlists, repeat/shuffle and position restore, plus the device phone book and dialer. Realtime transport and the approved icon are unchanged in this release."
          }
          EOF

      - name: Publish Android update
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION_FULL=$(awk '/^version:/ {print $2}' pubspec.yaml)
          VERSION_NAME=${VERSION_FULL%%+*}
          gh release delete latest-apk --cleanup-tag --yes || true
          gh release create latest-apk chernogram.apk update.json \
            --target "$SOURCE_BRANCH" \
            --title "Cernogram ${VERSION_NAME}" \
            --notes "Experience Suite: Агент, музыка, медиатека, плейлисты, телефонная книга и набор номера. Иконка и транспорт связи не изменялись." \
            --prerelease

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: cernogram-android-0.20
          path: |
            chernogram.apk
            update.json
          retention-days: 14

  windows:
    name: Publish Windows 0.20
    runs-on: windows-latest
    timeout-minutes: 55

    steps:
      - name: Checkout validated source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_BRANCH }}
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.8"
          channel: stable
          cache: false

      - name: Validate and build Windows
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          flutter --version
          flutter config --enable-windows-desktop
          if (-not (Test-Path 'windows/CMakeLists.txt')) {
            flutter create --platforms=windows --project-name chernogram --no-pub .
          }
          flutter pub get
          dart format --output=none --set-exit-if-changed lib
          flutter analyze --no-fatal-infos --no-fatal-warnings
          flutter test
          flutter build windows --release

      - name: Smoke test Windows executable
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $release = Join-Path $PWD 'build/windows/x64/runner/Release'
          $exe = Join-Path $release 'chernogram.exe'
          if (-not (Test-Path $exe)) { throw 'chernogram.exe was not produced' }
          $process = Start-Process -FilePath $exe -WorkingDirectory $release -PassThru
          Start-Sleep -Seconds 8
          if ($process.HasExited) { throw "Cernogram exited during startup smoke test: $($process.ExitCode)" }
          Stop-Process -Id $process.Id -Force

      - name: Package Windows portable update
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $release = Join-Path $PWD 'build/windows/x64/runner/Release'
          $stage = Join-Path $PWD 'app'
          if (Test-Path $stage) { Remove-Item $stage -Recurse -Force }
          New-Item -ItemType Directory -Path $stage | Out-Null
          Copy-Item (Join-Path $release '*') $stage -Recurse -Force
          Compress-Archive -Path $stage -DestinationPath 'Cernogram-Windows-x64.zip' -Force

          $versionFull = ((Select-String -Path pubspec.yaml -Pattern '^version:').Line -split '\s+')[1]
          $versionName = ($versionFull -split '\+')[0]
          $sha = (Get-FileHash 'Cernogram-Windows-x64.zip' -Algorithm SHA256).Hash.ToLowerInvariant()
          $manifest = [ordered]@{
            versionName = $versionName
            versionFull = $versionFull
            portableUrl = "https://github.com/jeep-jim/chernogram_new/releases/download/latest-windows/Cernogram-Windows-x64.zip"
            portableSha256 = $sha
          }
          $manifest | ConvertTo-Json | Set-Content -Path 'windows-update.json' -Encoding UTF8

      - name: Publish Windows update
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $versionFull = ((Select-String -Path pubspec.yaml -Pattern '^version:').Line -split '\s+')[1]
          $versionName = ($versionFull -split '\+')[0]
          gh release delete latest-windows --cleanup-tag --yes 2>$null
          if ($LASTEXITCODE -ne 0) { $global:LASTEXITCODE = 0 }
          gh release create latest-windows Cernogram-Windows-x64.zip windows-update.json `
            --target "$env:SOURCE_BRANCH" `
            --title "Cernogram Windows $versionName" `
            --notes "Experience Suite для Windows: Агент, музыкальная медиатека, плейлисты и расширенный плеер." `
            --prerelease

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: cernogram-windows-0.20
          path: |
            Cernogram-Windows-x64.zip
            windows-update.json
          retention-days: 14
