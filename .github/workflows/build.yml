name: Validate Contact Profile v1

on:
  push:
    branches:
      - feature/contact-profile-v1
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cernogram-contact-profile-v1
  cancel-in-progress: true

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/contact-profile-v1
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.8"
          channel: stable
          cache: false

      - name: Apply prepared contact-profile patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/apply-contact-profile-v1.yml').read_text(encoding='utf-8')
          start_marker = "          python3 - <<'PY'\n"
          end_marker = "\n          PY"
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index(end_marker, start)
          block = workflow[start:end]
          script = '\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in block.splitlines()
          )
          exec(compile(script, 'apply_contact_profile_v1.py', 'exec'), {})
          PY

      - name: Validate Flutter source
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get
          dart format lib/v12.dart lib/chat_screen.dart lib/contact_policy.dart lib/contact_profile_screen.dart
          flutter analyze --no-fatal-infos --no-fatal-warnings
          flutter test

      - name: Commit validated feature
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/apply-contact-profile-v1.yml CONTACT_PROFILE_TRIGGER.txt || true
          git add lib/v12.dart lib/chat_screen.dart lib/contact_policy.dart lib/contact_profile_screen.dart
          git commit -m "Добавить профили контактов и индивидуальные разрешения"
          git push origin HEAD:feature/contact-profile-v1

      - name: Save failure details
        if: failure()
        shell: bash
        run: |
          set +e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin feature/contact-profile-v1
          git reset --hard origin/feature/contact-profile-v1
          cat > CONTACT_PROFILE_CI_ERROR.txt <<EOF
          Contact profile v1 validation failed
          Commit: ${GITHUB_SHA}
          Time: $(date -u +'%Y-%m-%dT%H:%M:%SZ')
          EOF
          git add CONTACT_PROFILE_CI_ERROR.txt
          git commit -m "Сохранить ошибку Contact Profile CI [skip ci]" || true
          git push origin HEAD:feature/contact-profile-v1 || true
