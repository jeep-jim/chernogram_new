name: Validate Realtime Client v1

on:
  push:
    branches:
      - feature/realtime-client-v1
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cernogram-realtime-client-v1
  cancel-in-progress: true

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/realtime-client-v1
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.8"
          channel: stable
          cache: false

      - name: Apply compile-safe numeric conversions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('lib/realtime_gateway_client.dart')
          source = path.read_text(encoding='utf-8')
          source = source.replace(
              "ttlSeconds: ttl.inSeconds.clamp(5, const Duration(days: 30).inSeconds),",
              "ttlSeconds: ttl.inSeconds.clamp(5, const Duration(days: 30).inSeconds).toInt(),",
          )
          path.write_text(source, encoding='utf-8')
          PY

      - name: Validate Flutter package and realtime tests
        shell: bash
        run: |
          set -euo pipefail
          {
            flutter --version
            flutter pub get
            dart format \
              lib/realtime_gateway_models.dart \
              lib/realtime_gateway_outbox.dart \
              lib/realtime_gateway_client.dart \
              lib/realtime_gateway_config.dart \
              test/realtime_gateway_outbox_test.dart
            flutter analyze --no-fatal-infos --no-fatal-warnings
            flutter test
          } 2>&1 | tee realtime-client-ci.txt

      - name: Commit validated realtime client
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cat > REALTIME_CLIENT_CI_STATUS.md <<EOF
          Realtime Client v1 ready
          Commit: ${GITHUB_SHA}
          Time: $(date -u +'%Y-%m-%dT%H:%M:%SZ')
          Checks: format, analyze, full Flutter tests, persistent outbox tests
          Feature flag: disabled by default
          EOF
          git add \
            lib/realtime_gateway_models.dart \
            lib/realtime_gateway_outbox.dart \
            lib/realtime_gateway_client.dart \
            lib/realtime_gateway_config.dart \
            test/realtime_gateway_outbox_test.dart \
            REALTIME_CLIENT_CI_STATUS.md
          if git ls-files --error-unmatch REALTIME_CLIENT_CI_ERROR.txt >/dev/null 2>&1; then
            git rm -f REALTIME_CLIENT_CI_ERROR.txt
          fi
          git commit -m "Добавить новый WSS realtime-клиент с ACK и JSON-очередью" || true
          git push origin HEAD:feature/realtime-client-v1 || true

      - name: Save realtime client failure diagnostics
        if: failure()
        shell: bash
        run: |
          set +e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp realtime-client-ci.txt /tmp/realtime-client-ci.txt 2>/dev/null || true
          git fetch origin feature/realtime-client-v1
          git reset --hard origin/feature/realtime-client-v1
          {
            echo 'Realtime Client v1 validation failed'
            echo "Commit: ${GITHUB_SHA}"
            echo "Time: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            if [ -f /tmp/realtime-client-ci.txt ]; then cat /tmp/realtime-client-ci.txt; fi
          } > REALTIME_CLIENT_CI_ERROR.txt
          git add -f REALTIME_CLIENT_CI_ERROR.txt
          git commit -m "Сохранить ошибку Realtime Client CI [skip ci]" || true
          git push origin HEAD:feature/realtime-client-v1 || true
