name: Validate Chat UX 0.21

on:
  push:
    branches:
      - feature/chat-ux-021
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cernogram-chat-ux-021
  cancel-in-progress: true

jobs:
  android:
    name: Materialize, analyze and build Android
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/chat-ux-021
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.8"
          channel: stable
          cache: false

      - name: Materialize Chat UX
        shell: bash
        run: |
          set -euo pipefail
          if [ -f tooling/materialize_chat_ux_021.py ]; then
            python3 tooling/materialize_chat_ux_021.py
          fi

      - name: Format, analyze, test and build
        shell: bash
        run: |
          set -euo pipefail
          {
            flutter --version
            flutter pub get
            dart format lib
            flutter analyze --no-fatal-infos --no-fatal-warnings
            flutter test
            flutter build apk --release
          } 2>&1 | tee chat-ux-ci.txt

      - name: Save successful validation
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cat > CHAT_UX_021_STATUS.md <<EOF
          Chat UX ready
          Commit: ${GITHUB_SHA}
          Time: $(date -u +'%Y-%m-%dT%H:%M:%SZ')
          Version: $(awk '/^version:/ {print $2}' pubspec.yaml)
          Checks: format, analyze, tests, Android release build
          Features: live chat patterns, avatar profile, direct-to-group conversion
          EOF
          git add lib pubspec.yaml pubspec.lock CHAT_UX_021_STATUS.md
          if [ -f tooling/materialize_chat_ux_021.py ]; then
            git rm -f tooling/materialize_chat_ux_021.py
          fi
          if git ls-files --error-unmatch CHAT_UX_021_ERROR.txt >/dev/null 2>&1; then
            git rm -f CHAT_UX_021_ERROR.txt
          fi
          git commit -m "Chat UX 0.21 проверен [skip ci]" || true
          git push origin HEAD:feature/chat-ux-021 || true

      - name: Save failure diagnostics
        if: failure()
        shell: bash
        run: |
          set +e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp chat-ux-ci.txt /tmp/chat-ux-ci.txt 2>/dev/null || true
          git fetch origin feature/chat-ux-021
          git reset --hard origin/feature/chat-ux-021
          {
            echo 'Cernogram Chat UX 0.21 CI failed'
            echo "Commit: ${GITHUB_SHA}"
            echo "Time: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            if [ -f /tmp/chat-ux-ci.txt ]; then cat /tmp/chat-ux-ci.txt; fi
          } > CHAT_UX_021_ERROR.txt
          git add -f CHAT_UX_021_ERROR.txt
          git commit -m "Сохранить ошибку Chat UX 0.21 [skip ci]" || true
          git push origin HEAD:feature/chat-ux-021 || true
