name: Validate Direct to Group v1

on:
  push:
    branches:
      - feature/direct-to-group-v1
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cernogram-direct-to-group-v1
  cancel-in-progress: true

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/direct-to-group-v1
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.8"
          channel: stable
          cache: false

      - name: Apply prepared direct-to-group patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/apply-direct-to-group-v1.yml').read_text(encoding='utf-8')
          start_marker = "          python3 - <<'PY'\n"
          end_marker = "\n          PY"
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index(end_marker, start)
          block = workflow[start:end]
          script = '\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in block.splitlines()
          )
          exec(compile(script, 'apply_direct_to_group_v1.py', 'exec'), {})
          PY

      - name: Validate Flutter source
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get
          dart format lib/chat_screen.dart
          flutter analyze --no-fatal-infos --no-fatal-warnings
          flutter test

      - name: Commit validated feature
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/apply-direct-to-group-v1.yml DIRECT_GROUP_TRIGGER.txt || true
          git add lib/chat_screen.dart
          git commit -m "Добавить преобразование личного диалога в группу"
          git push origin HEAD:feature/direct-to-group-v1

      - name: Save failure details
        if: failure()
        shell: bash
        run: |
          set +e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin feature/direct-to-group-v1
          git reset --hard origin/feature/direct-to-group-v1
          cat > DIRECT_GROUP_CI_ERROR.txt <<EOF
          Direct-to-group v1 validation failed
          Commit: ${GITHUB_SHA}
          Time: $(date -u +'%Y-%m-%dT%H:%M:%SZ')
          EOF
          git add DIRECT_GROUP_CI_ERROR.txt
          git commit -m "Сохранить ошибку Direct Group CI [skip ci]" || true
          git push origin HEAD:feature/direct-to-group-v1 || true
