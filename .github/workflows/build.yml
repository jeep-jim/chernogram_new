name: Validate Media Library v1

on:
  push:
    branches:
      - feature/media-library-v1
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cernogram-media-library-v1
  cancel-in-progress: true

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/media-library-v1
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.8"
          channel: stable
          cache: false

      - name: Apply compatibility with the current music hub
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('lib/media_library_screen.dart')
          source = path.read_text(encoding='utf-8')
          source = source.replace(
              """        path: path,
        source: asset.source.name,
      );""",
              """        path: path,
      );""",
          )
          source = source.replace(
              """                    hub.activeTrack?.title ?? queue.first.title,""",
              """                    queue[(hub.player.currentIndex ?? 0)
                            .clamp(0, queue.length - 1)
                            .toInt()]
                        .title,""",
          )
          path.write_text(source, encoding='utf-8')
          PY

      - name: Validate Flutter media library
        shell: bash
        run: |
          set -euo pipefail
          {
            flutter pub get
            dart format lib/media_library.dart lib/media_library_screen.dart
            flutter analyze --no-fatal-infos --no-fatal-warnings
            flutter test
          } 2>&1 | tee media-library-ci.txt

      - name: Commit validated media library
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cat > MEDIA_LIBRARY_CI_STATUS.md <<EOF
          Media Library v1 ready
          Commit: ${GITHUB_SHA}
          Time: $(date -u +'%Y-%m-%dT%H:%M:%SZ')
          Sources: device imports, chats, voice messages, saved copies, local published catalog
          Rights: visibility, download, share, save-to-library, indexing
          Storage: JSON catalog chunks of 500 records
          EOF
          git add lib/media_library.dart lib/media_library_screen.dart MEDIA_LIBRARY_CI_STATUS.md
          if git ls-files --error-unmatch MEDIA_LIBRARY_CI_ERROR.txt >/dev/null 2>&1; then
            git rm -f MEDIA_LIBRARY_CI_ERROR.txt
          fi
          git commit -m "Добавить медиатеку с источниками, правами и JSON-чанками" || true
          git push origin HEAD:feature/media-library-v1 || true

      - name: Save media library failure diagnostics
        if: failure()
        shell: bash
        run: |
          set +e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp media-library-ci.txt /tmp/media-library-ci.txt 2>/dev/null || true
          git fetch origin feature/media-library-v1
          git reset --hard origin/feature/media-library-v1
          {
            echo 'Media Library v1 validation failed'
            echo "Commit: ${GITHUB_SHA}"
            echo "Time: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            if [ -f /tmp/media-library-ci.txt ]; then cat /tmp/media-library-ci.txt; fi
          } > MEDIA_LIBRARY_CI_ERROR.txt
          git add -f MEDIA_LIBRARY_CI_ERROR.txt
          git commit -m "Сохранить ошибку Media Library CI [skip ci]" || true
          git push origin HEAD:feature/media-library-v1 || true
