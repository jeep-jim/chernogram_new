name: Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup latest stable Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Fix Dart compile error
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('lib/main.dart')
          source = path.read_text(encoding='utf-8')
          broken = "child: const Text('ОПУБЛИКОВАТЬ', fontWeight: FontWeight.bold),"
          fixed = """child: const Text(
                  'ОПУБЛИКОВАТЬ',
                  style: TextStyle(fontWeight: FontWeight.bold),
                ),"""

          if broken in source:
              source = source.replace(broken, fixed)
              path.write_text(source, encoding='utf-8')
              print('Fixed invalid Text fontWeight parameter.')
          else:
              print('The fontWeight error is already fixed.')
          PY
          dart format lib/main.dart

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Save source fix to main
        run: |
          if git diff --quiet -- lib/main.dart; then
            echo "No source changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/main.dart
          git commit -m "Исправить ошибки компиляции Dart [skip ci]"
          git push origin HEAD:main

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: chernogram-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
