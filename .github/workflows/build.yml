name: Validate Agent Chat v1

on:
  push:
    branches:
      - feature/agent-chat-v1
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cernogram-agent-chat-v1
  cancel-in-progress: true

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/agent-chat-v1
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.8"
          channel: stable
          cache: false

      - name: Apply compile-safe agent fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('lib/agent_screen.dart')
          source = path.read_text(encoding='utf-8')
          source = source.replace(
              """                                final ok = await CgAgentBackend(candidate).testConnection();
                                setSheetState(() {""",
              """                                final testBackend = CgAgentBackend(candidate);
                                final ok = await testBackend.testConnection();
                                testBackend.close();
                                setSheetState(() {""",
          )
          path.write_text(source, encoding='utf-8')
          PY

      - name: Validate Flutter agent
        shell: bash
        run: |
          set -euo pipefail
          {
            flutter pub get
            dart format lib/agent_service.dart lib/agent_screen.dart
            flutter analyze --no-fatal-infos --no-fatal-warnings
            flutter test
          } 2>&1 | tee agent-chat-ci.txt

      - name: Commit validated agent
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cat > AGENT_CHAT_CI_STATUS.md <<EOF
          Agent Chat v1 ready
          Commit: ${GITHUB_SHA}
          Time: $(date -u +'%Y-%m-%dT%H:%M:%SZ')
          Features: streaming chat, configurable OpenAI-compatible backend, STT, TTS, barge-in, animated Cernogram entity, visible permissions
          Secrets: no API key embedded in source
          EOF
          git add lib/agent_service.dart lib/agent_screen.dart AGENT_CHAT_CI_STATUS.md
          if git ls-files --error-unmatch AGENT_CHAT_CI_ERROR.txt >/dev/null 2>&1; then
            git rm -f AGENT_CHAT_CI_ERROR.txt
          fi
          git commit -m "Добавить текстовый и голосовой цифровой агент Cernogram" || true
          git push origin HEAD:feature/agent-chat-v1 || true

      - name: Save agent failure diagnostics
        if: failure()
        shell: bash
        run: |
          set +e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp agent-chat-ci.txt /tmp/agent-chat-ci.txt 2>/dev/null || true
          git fetch origin feature/agent-chat-v1
          git reset --hard origin/feature/agent-chat-v1
          {
            echo 'Agent Chat v1 validation failed'
            echo "Commit: ${GITHUB_SHA}"
            echo "Time: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            if [ -f /tmp/agent-chat-ci.txt ]; then cat /tmp/agent-chat-ci.txt; fi
          } > AGENT_CHAT_CI_ERROR.txt
          git add -f AGENT_CHAT_CI_ERROR.txt
          git commit -m "Сохранить ошибку Agent Chat CI [skip ci]" || true
          git push origin HEAD:feature/agent-chat-v1 || true
