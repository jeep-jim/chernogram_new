name: Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: chernogram-apk-main
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup latest stable Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: chernogram-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk chernogram.apk
          gh release delete latest-apk --cleanup-tag --yes || true
          gh release create latest-apk chernogram.apk \
            --target "$GITHUB_SHA" \
            --title "Чернограм — тестовая APK" \
            --notes "Автоматически собранная тестовая версия приложения для Android." \
            --prerelease

      - name: Keep download link in repository
        run: |
          cat > APK_READY.md <<'EOF'
          # APK готов

          Последняя тестовая Android-сборка:

          https://github.com/jeep-jim/chernogram_new/releases/download/latest-apk/chernogram.apk
          EOF
          git add APK_READY.md
          if git diff --cached --quiet; then
            echo "APK link file is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Обновить ссылку на APK [skip ci]"
          git push origin HEAD:main
