name: Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: chernogram-apk-main
  cancel-in-progress: true

jobs:
  build:
    name: Build Android Test APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Apply Chernogram 0.6.2 source
        shell: bash
        run: |
          set -e
          python3 tooling/apply_v06.py
          python3 tooling/apply_v061.py
          python3 tooling/fix_v062.py
          python3 tooling/fix_v062_compat.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pubspec.yaml tooling/v06_pubspec.yaml tooling/v06_main.dart tooling/v06_icon_foreground.xml tooling/v06_launch_logo.xml tooling/fix_v062_compat.py lib/main.dart lib/v06.dart lib/brand.dart android/app/src/main/AndroidManifest.xml android/app/src/main/res
          if ! git diff --cached --quiet; then
            git commit -m "Чернограм 0.6.2: тёмная заставка точный логотип и рабочий QR [skip ci]"
            git push origin HEAD:main
          fi

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Restore stable signing key
        id: signing_cache
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: chernogram-stable-signing-v2

      - name: Create or verify stable signing key
        shell: bash
        run: |
          set -e
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            echo "Creating the canonical Chernogram prototype key for all builds from 0.6.2 onward."
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Chernogram Prototype,O=Chernogram,C=RU"
          fi
          keytool -list -v \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android | tee signing-key.txt

      - name: Setup Flutter 3.44.8
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.8"
          channel: stable
          cache: false

      - name: Validate and build APK
        id: build_apk
        shell: bash
        run: |
          set +e
          set -o pipefail
          {
            flutter --version
            flutter pub get
            dart format lib
            flutter analyze --no-fatal-infos --no-fatal-warnings
            flutter test
            flutter build apk --debug
          } 2>&1 | tee ci-build.txt
          STATUS=${PIPESTATUS[0]}
          exit "$STATUS"

      - name: Prepare update files
        shell: bash
        run: |
          set -e
          cp build/app/outputs/flutter-apk/app-debug.apk chernogram.apk
          VERSION_FULL=$(awk '/^version:/ {print $2}' pubspec.yaml)
          VERSION_NAME=${VERSION_FULL%%+*}
          VERSION_CODE=${VERSION_FULL##*+}
          APK_SHA256=$(sha256sum chernogram.apk | awk '{print $1}')
          CERT_SHA256=$(grep -m1 'SHA256:' signing-key.txt | sed 's/.*SHA256: //')
          cat > update.json <<EOF
          {
            "versionName": "${VERSION_NAME}",
            "versionCode": ${VERSION_CODE},
            "apkUrl": "https://github.com/jeep-jim/chernogram_new/releases/download/latest-apk/chernogram.apk?v=${VERSION_CODE}",
            "sha256": "${APK_SHA256}",
            "certificateSha256": "${CERT_SHA256}",
            "notesRu": "Чернограм 0.6.2: исправлена сборка, полностью тёмный запуск, ровный фирменный знак, анимация сборки логотипа, автоматическая проверка обновлений и новый QR-вход без выдуманного домена.",
            "notesEn": "Chernogram 0.6.2: fixed build, fully dark launch, corrected brand mark, assembled-logo animation, automatic update checks and a new QR entry without a fake domain."
          }
          EOF

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: chernogram-apk
          path: |
            chernogram.apk
            update.json
            signing-key.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK to GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          set -o pipefail
          VERSION_FULL=$(awk '/^version:/ {print $2}' pubspec.yaml)
          VERSION_NAME=${VERSION_FULL%%+*}
          {
            gh release delete latest-apk --cleanup-tag --yes || true
            gh release create latest-apk chernogram.apk update.json \
              --target main \
              --title "Чернограм ${VERSION_NAME}" \
              --notes "Тёмная анимированная заставка, исправленный логотип, стабильная подпись будущих обновлений и рабочий QR-вход." \
              --prerelease
          } 2>&1 | tee ci-release.txt
          STATUS=${PIPESTATUS[0]}
          exit "$STATUS"

      - name: Save exact failure diagnostics
        if: failure()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp ci-build.txt /tmp/ci-build.txt 2>/dev/null || true
          cp ci-release.txt /tmp/ci-release.txt 2>/dev/null || true
          cp signing-key.txt /tmp/signing-key.txt 2>/dev/null || true
          git fetch origin main
          git reset --hard origin/main
          {
            echo "GitHub Actions build failed"
            echo "Commit: ${GITHUB_SHA}"
            echo "Time: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            if [ -f /tmp/signing-key.txt ]; then
              echo "===== SIGNING KEY ====="
              cat /tmp/signing-key.txt
            fi
            if [ -f /tmp/ci-build.txt ]; then
              echo "===== BUILD OUTPUT ====="
              cat /tmp/ci-build.txt
            fi
            if [ -f /tmp/ci-release.txt ]; then
              echo "===== RELEASE OUTPUT ====="
              cat /tmp/ci-release.txt
            fi
          } > CI_ERROR.txt
          git add -f CI_ERROR.txt
          git commit -m "Сохранить ошибку сборки 0.6.2 [skip ci]" || true
          git push origin HEAD:main || true

      - name: Mark APK as ready
        if: success()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          CERT_SHA256=$(grep -m1 'SHA256:' signing-key.txt | sed 's/.*SHA256: //')
          git fetch origin main
          git reset --hard origin/main
          cat > BUILD_STATUS.md <<EOF
          APK ready
          Commit: ${GITHUB_SHA}
          Time: $(date -u +'%Y-%m-%dT%H:%M:%SZ')
          Version: $(awk '/^version:/ {print $2}' pubspec.yaml)
          Certificate SHA-256: ${CERT_SHA256}
          Download: https://github.com/jeep-jim/chernogram_new/releases/download/latest-apk/chernogram.apk
          Landing: https://githubraw.com/jeep-jim/chernogram_new/main/docs/index.html
          EOF
          git add BUILD_STATUS.md
          if git ls-files --error-unmatch CI_ERROR.txt >/dev/null 2>&1; then
            git rm -f CI_ERROR.txt
          fi
          git commit -m "APK 0.6.2 готов к скачиванию [skip ci]" || true
          git push origin HEAD:main || true
