name: Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: chernogram-apk-main
  cancel-in-progress: true

env:
  EXPECTED_CERT_SHA256: "F4:A2:C8:36:A8:36:71:19:78:10:FA:6E:98:2D:77:F4:C7:31:D0:9B:18:95:15:C0:13:D0:2D:0D:94:2D:9B:BE"

jobs:
  build:
    name: Build Cernogram Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout project
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Restore permanent signing key
        uses: actions/cache/restore@v4
        with:
          path: ~/.android/debug.keystore
          key: chernogram-stable-signing-v2
          fail-on-cache-miss: false

      - name: Restore repository key backup and verify certificate
        shell: bash
        env:
          CHERNOGRAM_KEYSTORE_B64: ${{ secrets.CHERNOGRAM_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          if [ -n "${CHERNOGRAM_KEYSTORE_B64:-}" ]; then
            printf '%s' "$CHERNOGRAM_KEYSTORE_B64" | base64 --decode > "$HOME/.android/debug.keystore"
            chmod 600 "$HOME/.android/debug.keystore"
          fi
          test -s "$HOME/.android/debug.keystore" || { echo '::error::Signing key unavailable'; exit 1; }
          keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android | tee signing-key.txt
          ACTUAL=$(grep -m1 'SHA256:' signing-key.txt | sed 's/.*SHA256: //' | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')
          EXPECTED=$(printf '%s' "$EXPECTED_CERT_SHA256" | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')
          test "$ACTUAL" = "$EXPECTED" || { echo '::error::Signing fingerprint mismatch'; exit 1; }

      - name: Setup Flutter 3.44.8
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.8"
          channel: stable
          cache: false

      - name: Apply all source patches through 0.16.8
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install pillow --disable-pip-version-check --quiet
          python3 tooling/fix_v015_compile.py
          python3 tooling/fix_v016_foundation.py
          python3 tooling/fix_v0162_runtime.py
          python3 tooling/fix_v0162_brand.py
          python3 tooling/materialize_v0163_ringtone.py
          python3 tooling/fix_v0163_realtime.py
          python3 tooling/fix_v0164_feedback.py
          python3 tooling/fix_v0165_reliability.py
          python3 tooling/fix_v0166_clean_transport.py
          python3 tooling/fix_v0167_brand_media.py
          python3 tooling/fix_v0168_logo_windows.py

      - name: Validate and build release APK
        shell: bash
        run: |
          set -o pipefail
          {
            flutter --version
            flutter pub get
            dart format lib
            flutter analyze --no-fatal-infos --no-fatal-warnings
            flutter test
            flutter build apk --release
          } 2>&1 | tee ci-build.txt

      - name: Re-sign final APK and verify
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_APK=build/app/outputs/flutter-apk/app-release.apk
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          test -n "$APKSIGNER"
          "$APKSIGNER" sign \
            --ks "$HOME/.android/debug.keystore" \
            --ks-key-alias androiddebugkey \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out chernogram.apk \
            "$SOURCE_APK"
          "$APKSIGNER" verify --print-certs chernogram.apk | tee apk-signature.txt
          APK_CERT=$(sed -n -e 's/^Signer #1 certificate SHA-256 digest: //p' -e 's/^V2 Signer: certificate SHA-256 digest: //p' -e 's/^V3.0 Signer: certificate SHA-256 digest: //p' apk-signature.txt | head -n 1 | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')
          EXPECTED=$(printf '%s' "$EXPECTED_CERT_SHA256" | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')
          test -n "$APK_CERT" && test "$APK_CERT" = "$EXPECTED"

      - name: Prepare update manifest
        shell: bash
        run: |
          set -euo pipefail
          VERSION_FULL=$(awk '/^version:/ {print $2}' pubspec.yaml)
          VERSION_NAME=${VERSION_FULL%%+*}
          VERSION_CODE=${VERSION_FULL##*+}
          APK_SHA256=$(sha256sum chernogram.apk | awk '{print $1}')
          cat > update.json <<EOF
          {
            "versionName": "${VERSION_NAME}",
            "versionCode": ${VERSION_CODE},
            "apkUrl": "https://github.com/jeep-jim/chernogram_new/releases/download/latest-apk/chernogram.apk?v=${VERSION_CODE}",
            "sha256": "${APK_SHA256}",
            "certificateSha256": "${EXPECTED_CERT_SHA256}",
            "notesRu": "Версия 0.16.8: сохранено существующее полосатое лицо, удалены только нос и рот, оставлены глаза и форма головы. Шапка, splash, Android-иконка и Windows ICO приведены к одному виду. Убрано тяжёлое GPU-размытие первого кадра Windows.",
            "notesEn": "Version 0.16.8 keeps the existing striped head with eyes only, unifies the header, splash, Android icon and Windows ICO, and removes heavy first-frame GPU blur on Windows."
          }
          EOF

      - name: Publish APK release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION_FULL=$(awk '/^version:/ {print $2}' pubspec.yaml)
          VERSION_NAME=${VERSION_FULL%%+*}
          gh release delete latest-apk --cleanup-tag --yes || true
          gh release create latest-apk chernogram.apk update.json \
            --target main \
            --title "Чернограм / Cernogram ${VERSION_NAME}" \
            --notes "Существующий полосатый знак сохранён: удалены только нос и рот, оставлены глаза и форма головы. Иконки унифицированы, Windows-заставка облегчена. APK подписан прежним ключом." \
            --prerelease

      - name: Save failure diagnostics
        if: failure()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp ci-build.txt /tmp/ci-build.txt 2>/dev/null || true
          cp signing-key.txt /tmp/signing-key.txt 2>/dev/null || true
          cp apk-signature.txt /tmp/apk-signature.txt 2>/dev/null || true
          git fetch origin main
          git reset --hard origin/main
          {
            echo 'GitHub Actions build failed'
            echo "Commit: ${GITHUB_SHA}"
            echo "Time: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            for file in /tmp/signing-key.txt /tmp/apk-signature.txt /tmp/ci-build.txt; do
              if [ -f "$file" ]; then echo "===== $(basename "$file") ====="; cat "$file"; fi
            done
          } > CI_ERROR.txt
          git add -f CI_ERROR.txt
          git commit -m "Сохранить ошибку сборки 0.16.8 [skip ci]" || true
          git push origin HEAD:main || true

      - name: Mark APK ready
        if: success()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git reset --hard origin/main
          cat > BUILD_STATUS.md <<EOF
          APK ready
          Commit: ${GITHUB_SHA}
          Time: $(date -u +'%Y-%m-%dT%H:%M:%SZ')
          Version: 0.16.8+39
          Certificate SHA-256: ${EXPECTED_CERT_SHA256}
          Signature policy: final APK is explicitly re-signed and verified
          Download: https://github.com/jeep-jim/chernogram_new/releases/download/latest-apk/chernogram.apk
          EOF
          git add BUILD_STATUS.md
          if git ls-files --error-unmatch CI_ERROR.txt >/dev/null 2>&1; then git rm -f CI_ERROR.txt; fi
          git commit -m "APK 0.16.8 готов с постоянной подписью [skip ci]" || true
          git push origin HEAD:main || true
