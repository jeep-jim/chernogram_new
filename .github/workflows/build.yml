name: Validate Experience Suite 0.20

on:
  push:
    branches:
      - feature/experience-suite-020
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cernogram-experience-suite-020
  cancel-in-progress: true

jobs:
  android:
    name: Analyze, test and build Android
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/experience-suite-020
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.8"
          channel: stable
          cache: false

      - name: Format, analyze, test and build
        shell: bash
        run: |
          set -euo pipefail
          {
            flutter --version
            flutter pub get
            dart format lib
            flutter analyze --no-fatal-infos --no-fatal-warnings
            flutter test
            flutter build apk --release
          } 2>&1 | tee experience-ci.txt

      - name: Save successful validation
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cat > EXPERIENCE_CI_STATUS.md <<EOF
          Experience Suite ready
          Commit: ${GITHUB_SHA}
          Time: $(date -u +'%Y-%m-%dT%H:%M:%SZ')
          Version: $(awk '/^version:/ {print $2}' pubspec.yaml)
          Checks: format, analyze, tests, Android release build
          EOF
          git add lib pubspec.yaml pubspec.lock android/app/src/main/AndroidManifest.xml EXPERIENCE_CI_STATUS.md
          if git ls-files --error-unmatch EXPERIENCE_CI_ERROR.txt >/dev/null 2>&1; then
            git rm -f EXPERIENCE_CI_ERROR.txt
          fi
          git commit -m "Experience Suite 0.20 проверен [skip ci]" || true
          git push origin HEAD:feature/experience-suite-020 || true

      - name: Save failure diagnostics
        if: failure()
        shell: bash
        run: |
          set +e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp experience-ci.txt /tmp/experience-ci.txt 2>/dev/null || true
          git fetch origin feature/experience-suite-020
          git reset --hard origin/feature/experience-suite-020
          {
            echo 'Cernogram Experience Suite CI failed'
            echo "Commit: ${GITHUB_SHA}"
            echo "Time: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            if [ -f /tmp/experience-ci.txt ]; then cat /tmp/experience-ci.txt; fi
          } > EXPERIENCE_CI_ERROR.txt
          git add -f EXPERIENCE_CI_ERROR.txt
          git commit -m "Сохранить ошибку Experience Suite CI [skip ci]" || true
          git push origin HEAD:feature/experience-suite-020 || true
