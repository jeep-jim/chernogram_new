name: Deploy Chernogram Invite Page

on:
  push:
    branches: [main]
    paths:
      - docs/**
      - .github/workflows/deploy-room-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload invite page
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

      - name: Deploy invite page
        id: deployment
        uses: actions/deploy-pages@v4
