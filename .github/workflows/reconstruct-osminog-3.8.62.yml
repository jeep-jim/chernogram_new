name: Reconstruct OSMINOG 3.8.62 source

on:
  push:
    branches: [briefcraft-releases]
    paths:
      - '.github/workflows/reconstruct-osminog-3.8.62.yml'

permissions:
  contents: write

jobs:
  reconstruct:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: briefcraft-releases
          fetch-depth: 0

      - name: Reconstruct and verify 3.8.62
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from io import BytesIO
          import base64, glob, hashlib, json, shutil, urllib.request, subprocess, lzma, tarfile

          root = Path.cwd()
          work = root / '.tmp-osminog-3.8.62'
          if work.exists(): shutil.rmtree(work)
          work.mkdir()

          def decode_parts(pattern: str) -> bytes:
              parts = sorted(glob.glob(pattern))
              if not parts:
                  raise RuntimeError(f'No parts for {pattern}')
              chunks = []
              for p in parts:
                  raw = Path(p).read_text(encoding='utf-8')
                  chunks.append(''.join(raw.split()))
              text = ''.join(chunks)
              text += '=' * (-len(text) % 4)
              return base64.b64decode(text, validate=True)

          archive_xz = decode_parts(str(root / 'bootstrap/osminog-3.8.61.b64.part*'))
          print('BASE_XZ_BYTES', len(archive_xz))
          print('BASE_XZ_SHA256', hashlib.sha256(archive_xz).hexdigest())
          tar_bytes = lzma.decompress(archive_xz)
          print('BASE_TAR_BYTES', len(tar_bytes))
          source = work / 'source'
          source.mkdir()
          with tarfile.open(fileobj=BytesIO(tar_bytes), mode='r:') as tf:
              members = tf.getmembers()
              print('BASE_TAR_ENTRIES', len(members))
              for member in members:
                  target = (source / member.name).resolve()
                  if source.resolve() not in target.parents and target != source.resolve():
                      raise RuntimeError(f'Unsafe tar member: {member.name}')
              tf.extractall(source)

          # Some packers wrap the extension in one top-level folder. Normalize it.
          if not (source / 'manifest.json').exists():
              candidates = list(source.glob('*/manifest.json'))
              if len(candidates) == 1:
                  nested = candidates[0].parent
                  normalized = work / 'normalized'
                  shutil.copytree(nested, normalized)
                  shutil.rmtree(source)
                  normalized.rename(source)

          manifest_path = source / 'manifest.json'
          if not manifest_path.exists(): raise RuntimeError('3.8.61 root manifest missing')
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          if manifest.get('version') != '3.8.61':
              raise RuntimeError(f"Unexpected base version {manifest.get('version')}")

          fs_bytes = decode_parts(str(root / 'bootstrap/osminog-3.8.62-fileset.part*'))
          fileset = json.loads(fs_bytes.decode('utf-8'))
          if fileset.get('version') != '3.8.62': raise RuntimeError('Bad fileset version')
          print('FILESET_BYTES', len(fs_bytes))
          print('FILESET_FILES', len(fileset.get('files', [])))
          print('FILESET_PATCHES', len(fileset.get('patches', [])))

          def sha256(data: bytes) -> str:
              return hashlib.sha256(data).hexdigest()

          for item in fileset.get('files', []):
              dest = source / item['path']
              dest.parent.mkdir(parents=True, exist_ok=True)
              with urllib.request.urlopen(item['url']) as response:
                  data = response.read()
              if sha256(data) != item['sha256']:
                  raise RuntimeError(f"SHA mismatch for full file {item['path']}")
              dest.write_bytes(data)

          for patch in fileset.get('patches', []):
              path = source / patch['path']
              before = path.read_bytes()
              if patch.get('beforeSha256') and sha256(before) != patch['beforeSha256']:
                  raise RuntimeError(f"Before SHA mismatch for {patch['path']}: {sha256(before)}")
              text = before.decode('utf-8')
              count = text.count(patch['search'])
              if count != 1:
                  raise RuntimeError(f"Search count {count} for {patch['path']}")
              text = text.replace(patch['search'], patch['replace'], 1)
              after = text.encode('utf-8')
              if patch.get('afterSha256') and sha256(after) != patch['afterSha256']:
                  raise RuntimeError(f"After SHA mismatch for {patch['path']}: {sha256(after)}")
              path.write_bytes(after)

          for rel in fileset.get('delete', []):
              path = source / rel
              if path.exists(): path.unlink()

          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          if manifest.get('version') != '3.8.62':
              raise RuntimeError(f"Result version is {manifest.get('version')}")

          for js in source.rglob('*.js'):
              subprocess.run(['node', '--check', str(js)], check=True)
          for jf in source.rglob('*.json'):
              json.loads(jf.read_text(encoding='utf-8'))

          snapshot = root / 'briefcraft/snapshots/3.8.62/chrome-extension'
          if snapshot.exists(): shutil.rmtree(snapshot)
          snapshot.parent.mkdir(parents=True, exist_ok=True)
          shutil.copytree(source, snapshot)

          meta = {
              'product': 'OSMINOG',
              'version': '3.8.62',
              'baseVersion': '3.8.61',
              'sourceFileCount': sum(1 for p in source.rglob('*') if p.is_file()),
              'baseArchiveXzSha256': sha256(archive_xz),
              'filesetSha256': sha256(fs_bytes),
              'checks': {'archiveIntegrity': True, 'javascriptSyntax': True, 'jsonParse': True}
          }
          (snapshot.parent / 'snapshot.json').write_text(json.dumps(meta, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(meta, ensure_ascii=False))
          PY

      - name: Commit canonical snapshot
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .tmp-osminog-3.8.62
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add briefcraft/snapshots/3.8.62
          git commit -m 'Store canonical OSMINOG Chrome 3.8.62 source snapshot'
          git push origin HEAD:briefcraft-releases
