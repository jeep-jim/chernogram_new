name: Diagnose Chernogram 0.23.4 Stable Core v3

on:
  push:
    branches:
      - feature/stable-core-0234
    paths:
      - .github/workflows/stable-core-0234-diagnostics-v3.yml
      - tooling/materialize_stable_core_0234_v2.py
      - server/realtime_gateway/test/**
      - server/realtime_gateway/tool/**
  workflow_dispatch:

permissions:
  contents: write

env:
  SOURCE_BRANCH: feature/stable-core-0234
  FLUTTER_VERSION: 3.44.8

jobs:
  diagnose:
    runs-on: ubuntu-22.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_BRANCH }}
          fetch-depth: 0
      - name: Fetch source references
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin '+refs/heads/*:refs/remotes/origin/*' --force
          for branch in feature/files-first-0233 feature/realtime-client-v1 feature/realtime-gateway-v1; do
            git branch -f "$branch" "origin/$branch"
          done
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Materialize stable core
        run: python tooling/materialize_stable_core_0234_v2.py
      - name: Verify Flutter application only
        id: flutter
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          (
            set -euo pipefail
            test "$(awk '/^version:/ {print $2}' pubspec.yaml)" = '0.23.4+59'
            flutter pub get
            dart format lib test
            flutter analyze lib test --no-fatal-infos --no-fatal-warnings
            flutter test --dart-define=CG_GATEWAY_ENABLED=true --dart-define=CG_GATEWAY_URL=ws://127.0.0.1:18080/v1/realtime --dart-define=CG_GATEWAY_ACCESS_TOKEN=dev
          ) 2>&1 | tee /tmp/flutter-0234-v3.log
      - name: Verify gateway, persistence and two-client flow
        id: gateway
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          (
            set -euo pipefail
            cd server/realtime_gateway
            dart pub get
            dart format .
            dart analyze
            dart test
            rm -rf data-smoke
            CG_ALLOW_INSECURE_DEV=1 CG_PORT=18080 CG_DATA_DIR=data-smoke dart run bin/server.dart > gateway-smoke-server.log 2>&1 &
            SERVER_PID=$!
            trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
            for attempt in $(seq 1 30); do
              if curl --fail --silent http://127.0.0.1:18080/healthz >/dev/null; then break; fi
              sleep 1
            done
            curl --fail --silent http://127.0.0.1:18080/healthz
            dart run tool/integration_smoke.dart
            kill $SERVER_PID
            wait $SERVER_PID 2>/dev/null || true
            trap - EXIT
          ) 2>&1 | tee /tmp/gateway-0234-v3.log
      - name: Save exact split diagnostic result
        if: always()
        shell: bash
        env:
          FLUTTER_OUTCOME: ${{ steps.flutter.outcome }}
          GATEWAY_OUTCOME: ${{ steps.gateway.outcome }}
        run: |
          set -euo pipefail
          cp /tmp/flutter-0234-v3.log /tmp/flutter.log 2>/dev/null || true
          cp /tmp/gateway-0234-v3.log /tmp/gateway.log 2>/dev/null || true
          git fetch origin "$SOURCE_BRANCH"
          git reset --hard "origin/$SOURCE_BRANCH"
          {
            echo '# Chernogram 0.23.4 stable core diagnostics v3'
            echo
            echo "Flutter outcome: ${FLUTTER_OUTCOME}"
            echo "Gateway outcome: ${GATEWAY_OUTCOME}"
            echo "Time: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo
            echo '## Flutter application'
            echo '```text'
            tail -n 1000 /tmp/flutter.log 2>/dev/null || true
            echo '```'
            echo
            echo '## Realtime gateway'
            echo '```text'
            tail -n 1200 /tmp/gateway.log 2>/dev/null || true
            echo '```'
          } > STABLE_CORE_0234_DIAGNOSTICS_V3.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add STABLE_CORE_0234_DIAGNOSTICS_V3.md
          git commit -m 'Сохранить раздельную диагностику 0.23.4 [skip ci]' || true
          git push origin HEAD:"$SOURCE_BRANCH"
          test "$FLUTTER_OUTCOME" = success
          test "$GATEWAY_OUTCOME" = success
