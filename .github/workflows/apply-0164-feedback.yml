                                    ),
                                  ),
                                  const SizedBox(width: 4),
                                  Text(
                                    '${onlineByTunnel[tunnel.id]}',
                                    style: const TextStyle(
                                      color: Color(0xFF22C7F2),
                                      fontSize: 11,
                                      fontWeight: FontWeight.w900,
                                    ),
                                  ),
                                ],
                              ],
                            ),""",
          )

          replace(
              'lib/v12.dart',
