              }

              Widget _fallback(BuildContext context) {
                final letter = contact.nickname.trim().isEmpty
                    ? '?'
                    : contact.nickname.trim()[0].toUpperCase();
                return CircleAvatar(
                  backgroundColor: Theme.of(context).colorScheme.primary,
