name: Apply 0.16.4 feedback fixes

on:
  push:
    branches:
      - fix/0164-feedback

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/0164-feedback
          fetch-depth: 0

      - name: Apply source changes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=1):
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              found = text.count(old)
              if found < count:
                  raise SystemExit(f'{path}: expected at least {count} matches, found {found}')
              text = text.replace(old, new, count)
              file.write_text(text, encoding='utf-8')

          def replace_all(path, old, new):
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              found = text.count(old)
              if found == 0:
                  raise SystemExit(f'{path}: no matches')
              file.write_text(text.replace(old, new), encoding='utf-8')

          replace(
              'lib/main.dart',
              """      systemNavigationBarColor: ChernogramColors.background,
              systemNavigationBarIconBrightness: Brightness.light,
            ),""",
              """      systemNavigationBarColor: ChernogramColors.background,
              systemNavigationBarIconBrightness: Brightness.light,
              systemNavigationBarDividerColor: ChernogramColors.background,
              systemNavigationBarContrastEnforced: false,
              systemStatusBarContrastEnforced: false,
            ),""",
          )
          replace(
              'lib/main.dart',
              """              systemNavigationBarColor: ChernogramColors.background,
              systemNavigationBarIconBrightness: Brightness.light,
              systemNavigationBarContrastEnforced: false,""",
              """              systemNavigationBarColor: ChernogramColors.background,
              systemNavigationBarIconBrightness: Brightness.light,
              systemNavigationBarDividerColor: ChernogramColors.background,
              systemNavigationBarContrastEnforced: false,""",
          )
          for style_path in (
              'android/app/src/main/res/values/styles.xml',
              'android/app/src/main/res/values-night/styles.xml',
          ):
              replace_all(
                  style_path,
                  """        <item name="android:navigationBarColor">#080808</item>""",
                  """        <item name="android:navigationBarColor">#080808</item>
                  <item name="android:navigationBarDividerColor">#080808</item>
                  <item name="android:enforceNavigationBarContrast">false</item>""",
              )

          replace(
              'lib/call_service.dart',
              """  Future<void> _hangUp() async {
              if (_ended) return;
              await _sendSignal(<String, dynamic>{'action': 'call_end'});
              _finish(_connectedAt == null ? 'cancelled' : 'completed');
            }

            void _finish(String status) {
              if (_ended || !mounted) return;
              _ended = true;
              final duration = _connectedAt == null""",
              """  Future<void> _hangUp() async {
              if (_ended) return;
              final status = _connectedAt == null ? 'cancelled' : 'completed';
              final endSignal = _sendCallEnd();
              _finish(status);
              try {
                await endSignal.timeout(const Duration(milliseconds: 900));
              } catch (_) {
                // The screen is already closed; relay retries must never hold the UI.
              }
            }

            Future<void> _sendCallEnd() {
              final session = _session;
              if (session == null) return Future<void>.value();
              return session.sendSignal(<String, dynamic>{
                'action': 'call_end',
                'callId': _callId,
                'from': _profileId,
                'video': widget.video,
                if (_peerId != null && _peerId!.isNotEmpty) 'target': _peerId,
              });
            }

            void _finish(String status) {
              if (_ended || !mounted) return;
              _ended = true;
              _durationTimer?.cancel();
              _inviteTimer?.cancel();
              _readyTimer?.cancel();
              _offerTimer?.cancel();
              _watchdog?.cancel();
              final duration = _connectedAt == null""",
          )

          replace(
              'lib/chat_screen.dart',
              """const String _landingBase =
              'https://githubraw.com/jeep-jim/chernogram_new/main/docs/index.html';""",
              """const String _landingBase =
              'https://githubraw.com/jeep-jim/chernogram_new/main/docs/index.html';
            const String _androidInstallUrl =
              'https://github.com/jeep-jim/chernogram_new/releases/download/latest-apk/chernogram.apk?v=16';""",
          )
          replace(
              'lib/chat_screen.dart',
              """  String get _inviteUrl =>
              '$_landingBase?v=15&invite=${Uri.encodeQueryComponent(_tunnel.inviteToken)}';""",
              """  String get _inviteUrl =>
              '$_landingBase?v=16&invite=${Uri.encodeQueryComponent(_tunnel.inviteToken)}';""",
          )
          replace(
              'lib/chat_screen.dart',
              """              SizedBox(
                width: double.infinity,
                child: FilledButton.icon(
                  onPressed: () => Share.share(
                    widget.ru
                        ? 'Открой чат в Чернограме: $_deepInvite\\n\\nЕсли приложение не открылось: $_inviteUrl'
