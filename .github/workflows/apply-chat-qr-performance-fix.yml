  final bool ru;

  const CgQrScanner({super.key, required this.ru});

  @override
  State<CgQrScanner> createState() => _CgQrScannerState();
}

class _CgQrScannerState extends State<CgQrScanner> {
  bool _handled = false;
  bool _readingFile = false;
  MobileScannerController? _controller;

  bool get _cameraSupported =>
      kIsWeb ||
      defaultTargetPlatform == TargetPlatform.android ||
      defaultTargetPlatform == TargetPlatform.iOS ||
      defaultTargetPlatform == TargetPlatform.macOS;

  @override
  void initState() {
    super.initState();
    if (_cameraSupported) {
      _controller = MobileScannerController();
    }
  }

  String? _extract(String value) {
    final uri = Uri.tryParse(value);
    if (uri != null) {
      if (uri.scheme == 'chernogram' &&
          uri.host == 'join' &&
          uri.pathSegments.isNotEmpty) {
        return uri.pathSegments.first;
      }
      final invite = uri.queryParameters['invite'];
      if (invite != null && invite.isNotEmpty) return invite;
    }
    if (CgTunnel.fromInviteToken(value) != null) return value;
    return null;
  }

  void _finishRaw(String raw) {
    if (_handled || !mounted) return;
    final token = _extract(raw);
    if (token == null) {
      ScaffoldMessenger.of(context).showSnackBar(
        SnackBar(
          content: Text(
            widget.ru
                ? 'На изображении нет приглашения Чернограма.'
                : 'The image does not contain a Chernogram invite.',
          ),
        ),
      );
      return;
    }
    _handled = true;
    Navigator.pop(context, token);
  }

  void _detect(BarcodeCapture capture) {
    if (_handled) return;
    for (final barcode in capture.barcodes) {
      final raw = barcode.rawValue;
      if (raw == null || raw.isEmpty) continue;
      final token = _extract(raw);
      if (token == null) continue;
      _handled = true;
      Navigator.pop(context, token);
      return;
    }
  }

  Future<void> _pickQrImage() async {
    if (_readingFile) return;
    final result = await FilePicker.platform.pickFiles(
      allowMultiple: false,
      type: FileType.image,
      withData: true,
    );
    if (result == null || result.files.isEmpty || !mounted) return;
    final bytes = result.files.first.bytes;
    if (bytes == null) {
      ScaffoldMessenger.of(context).showSnackBar(
        SnackBar(
          content: Text(
            widget.ru
                ? 'Не удалось прочитать выбранное изображение.'
                : 'Could not read the selected image.',
          ),
        ),
      );
      return;
    }

    setState(() => _readingFile = true);
    try {
      final raw = await decodeQrFromImage(bytes);
      if (!mounted) return;
      if (raw == null) {
        ScaffoldMessenger.of(context).showSnackBar(
          SnackBar(
            content: Text(
              widget.ru
                  ? 'QR-код на изображении не найден. Выберите чёткий скриншот без сильного обрезания.'
                  : 'No QR code was found. Choose a clear, uncropped screenshot.',
            ),
          ),
        );
        return;
      }
      _finishRaw(raw);
    } finally {
      if (mounted) setState(() => _readingFile = false);
    }
  }

  @override
  void dispose() {
    _controller?.dispose();
    super.dispose();
  }

  @override
  Widget build(BuildContext context) => Scaffold(
        appBar: AppBar(
          title: Text(
            widget.ru ? 'Принять приглашение' : 'Accept invite',
          ),
        ),
        body: Column(
          children: [
            Expanded(
              child: _cameraSupported
                  ? Stack(
                      fit: StackFit.expand,
                      children: [
                        MobileScanner(
                          controller: _controller,
                          onDetect: _detect,
                        ),
                        Center(
                          child: Container(
                            width: 250,
                            height: 250,
                            decoration: BoxDecoration(
                              border: Border.all(
                                color: const Color(0xFF18B8FF),
                                width: 3,
                              ),
                              borderRadius: BorderRadius.circular(32),
                            ),
                          ),
                        ),
                      ],
                    )
                  : Center(
                      child: Padding(
                        padding: const EdgeInsets.all(28),
                        child: Column(
                          mainAxisSize: MainAxisSize.min,
                          children: [
                            Icon(
                              Icons.qr_code_2_rounded,
                              size: 92,
                              color: Theme.of(context)
                                  .colorScheme
                                  .primary
                                  .withValues(alpha: .78),
                            ),
                            const SizedBox(height: 18),
                            Text(
                              widget.ru
                                  ? 'На компьютере загрузите скриншот или фотографию QR-кода.'
                                  : 'On desktop, upload a screenshot or photo of the QR code.',
                              textAlign: TextAlign.center,
                              style: const TextStyle(
                                fontSize: 17,
                                fontWeight: FontWeight.w800,
                              ),
                            ),
                          ],
                        ),
                      ),
                    ),
            ),
            SafeArea(
              top: false,
              child: Padding(
                padding: const EdgeInsets.fromLTRB(16, 12, 16, 16),
                child: SizedBox(
                  width: double.infinity,
                  child: FilledButton.icon(
                    onPressed: _readingFile ? null : _pickQrImage,
                    icon: _readingFile
                        ? const SizedBox(
                            width: 18,
                            height: 18,
                            child: CircularProgressIndicator(strokeWidth: 2),
                          )
                        : const Icon(Icons.image_outlined),
                    label: Text(
                      widget.ru
                          ? 'Загрузить изображение QR-кода'
                          : 'Upload QR-code image',
                    ),
                  ),
                ),
              ),
            ),
          ],
        ),
      );
}
'''
