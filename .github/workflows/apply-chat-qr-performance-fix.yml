name: Apply chat QR and performance fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-chat-qr-performance-fix.yml'

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Apply source changes
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'Expected block not found in {path}: {old[:100]!r}')
              file.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'pubspec.yaml',
              'version: 0.11.0+21',
              'version: 0.12.0+22',
          )
          replace_once(
              'pubspec.yaml',
              '  http: ^1.5.0\n  just_audio: ^0.10.6',
              '  http: ^1.5.0\n  image: ^4.9.1\n  just_audio: ^0.10.6',
          )
          replace_once(
              'pubspec.yaml',
              '  video_player: ^2.13.0\n',
              '  video_player: ^2.13.0\n  zxing2: ^0.2.4\n',
          )

          qr_decoder = r'''import 'dart:typed_data';

import 'package:flutter/foundation.dart';
import 'package:image/image.dart' as img;
import 'package:zxing2/qrcode.dart';

Future<String?> decodeQrFromImage(Uint8List bytes) {
  return compute(_decodeQrInBackground, bytes);
}

String? _decodeQrInBackground(Uint8List bytes) {
  final decoded = img.decodeImage(bytes);
  if (decoded == null) return null;

  final image = img.bakeOrientation(decoded);
  for (final order in <img.ChannelOrder>[
    img.ChannelOrder.rgba,
    img.ChannelOrder.abgr,
  ]) {
    final pixels = image
        .convert(numChannels: 4)
        .getBytes(order: order)
        .buffer
        .asInt32List();
    final source = RGBLuminanceSource(image.width, image.height, pixels);

    for (final luminance in <LuminanceSource>[source, source.invert()]) {
      for (final hybrid in <bool>[true, false]) {
        try {
          final bitmap = BinaryBitmap(
            hybrid
                ? HybridBinarizer(luminance)
                : GlobalHistogramBinarizer(luminance),
          );
          final value = QRCodeReader().decode(bitmap).text.trim();
          if (value.isNotEmpty) return value;
        } catch (_) {
          // Try the next channel order, inversion or binarizer.
        }
      }
    }
  }
  return null;
}
'''
          Path('lib/qr_image_decoder.dart').write_text(qr_decoder, encoding='utf-8')

          v07 = Path('lib/v07.dart')
          text = v07.read_text(encoding='utf-8')
          text = text.replace(
              "import 'package:file_picker/file_picker.dart';\nimport 'package:flutter/material.dart';",
              "import 'package:file_picker/file_picker.dart';\nimport 'package:flutter/foundation.dart';\nimport 'package:flutter/material.dart';",
              1,
          )
          text = text.replace(
              "import 'core_models.dart';\n",
              "import 'core_models.dart';\nimport 'qr_image_decoder.dart';\n",
              1,
          )
          text = text.replace(
