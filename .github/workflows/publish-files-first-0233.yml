name: Publish Chernogram 0.23.3 files-first Android

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-files-first-0233.yml
  workflow_dispatch:

permissions:
  contents: write

env:
  SOURCE_BRANCH: feature/files-first-0233
  EXPECTED_VERSION: 0.23.3+58
  EXPECTED_VERSION_NAME: 0.23.3
  EXPECTED_VERSION_CODE: 58
  EXPECTED_CERT_SHA256: "F4:A2:C8:36:A8:36:71:19:78:10:FA:6E:98:2D:77:F4:C7:31:D0:9B:18:95:15:C0:13:D0:2D:0D:94:2D:9B:BE"

concurrency:
  group: publish-files-first-0233
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-22.04
    timeout-minutes: 100

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_BRANCH }}
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true

      - uses: actions/cache/restore@v4
        with:
          path: ~/.android/debug.keystore
          key: chernogram-stable-signing-v2
          fail-on-cache-miss: false

      - name: Restore and verify permanent Android key
        shell: bash
        env:
          CHERNOGRAM_KEYSTORE_B64: ${{ secrets.CHERNOGRAM_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          if [ -n "${CHERNOGRAM_KEYSTORE_B64:-}" ]; then
            printf '%s' "$CHERNOGRAM_KEYSTORE_B64" | base64 --decode > "$HOME/.android/debug.keystore"
            chmod 600 "$HOME/.android/debug.keystore"
          fi
          test -s "$HOME/.android/debug.keystore"
          keytool -list -v \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android | tee signing-key-0233.txt
          ACTUAL=$(grep -m1 'SHA256:' signing-key-0233.txt | sed 's/.*SHA256: //' | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')
          EXPECTED=$(printf '%s' "$EXPECTED_CERT_SHA256" | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')
          test "$ACTUAL" = "$EXPECTED"

      - name: Materialize focused 0.23 design
        shell: bash
        run: |
          set -euo pipefail
          test "$(awk '/^version:/ {print $2}' pubspec.yaml)" = "$EXPECTED_VERSION"
          python tooling/materialize_files_first_0233.py
          python tooling/finalize_files_first_0233.py

      - name: Analyze, test and build Android release
        shell: bash
        run: |
          set -o pipefail
          (
            set -euo pipefail
            flutter --version
            flutter pub get
            dart format lib tooling/materialize_files_first_0233.py tooling/finalize_files_first_0233.py
            flutter analyze --no-fatal-infos --no-fatal-warnings
            flutter test
            flutter build apk --release
            test -s build/app/outputs/flutter-apk/app-release.apk
          ) 2>&1 | tee files-first-0233-build.log

      - name: Sign and verify exact Android version
        shell: bash
        run: |
          set -o pipefail
          (
            set -euo pipefail
            SOURCE_APK=build/app/outputs/flutter-apk/app-release.apk
            APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
            AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)
            test -n "$APKSIGNER" && test -n "$AAPT"
            "$APKSIGNER" sign \
              --ks "$HOME/.android/debug.keystore" \
              --ks-key-alias androiddebugkey \
              --ks-pass pass:android \
              --key-pass pass:android \
              --out chernogram.apk \
              "$SOURCE_APK"
            "$APKSIGNER" verify --print-certs chernogram.apk | tee apk-signature-0233.txt
            APK_CERT=$(sed -n -e 's/^Signer #1 certificate SHA-256 digest: //p' -e 's/^V2 Signer: certificate SHA-256 digest: //p' -e 's/^V3.0 Signer: certificate SHA-256 digest: //p' apk-signature-0233.txt | head -n 1 | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')
            EXPECTED=$(printf '%s' "$EXPECTED_CERT_SHA256" | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')
            test "$APK_CERT" = "$EXPECTED"
            "$AAPT" dump badging chernogram.apk | tee apk-badging-0233.txt
            grep -q "versionCode='$EXPECTED_VERSION_CODE'" apk-badging-0233.txt
            grep -q "versionName='$EXPECTED_VERSION_NAME'" apk-badging-0233.txt
            sha256sum chernogram.apk | tee apk-sha256-0233.txt
          ) 2>&1 | tee -a files-first-0233-build.log

      - name: Commit the exact validated source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Чернограм 0.23.3 быстрый чат и файлы проверены [skip ci]" || true
          git push origin HEAD:"$SOURCE_BRANCH"

      - name: Prepare update manifest
        shell: bash
        run: |
          set -euo pipefail
          APK_SHA=$(awk '{print $1}' apk-sha256-0233.txt)
          cat > update.json <<EOF
          {
            "versionName": "${EXPECTED_VERSION_NAME}",
            "versionCode": ${EXPECTED_VERSION_CODE},
            "apkUrl": "https://github.com/jeep-jim/chernogram_new/releases/download/latest-apk/chernogram.apk?v=${EXPECTED_VERSION_CODE}",
            "sha256": "${APK_SHA}",
            "certificateSha256": "${EXPECTED_CERT_SHA256}",
            "notesRu": "Чернограм 0.23.3 сохраняет утверждённый интерфейс 0.23 и плеер. Чат больше не блокируется состоянием сети: сообщения сохраняются мгновенно, получают подтверждение доставки и повторяются из локальной очереди. Файлы передаются зашифрованными частями и сохраняются отдельно от JSON истории. Сохранены открытые комнаты, общий поиск файлов, перенос Chernogram ID между устройствами, аудио- и видеозвонки.",
            "notesEn": "Chernogram 0.23.3 keeps the approved 0.23 interface and music player. Chat is never blocked by network state: messages are saved instantly, acknowledged and retried from a local queue. Files are transferred in encrypted chunks and stored outside JSON history. Public rooms, shared file search, cross-device Chernogram ID transfer, audio and video calls remain available."
          }
          EOF

      - name: Publish Android update for installed clients
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release delete latest-apk --cleanup-tag --yes || true
          gh release create latest-apk \
            chernogram.apk \
            update.json \
            apk-sha256-0233.txt \
            --target "$SOURCE_BRANCH" \
            --title "Чернограм 0.23.3 — быстрый чат и файлы" \
            --notes "Устанавливается поверх текущей версии штатной кнопкой обновления внутри приложения. Дизайн 0.23 и плеер сохранены." \
            --prerelease

      - name: Publish manifest on main
        shell: bash
        run: |
          set -euo pipefail
          cp update.json /tmp/update-0233.json
          APK_SHA=$(awk '{print $1}' apk-sha256-0233.txt)
          APK_BYTES=$(stat -c '%s' chernogram.apk)
          git fetch origin main
          git checkout -B main origin/main
          cp /tmp/update-0233.json update.json
          cat > FILES_FIRST_0233_STATUS.md <<EOF
          Chernogram files-first published
          Version: ${EXPECTED_VERSION}
          Design baseline: approved 0.23 / 0.22
          Chat: local-first, encrypted, ACK and durable retry
          Files: encrypted chunks, local file storage, no large base64 in room JSON
          Public search: files in joined public rooms
          Device access: encrypted Chernogram ID transfer retained
          Music player: retained
          Calls and video: retained and not blocked by connection labels
          Android release: success
          APK bytes: ${APK_BYTES}
          APK SHA-256: ${APK_SHA}
          Signing certificate: ${EXPECTED_CERT_SHA256}
          Channel: latest-apk
          Time: $(date -u +'%Y-%m-%dT%H:%M:%SZ')
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add update.json FILES_FIRST_0233_STATUS.md
          git commit -m "Опубликовать Чернограм 0.23.3 для обновления из приложения [skip ci]"
          git push origin HEAD:main

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chernogram-files-first-0.23.3
          path: |
            chernogram.apk
            update.json
            files-first-0233-build.log
            signing-key-0233.txt
            apk-signature-0233.txt
            apk-badging-0233.txt
            apk-sha256-0233.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Save exact failure report
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          cp files-first-0233-build.log /tmp/files-first-0233-build.log 2>/dev/null || true
          cp apk-badging-0233.txt /tmp/apk-badging-0233.txt 2>/dev/null || true
          git fetch origin "$SOURCE_BRANCH"
          git reset --hard "origin/$SOURCE_BRANCH"
          {
            echo '# Chernogram 0.23.3 files-first failed'
            echo
            echo "Workflow commit: ${GITHUB_SHA}"
            echo "Source: ${SOURCE_BRANCH}"
            echo "Time: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo
            echo '```text'
            tail -n 1400 /tmp/files-first-0233-build.log 2>/dev/null || true
            tail -n 80 /tmp/apk-badging-0233.txt 2>/dev/null || true
            echo '```'
          } > FILES_FIRST_0233_CI_ERROR.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add FILES_FIRST_0233_CI_ERROR.md
          git commit -m "Сохранить ошибку Чернограма 0.23.3 [skip ci]" || true
          git push origin HEAD:"$SOURCE_BRANCH"
