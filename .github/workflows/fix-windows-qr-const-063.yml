name: Исправить QR-конструктор Windows build 63

on:
  push:
    branches: [fix/windows-startup-063]
    paths:
      - .github/workflows/fix-windows-qr-const-063.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/windows-startup-063
          fetch-depth: 0

      - name: Убрать ошибочный const у QrImageView
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('lib/device_product_panels.dart')
          text = path.read_text(encoding='utf-8')
          old = 'child: const QrImageView('
          new = 'child: QrImageView('
          count = text.count(old)
          if count != 1:
              raise RuntimeError(f'Expected one invalid const QrImageView, found {count}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-windows-qr-const-063.yml
          git add lib/device_product_panels.dart
          git commit -m "Исправить const QrImageView в Windows build 63 [skip ci]"
          git push origin HEAD:fix/windows-startup-063
