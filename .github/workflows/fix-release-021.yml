name: Fix LiveKit 0.21 release workflow

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fix-release-021.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch release workflow
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/build.yml')
          text = path.read_text(encoding='utf-8')

          old_sdk = '            yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "cmake;3.22.1" >/dev/null\n'
          new_sdk = '            "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "cmake;3.22.1" >/dev/null\n'
          if old_sdk not in text:
              raise SystemExit('Android sdkmanager anchor not found')
          text = text.replace(old_sdk, new_sdk, 1)

          old_add = '          git add RELEASE_021_STATUS.md RELEASE_021_ERROR.md 2>/dev/null || true\n'
          new_add = '          git add -A\n'
          if old_add not in text:
              raise SystemExit('Release status git-add anchor not found')
          text = text.replace(old_add, new_add, 1)

          path.write_text(text, encoding='utf-8')
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-release-021.yml
          git add .github/workflows/build.yml
          git commit -m "Устранить сбой Android release 0.21 [skip ci]"
          git push origin HEAD:main

# Triggered after workflow registration.
