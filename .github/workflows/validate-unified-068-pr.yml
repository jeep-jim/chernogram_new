name: Проверка единой сборки 68

on:
  pull_request:
    branches: [main]
    paths:
      - lib/**
      - android/**
      - windows/**
      - pubspec.yaml
      - tool/apply_unified_068.py
      - .github/workflows/validate-unified-068-pr.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: validate-unified-068-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.44.8
  SIMPLEX_VERSION: v6.5.6
  SIMPLEX_APK_SHA256: 79ae9650905abf0de50f83d72ee2c8b159feb67e093a6fac30f578a66d0181b6
  CERT_SHA256: F4:A2:C8:36:A8:36:71:19:78:10:FA:6E:98:2D:77:F4:C7:31:D0:9B:18:95:15:C0:13:D0:2D:0D:94:2D:9B:BE

jobs:
  android:
    name: Android APK build 68
    runs-on: ubuntu-22.04
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - uses: actions/cache/restore@v4
        with:
          path: ~/.android/debug.keystore
          key: chernogram-stable-signing-v2
          fail-on-cache-miss: true
      - name: Применить патч build 68
        shell: bash
        run: |
          set -euo pipefail
          if ! grep -q "case 'read_receipt'" lib/chat_screen.dart; then
            python3 tool/apply_unified_068.py
          fi
          dart format lib/main.dart lib/core_models.dart lib/android_data_first.dart lib/chat_screen.dart lib/chat_media.dart lib/app_monitor.dart lib/windows_desktop_app.dart lib/device_identity.dart lib/device_pairing.dart lib/client_settings.dart lib/background_runtime.dart
          ! grep -R -n -E "Агент и автоматизация|Agent and automation|локальные задачи|local tasks" lib
      - name: Извлечь SimpleX
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --retry-delay 3 -o simplex.apk "https://github.com/simplex-chat/simplex-chat/releases/download/${SIMPLEX_VERSION}/simplex-aarch64.apk"
          printf '%s  %s\n' "$SIMPLEX_APK_SHA256" simplex.apk | sha256sum --check
          python3 - <<'PY'
          from pathlib import Path
          import re, shutil, subprocess, zipfile
          output = Path('android/app/src/main/jniLibs/arm64-v8a')
          if output.exists(): shutil.rmtree(output)
          output.mkdir(parents=True)
          temp = Path('.simplex-libs')
          if temp.exists(): shutil.rmtree(temp)
          temp.mkdir()
          system = {'libandroid.so','libc.so','libdl.so','libEGL.so','libGLESv2.so','libjnigraphics.so','liblog.so','libm.so','libOpenSLES.so','libvulkan.so','libz.so'}
          with zipfile.ZipFile('simplex.apk') as archive:
              entries = {Path(n).name:n for n in archive.namelist() if n.startswith('lib/arm64-v8a/') and n.endswith('.so')}
              queue = ['libapp-lib.so','libsimplex.so','libsupport.so']
              copied = set()
              while queue:
                  lib = queue.pop(0)
                  if lib in copied or lib in system: continue
                  member = entries.get(lib)
                  if member is None: raise RuntimeError(f'missing {lib}')
                  source = Path(archive.extract(member, temp))
                  target = output / lib
                  shutil.copy2(source, target)
                  copied.add(lib)
                  dynamic = subprocess.check_output(['readelf','-d',str(target)], text=True, errors='replace')
                  for dep in re.findall(r'\(NEEDED\).*Shared library: \[(.+?)\]', dynamic):
                      if dep not in copied and dep not in system: queue.append(dep)
          PY
      - name: Анализ, тесты и сборка
        shell: bash
        run: |
          set -o pipefail
          flutter pub get
          flutter analyze --no-fatal-infos --no-fatal-warnings
          flutter test
          flutter build apk --release --target-platform android-arm64 2>&1 | tee android-build.log
      - name: Подписать прежним сертификатом
        shell: bash
        run: |
          set -euo pipefail
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)
          "$APKSIGNER" sign --ks "$HOME/.android/debug.keystore" --ks-key-alias androiddebugkey --ks-pass pass:android --key-pass pass:android --out chernogram-0.26.0-build68.apk build/app/outputs/flutter-apk/app-release.apk
          "$APKSIGNER" verify --print-certs chernogram-0.26.0-build68.apk | tee android-signature.txt
          ACTUAL=$(grep -m1 'SHA-256 digest:' android-signature.txt | sed 's/.*digest: //' | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')
          EXPECTED=$(printf '%s' "$CERT_SHA256" | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')
          test "$ACTUAL" = "$EXPECTED"
          "$AAPT" dump badging chernogram-0.26.0-build68.apk | tee android-badging.txt
          grep -q "versionCode='68'" android-badging.txt
          grep -q "versionName='0.26.0'" android-badging.txt
          sha256sum chernogram-0.26.0-build68.apk > android-sha256.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chernogram-android-build68
          path: |
            chernogram-0.26.0-build68.apk
            android-build.log
            android-signature.txt
            android-badging.txt
            android-sha256.txt
          if-no-files-found: warn
          retention-days: 14

  windows:
    name: Windows build 68
    runs-on: windows-2022
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Применить патч build 68
        shell: pwsh
        run: |
          if (-not (Select-String -Path lib/chat_screen.dart -Pattern "case 'read_receipt'" -Quiet)) { python tool/apply_unified_068.py }
          dart format lib/main.dart lib/core_models.dart lib/android_data_first.dart lib/chat_screen.dart lib/chat_media.dart lib/app_monitor.dart lib/windows_desktop_app.dart lib/device_identity.dart lib/device_pairing.dart lib/client_settings.dart lib/background_runtime.dart
      - name: Создать маску Windows
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check pillow
          @'
          from PIL import Image, ImageDraw
          from pathlib import Path
          import math
          s=256; im=Image.new('RGBA',(s,s),(7,10,18,255)); d=ImageDraw.Draw(im)
          colors=['#B9A8FF','#AE98FF','#A087FF','#9277FF','#8668FF','#7B5CFF','#715FFB','#666AF8','#5B78F4','#5088F1','#4599EE','#3BA9EC','#31B7EC','#27C1F3','#20C7FF']
          for i,c in enumerate(colors):
              t=i/(len(colors)-1); nx=t*2-1; x=48+t*160; e=math.sqrt(max(0,1-nx*nx)); top=38+(1-e)*25; bottom=124+e*92-abs(nx)*8; w=8
              if .17<abs(nx)<.72:
                  d.line((x,top,x,96),fill=c,width=w); d.line((x,116,x,bottom),fill=c,width=w)
              else: d.line((x,top,x,bottom),fill=c,width=w)
          p=Path('windows/runner/resources/app_icon.ico'); p.parent.mkdir(parents=True,exist_ok=True); im.save(p,format='ICO',sizes=[(16,16),(32,32),(48,48),(64,64),(128,128),(256,256)])
          '@ | Set-Content -Encoding UTF8 make_icon.py
          python make_icon.py
      - name: Анализ, тесты и сборка
        shell: pwsh
        run: |
          flutter config --enable-windows-desktop
          flutter pub get
          flutter analyze --no-fatal-infos --no-fatal-warnings
          flutter test
          flutter build windows --release 2>&1 | Tee-Object -FilePath windows-build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Compress-Archive -Path 'build/windows/x64/runner/Release/*' -DestinationPath 'chernogram-windows-0.26.0-build68-portable.zip' -Force
      - name: Собрать установщик
        shell: pwsh
        run: |
          $release=(Resolve-Path 'build/windows/x64/runner/Release').Path
          $icon=(Resolve-Path 'windows/runner/resources/app_icon.ico').Path
          @"
          [Setup]
          AppId={{7D440E55-6347-4EF8-8B49-2868B0D4A068}
          AppName=Чернограм
          AppVersion=0.26.0
          DefaultDirName={autopf}\Чернограм
          OutputDir=$env:GITHUB_WORKSPACE
          OutputBaseFilename=Chernogram-Windows-0.26.0-build68-Setup
          SetupIconFile=$icon
          UninstallDisplayIcon={app}\chernogram.exe
          Compression=lzma2
          SolidCompression=yes
          ArchitecturesAllowed=x64compatible
          ArchitecturesInstallIn64BitMode=x64compatible
          WizardStyle=modern
          PrivilegesRequired=lowest
          [Files]
          Source: "$release\*"; DestDir: "{app}"; Flags: ignoreversion recursesubdirs createallsubdirs
          [Icons]
          Name: "{autoprograms}\Чернограм"; Filename: "{app}\chernogram.exe"
          Name: "{autodesktop}\Чернограм"; Filename: "{app}\chernogram.exe"
          [Run]
          Filename: "{app}\chernogram.exe"; Description: "Запустить Чернограм"; Flags: nowait postinstall skipifsilent
          "@ | Set-Content installer.iss -Encoding UTF8
          $iscc='C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-FileHash Chernogram-Windows-0.26.0-build68-Setup.exe -Algorithm SHA256 | Format-List | Out-File windows-sha256.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chernogram-windows-build68
          path: |
            Chernogram-Windows-0.26.0-build68-Setup.exe
            chernogram-windows-0.26.0-build68-portable.zip
            windows-build.log
            windows-sha256.txt
          if-no-files-found: warn
          retention-days: 14
