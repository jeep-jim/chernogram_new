name: Trigger VeilTalk Pages deploy

on:
  pull_request:
    branches: [main]
    paths:
      - 'TRIGGER_VEILTALK_PAGES.md'

permissions:
  actions: write
  contents: read

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Pages workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BEFORE=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow veiltalk-pages.yml --limit 1 --json databaseId --jq '.[0].databaseId // 0')
          gh workflow run veiltalk-pages.yml --repo "$GITHUB_REPOSITORY" --ref main
          for attempt in $(seq 1 30); do
            sleep 2
            RUN_ID=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow veiltalk-pages.yml --limit 1 --json databaseId --jq '.[0].databaseId // 0')
            if [ "$RUN_ID" != "0" ] && [ "$RUN_ID" != "$BEFORE" ]; then
              echo "VeilTalk Pages run: $RUN_ID"
              exit 0
            fi
          done
          exit 1
