name: Publish OSMINOG 3.8.61

on:
  push:
    branches:
      - briefcraft-releases
    paths:
      - 'bootstrap/osminog-3.8.61.b64.part*'
      - '.github/workflows/publish-osminog-3.8.61.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: briefcraft-releases
          fetch-depth: 0

      - name: Reconstruct verified source archive
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t parts < <(find bootstrap -maxdepth 1 -type f -name 'osminog-3.8.61.b64.part*' | sort)
          test "${#parts[@]}" -eq 4
          cat "${parts[@]}" | base64 --decode > /tmp/OSMINOG-Chrome-3.8.61-ROOT.tar.xz
          actual="$(sha256sum /tmp/OSMINOG-Chrome-3.8.61-ROOT.tar.xz | awk '{print $1}')"
          expected='073fa1d36286eb0e389e8680e51a2879648f46ae225bdffefeb3106bf297d9da'
          test "$actual" = "$expected"
          rm -rf /tmp/osminog-3.8.61
          mkdir -p /tmp/osminog-3.8.61
          tar -xJf /tmp/OSMINOG-Chrome-3.8.61-ROOT.tar.xz -C /tmp/osminog-3.8.61

      - name: Validate extension source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json, re
          root=Path('/tmp/osminog-3.8.61')
          manifest=json.loads((root/'manifest.json').read_text(encoding='utf-8'))
          assert manifest['version']=='3.8.61'
          assert manifest['short_name']=='OSMINOG'
          assert manifest['key']==''
          for p in root.rglob('*.json'):
              json.loads(p.read_text(encoding='utf-8'))
          old=re.compile(r'\b(?:BriefCraft|BRIEFCRAFT)\b')
          for p in root.rglob('*'):
              if p.is_file() and p.suffix.lower() in {'.js','.html','.css','.json','.svg','.md','.txt'}:
                  assert not old.search(p.read_text(encoding='utf-8')), f'legacy visible brand in {p}'
          for p in root.glob('*.html'):
              text=p.read_text(encoding='utf-8')
              ids=re.findall(r'\bid=["\']([^"\']+)["\']', text)
              assert len(ids)==len(set(ids)), f'duplicate ids in {p}'
          PY
          find /tmp/osminog-3.8.61 -maxdepth 1 -type f -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Publish immutable release and dev feed
        shell: bash
        run: |
          set -euo pipefail
          release='briefcraft/releases/3.8.61'
          target="$release/chrome-extension"
          rm -rf "$release"
          mkdir -p "$target"
          cp -a /tmp/osminog-3.8.61/. "$target/"
          cp /tmp/OSMINOG-Chrome-3.8.61-ROOT.tar.xz "$release/OSMINOG-Chrome-3.8.61-ROOT.tar.xz"
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, datetime
          root=Path('briefcraft/releases/3.8.61/chrome-extension')
          base='https://raw.githubusercontent.com/jeep-jim/chernogram_new/briefcraft-releases/briefcraft/releases/3.8.61/chrome-extension/'
          files=[]
          for p in sorted(x for x in root.rglob('*') if x.is_file()):
              rel=p.relative_to(root).as_posix()
              data=p.read_bytes()
              files.append({'path':rel,'url':base+rel,'sha256':hashlib.sha256(data).hexdigest(),'size':len(data)})
          fileset={'schema':'briefcraft-fileset/v1','version':'3.8.61','baseVersion':'3.8.60','files':files,'patches':[],'delete':[]}
          fs=(json.dumps(fileset,ensure_ascii=False,indent=2)+'\n').encode()
          (root/'fileset.json').write_bytes(fs)
          now=datetime.datetime.now(datetime.timezone.utc).replace(microsecond=0).isoformat().replace('+00:00','Z')
          feed_path=Path('briefcraft/channels/dev/chrome-extension.json')
          feed=json.loads(feed_path.read_text(encoding='utf-8')) if feed_path.exists() else {'schema':'briefcraft-update-feed/v1','history':[]}
          old=feed.get('latest')
          history=feed.get('history') or []
          if old and old.get('version')!='3.8.61' and not any(x.get('version')==old.get('version') for x in history):
              history.insert(0,{k:old.get(k) for k in ('version','platform','kind','url','sha256','size','notes','publishedAt') if old.get(k) is not None})
          feed.update({'schema':'briefcraft-update-feed/v1','product':'OSMINOG','channel':'dev','generatedAt':now})
          feed['latest']={
              'version':'3.8.61','platform':'chrome-extension-dev','kind':'fileset',
              'url':'https://raw.githubusercontent.com/jeep-jim/chernogram_new/briefcraft-releases/briefcraft/releases/3.8.61/chrome-extension/fileset.json',
              'sha256':hashlib.sha256(fs).hexdigest(),'size':len(fs),
              'notes':'Visible product rebrand to OSMINOG. Temporary mark: plain red circle. Hidden legacy identifiers remain for compatibility.',
              'publishedAt':now
          }
          feed['history']=history[:20]
          feed_path.parent.mkdir(parents=True,exist_ok=True)
          feed_path.write_text(json.dumps(feed,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          archive=Path('briefcraft/releases/3.8.61/OSMINOG-Chrome-3.8.61-ROOT.tar.xz').read_bytes()
          meta={
              'product':'OSMINOG','version':'3.8.61','baseVersion':'3.8.60',
              'sourceFileCount':len(files),
              'archiveSha256':hashlib.sha256(archive).hexdigest(),'archiveSize':len(archive),
              'filesetSha256':hashlib.sha256(fs).hexdigest(),'filesetSize':len(fs),
              'checks':{'javascriptSyntax':True,'jsonParse':True,'duplicateHtmlIds':False,'fixedManifestKeyPreserved':True,'visibleLegacyBrandOccurrences':0}
          }
          Path('briefcraft/releases/3.8.61/release.json').write_text(json.dumps(meta,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY

      - name: Commit published release
        shell: bash
        run: |
          set -euo pipefail
          rm -rf bootstrap
          rm -f .github/workflows/publish-osminog-3.8.61.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Publish OSMINOG Chrome 3.8.61 rebrand'
          git push origin HEAD:briefcraft-releases
