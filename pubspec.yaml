name: chernogram
description: Chernogram — lightweight private chats, voice calls and video calls
publish_to: 'none'
version: 0.51.0+74

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  app_links: ^7.0.0
  audio_service: ^0.18.18
  camera: ^0.12.0+2
  cryptography: ^2.9.0
  file_picker: 10.3.10
  firebase_core: ^4.12.1
  firebase_messaging: ^16.4.3
  flutter_background_service: ^5.1.0
  flutter_contacts: ^1.1.9+2
  flutter_local_notifications: ^22.2.0
  flutter_webrtc: ^1.5.2
  http: ^1.5.0
  just_audio: ^0.10.6
  local_auth: ^3.0.2
  mobile_scanner: ^7.4.0
  open_filex: ^4.7.0
  ota_update: ^7.1.0
  package_info_plus: ^8.3.1
  path_provider: ^2.1.5
  permission_handler: ^12.0.3
  photo_manager: ^3.10.0
  qr_flutter: ^4.1.0
  record: ^6.2.1
  share_plus: ^10.1.4
  shared_preferences: ^2.2.2
  url_launcher: ^6.3.1
  video_player: ^2.13.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
