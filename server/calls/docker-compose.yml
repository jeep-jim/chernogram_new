services:
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--appendonly", "yes"]
    volumes:
      - calls-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  coturn:
    image: ${COTURN_IMAGE:-coturn/coturn:4.7.0}
    restart: unless-stopped
    network_mode: host
    command: ["-c", "/etc/coturn/turnserver.conf"]
    volumes:
      - ./generated/turnserver.conf:/etc/coturn/turnserver.conf:ro
      - ./certs:/certs:ro

  livekit:
    image: ${LIVEKIT_IMAGE:-livekit/livekit-server:v1.12.0}
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    network_mode: host
    command: ["--config", "/etc/livekit/livekit.yaml"]
    volumes:
      - ./generated/livekit.yaml:/etc/livekit/livekit.yaml:ro

  token-broker:
    build: ./token_broker
    restart: unless-stopped
    env_file: .env
    environment:
      LIVEKIT_PUBLIC_URL: ${LIVEKIT_PUBLIC_URL}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}
      CERNOGRAM_ACCESS_TOKEN_SECRET: ${CERNOGRAM_ACCESS_TOKEN_SECRET}
      CERNOGRAM_CALL_TICKET_SECRET: ${CERNOGRAM_CALL_TICKET_SECRET}
      CERNOGRAM_CALL_TICKET_ISSUER_SECRET: ${CERNOGRAM_CALL_TICKET_ISSUER_SECRET}
      CALL_TOKEN_TTL: ${CALL_TOKEN_TTL:-300}
      CALL_TICKET_TTL: ${CALL_TICKET_TTL:-90}
      CG_CALLS_ALLOW_INSECURE_DEV: ${CG_CALLS_ALLOW_INSECURE_DEV:-0}
    ports:
      - "127.0.0.1:8082:8082"

volumes:
  calls-redis:
