services:
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  livekit:
    image: livekit/livekit-server:v1.13.4
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    command:
      - --config
      - /etc/livekit.yaml
      - --bind
      - 0.0.0.0
      - --node-ip
      - ${LIVEKIT_NODE_IP:-127.0.0.1}
    volumes:
      - ./infra/livekit/livekit.yaml:/etc/livekit.yaml:ro
    ports:
      - "7880:7880/tcp"
      - "7881:7881/tcp"
      - "3478:3478/udp"
      - "50000-50100:50000-50100/udp"

  broker:
    build:
      context: ./services/livekit_broker
    restart: unless-stopped
    depends_on:
      - livekit
    environment:
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-devkey}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-secret}
      LIVEKIT_WS_URL: ${LIVEKIT_WS_URL:-ws://127.0.0.1:7880}
      BROKER_SHARED_SECRET: ${BROKER_SHARED_SECRET:-}
      BROKER_CORS_ORIGIN: ${BROKER_CORS_ORIGIN:-*}
      BROKER_BIND_HOST: 0.0.0.0
      BROKER_PORT: 8090
      BROKER_TOKEN_TTL_MINUTES: 30
    ports:
      - "8090:8090/tcp"
